/* ---------- course content (sample wording, to be reviewed by a qualified safeguarding professional) ---------- */
const DEFAULT_COURSE={
 id:'sgs',title:'Safeguarding Children in Schools',version:'1.0',status:'Published',price:20,audienceType:'staff',audienceShort:'All school staff',overview:'This course gives every member of staff a clear understanding of their safeguarding responsibilities in school. It is built around short video lessons, with interactive notes that open at the right moment to give examples, definitions and practical guidance.',
 short:'Core safeguarding training for everyone who works in a school: recognising concerns, responding to disclosures and reporting to the DSL.',
 audience:'All school staff: teachers, teaching assistants, support, office and site staff, governors and regular volunteers.',
 duration:'About 2 hours, at your own pace',
 objectives:['Explain what safeguarding and child protection mean in a school','Recognise possible signs of abuse, neglect and exploitation','Respond calmly and appropriately when a child shares a concern','Record and report concerns to the Designated Safeguarding Lead','Understand professional boundaries and safer working practice','Identify online safety risks and how to report them'],
 modules:[
 {id:'m1',title:'Introduction to Safeguarding',lessons:[{id:'l1',title:'Why safeguarding matters',dur:110,
  scenes:[
   {t:0,layout:'title',kicker:'Module 1 · Introduction to Safeguarding',title:'Safeguarding is everyone’s responsibility'},
   {t:14,layout:'grid',kicker:'What safeguarding means',title:'Four parts of safeguarding',items:['<b>Protect</b>Children from maltreatment','<b>Prevent</b>Harm to health or development','<b>Provide</b>Safe and effective care','<b>Act</b>So every child has the best outcomes']},
   {t:44,layout:'callout',kicker:'Statutory guidance',title:'Keeping Children Safe in Education',items:['Schools in England must have regard to it','All staff read at least Part one','Your school policy explains local procedures']},
   {t:70,layout:'list',kicker:'Who to tell',title:'Your Designated Safeguarding Lead',items:['A senior member of staff','Leads on safeguarding and child protection','Supported by one or more deputies','Know their name and how to reach them']},
   {t:94,layout:'quote',kicker:'Key principle',title:'“It could happen here.”',items:['If in doubt, speak to the DSL.']}],
  captions:[[0,'Welcome to Safeguarding Children in Schools.'],[5,'Everyone who works in a school has a part to play in keeping children safe.'],[14,'Safeguarding is a wider idea than child protection.'],[20,'It means protecting children from maltreatment, and preventing harm to their health or development.'],[30,'It means making sure children grow up with safe and effective care, and acting so every child can have the best outcomes.'],[44,'In England, schools must have regard to the statutory guidance Keeping Children Safe in Education.'],[52,'All staff should read at least Part one, and understand their school’s own safeguarding policy.'],[62,'Your school’s policy explains how the guidance works in your setting.'],[70,'Every school has a Designated Safeguarding Lead, often called the DSL.'],[77,'The DSL is a senior member of staff with lead responsibility for safeguarding and child protection.'],[86,'Make sure you know who your DSL and deputies are, and how to contact them.'],[94,'Keep an attitude of: it could happen here.'],[101,'If you are ever unsure, speak to the DSL straight away.']],
  notes:[
   {id:'n1a',t:18,title:'Safeguarding and child protection',essential:true,style:'panel',body:'<p><b>Safeguarding</b> is the wide umbrella: everything a school does to keep children safe and help them thrive.</p><p><b>Child protection</b> is one part of it: the action taken when a child is suffering, or is likely to suffer, significant harm.</p><h4>Remember</h4><ul><li>Safeguarding is about prevention as well as response.</li><li>Every member of staff has a role, not only the DSL.</li></ul>'},
   {id:'n1b',t:48,title:'Keeping Children Safe in Education 2026',essential:true,style:'panel',body:'<p>Keeping Children Safe in Education (KCSIE) is statutory guidance for schools and colleges in England. The current edition came into force on <b>1 September 2026</b>.</p><ul><li>All staff should read at least <b>Part one</b>. The 2026 edition removed Annex A, the shorter version some staff used to read instead. The Department for Education also publishes a short overview of Part one for all staff.</li><li>It is usually updated each September. Check you have read the current version.</li><li>Your school’s child protection policy sets out local procedures.</li></ul><p class="note-warn">This course supports your school’s own procedures. It does not replace them.</p>'},
   {id:'n1c',t:80,title:'Who is the DSL?',style:'popup',body:'<p>The Designated Safeguarding Lead is a senior member of staff who takes lead responsibility for safeguarding and child protection.</p><h4>What staff should do</h4><ul><li>Know the names of the DSL and deputies.</li><li>Know how to reach them during the school day and on trips.</li></ul>'},
   {id:'n1d',t:97,title:'“It could happen here”',style:'card',body:'<p>Abuse happens in every kind of community. Staff should never assume a child is safe because of their family, background or school.</p>'}]}]},
 {id:'m2',title:'Recognising Abuse and Neglect',lessons:[{id:'l2',title:'Types and signs of abuse',dur:120,
  scenes:[
   {t:0,layout:'title',kicker:'Module 2 · Recognising Abuse and Neglect',title:'Knowing what to look for'},
   {t:12,layout:'grid',kicker:'Four categories',title:'Types of abuse',items:['<b>Physical</b>Hitting, shaking, burning or other harm','<b>Emotional</b>Persistent ill treatment that harms development','<b>Sexual</b>Forcing or enticing a child into sexual activity','<b>Neglect</b>Persistent failure to meet basic needs']},
   {t:46,layout:'list',kicker:'Possible signs',title:'Things you might notice',items:['Changes in behaviour or mood','Injuries with no clear explanation','Often hungry, tired or unkempt','Frequent or unexplained absence']},
   {t:74,layout:'callout',kicker:'Between children',title:'Child-on-child abuse',items:['Can happen in and out of school, and online','Never dismiss it as banter or growing up','Report it to the DSL like any other concern']},
   {t:98,layout:'quote',kicker:'Key principle',title:'You don’t need proof to share a worry.',items:['Pass it to the DSL. They decide what happens next.']}],
  captions:[[0,'In this module we look at the different forms abuse and neglect can take.'],[12,'There are four main categories of abuse: physical, emotional, sexual and neglect.'],[22,'Physical abuse may involve hitting, shaking, throwing, burning or otherwise causing physical harm.'],[30,'Emotional abuse is persistent ill treatment that seriously affects a child’s emotional development.'],[37,'Neglect is the persistent failure to meet a child’s basic physical or psychological needs.'],[46,'Signs are not always obvious. Look out for changes in behaviour or mood.'],[54,'You might notice injuries with no clear explanation, or a child who is often hungry, tired or unkempt.'],[64,'Frequent or unexplained absence, being on a part-time timetable, or being repeatedly removed from class can also be warning signs.'],[74,'Abuse can also happen between children. This is called child-on-child abuse.'],[82,'It should never be dismissed as banter or part of growing up.'],[90,'Report it to the DSL in the same way as any other concern.'],[98,'You do not need proof to share a worry.'],[105,'Pass it to the DSL. They will decide what happens next.']],
  notes:[
   {id:'n2a',t:16,title:'The four categories of abuse',essential:true,style:'panel',body:'<ul><li><b>Physical:</b> causing physical harm, such as hitting, shaking or burning.</li><li><b>Emotional:</b> persistent emotional ill treatment, such as making a child feel worthless or frightened.</li><li><b>Sexual:</b> forcing or enticing a child to take part in sexual activity, including online.</li><li><b>Neglect:</b> persistent failure to meet basic needs, such as food, clothing, supervision or medical care.</li></ul><p>A child may experience more than one type at the same time.</p>'},
   {id:'n2b',t:56,title:'Recognising signs of neglect',essential:true,style:'panel',body:'<h4>Possible signs</h4><ul><li>Regularly hungry or asking for food</li><li>Poor hygiene or unsuitable clothing for the weather</li><li>Untreated medical or dental problems</li><li>Often tired, or left without supervision</li></ul><p class="note-warn">One sign on its own may have an innocent explanation. Record what you notice and share it with the DSL, who can see the wider picture.</p>'},
   {id:'n2e',t:66,title:'Children who may need extra support',essential:true,style:'panel',body:'<p>KCSIE 2026 asks all staff to be particularly alert to children who may need early help. This now includes children who:</p><ul><li>have been repeatedly removed from the classroom, suspended several times, or are on a part-time timetable</li><li>are at risk of permanent exclusion, or attend alternative provision</li><li>are pregnant or are a parent themselves</li><li>show early signs of abusive, violent or harmful behaviour</li><li>are at risk of being radicalised</li><li>are young carers, or need support with their mental health</li></ul><p>Staff should also be alert to prejudice-based harm, such as racism or faith-based prejudice.</p>'},
   {id:'n2c',t:80,title:'Child-on-child abuse',style:'popup',body:'<p>This includes bullying, physical abuse, sexual violence and harassment, and sharing images without consent.</p><h4>What staff should avoid</h4><ul><li>Saying “boys will be boys” or treating it as banter</li><li>Deciding on your own that it is not serious</li></ul>'},
   {id:'n2d',t:102,title:'Exploitation and modern slavery',style:'card',body:'<p>Children can be exploited sexually (CSE) or criminally (CCE), for example to carry drugs or money, or financially. Gifts, older friends and unexplained money can be warning signs. KCSIE 2026 also lists modern slavery as a form of harm staff should be aware of.</p>'}]}]},
 {id:'m3',title:'Responding to a Child’s Disclosure',lessons:[{id:'l3',title:'When a child tells you',dur:120,
  scenes:[
   {t:0,layout:'title',kicker:'Module 3 · Responding to a Disclosure',title:'When a child tells you something worrying'},
   {t:12,layout:'list',kicker:'Do',title:'How to respond',items:['Stay calm and listen carefully','Let the child speak in their own words','Reassure them they were right to tell you','Explain what will happen next']},
   {t:42,layout:'list',cls:'l-avoid',kicker:'Avoid',title:'What not to do',items:['Promising to keep it a secret','Asking leading questions','Showing shock or disbelief','Investigating it yourself']},
   {t:70,layout:'callout',kicker:'Then act',title:'Record it and tell the DSL',items:['Write down what was said, as soon as you can','Tell the DSL straight away','If a child is in immediate danger, call 999']},
   {t:98,layout:'quote',kicker:'Key principle',title:'Listen, reassure, pass it on.',items:['You don’t need all the answers.']}],
  captions:[[0,'This module covers what to do if a child tells you something worrying. This is called a disclosure.'],[12,'Stay calm and listen carefully. Give the child your full attention.'],[19,'Let them tell you in their own words, at their own pace.'],[26,'Reassure them that they were right to tell you, and that they will be taken seriously.'],[34,'Explain, in a way they understand, what will happen next.'],[42,'There are some things to avoid.'],[46,'Never promise to keep what they tell you a secret.'],[53,'Avoid leading questions that suggest an answer, such as asking who hurt them.'],[60,'Try not to show shock or disbelief, and do not try to investigate it yourself.'],[70,'As soon as you can, write down what the child said, using their own words.'],[78,'Tell the DSL straight away. Do not wait until the end of the day.'],[86,'If a child is in immediate danger, call 999 and then inform the DSL.'],[98,'Listen, reassure, and pass it on.'],[104,'You are not expected to have all the answers.']],
  notes:[
   {id:'n3a',t:16,title:'Explore: Responding to a Disclosure',essential:true,style:'panel',body:'<h4>Important things to remember</h4><ul><li>Listen more than you speak.</li><li>Use the child’s words. Do not correct or rephrase them.</li><li>Stay with the child’s pace. Silence is fine.</li></ul><h4>What staff should do</h4><ul><li>Reassure: “You’ve done the right thing by telling me.”</li><li>Explain next steps: “I need to share this with someone whose job is to help keep you safe.”</li></ul><h4>School scenario</h4><p>At lunchtime a Year 4 pupil says, “I don’t want to go home because of what happens.” You listen, say “Tell me more if you want to”, and do not press for detail.</p>'},
   {id:'n3b',t:48,title:'Why you can’t promise secrecy',essential:true,style:'panel',body:'<p>If you promise to keep a secret and then have to share it, the child may feel let down and stop trusting adults.</p><p>Instead, say kindly that you cannot keep it a secret, and that you will only tell the people who need to know so they can help.</p>'},
   {id:'n3c',t:56,title:'Open, not leading, questions',style:'popup',body:'<h4>Open prompts</h4><ul><li>“Tell me more.”</li><li>“Is there anything else you want to tell me?”</li></ul><h4>Avoid</h4><ul><li>“Did your dad do that?”</li><li>“Was it at home?”</li></ul>'},
   {id:'n3d',t:88,title:'If a child is in immediate danger',style:'card',body:'<p>Call <b>999</b>. Then inform the DSL. Anyone can make a referral to children’s social care if they believe a child is at risk of significant harm.</p>'}]}]},
 {id:'m4',title:'Recording and Reporting Concerns',lessons:[{id:'l4',title:'Recording and reporting',dur:115,
  scenes:[
   {t:0,layout:'title',kicker:'Module 4 · Recording and Reporting',title:'Write it down. Pass it on.'},
   {t:12,layout:'list',kicker:'Record',title:'A good record includes',items:['Date, time and place','The child’s own words','Facts, not opinions or guesses','Your name and signature']},
   {t:42,layout:'callout',kicker:'Report',title:'Tell the DSL the same day',items:['Use your school’s system, on paper or online','Don’t wait to collect more evidence','Anyone can refer to children’s social care']},
   {t:68,layout:'grid',kicker:'Concerns about adults',title:'Who to tell',items:['<b>A staff member</b>Tell the headteacher','<b>The headteacher</b>Tell the chair of governors','<b>Local authority</b>The LADO advises on allegations','<b>Not acted on?</b>Use whistleblowing routes']},
   {t:96,layout:'quote',kicker:'Key principle',title:'Never assume someone else has reported it.',items:['Share it yourself.']}],
  captions:[[0,'Once you have a concern, you need to record it and report it.'],[12,'A good record includes the date, time and place.'],[18,'Use the child’s own words wherever you can.'],[25,'Stick to facts. Do not include opinions or guesses as if they were facts.'],[33,'Add your name, sign it, and pass it on.'],[42,'Report your concern to the DSL the same day, using your school’s system.'],[50,'Do not wait to collect more evidence before you report.'],[58,'Anyone can make a referral directly to children’s social care.'],[68,'If your concern is about a member of staff, tell the headteacher.'],[75,'If it is about the headteacher, tell the chair of governors.'],[82,'The Local Authority Designated Officer, or LADO, advises on allegations against adults.'],[89,'If you feel a concern has not been acted on, use your school’s whistleblowing procedure.'],[96,'Never assume someone else has already reported it.'],[103,'Share it yourself.']],
  notes:[
   {id:'n4a',t:20,title:'What a good record includes',essential:true,style:'panel',body:'<ul><li>The date, time and place</li><li>What you saw or heard, in the child’s own words</li><li>Who was present</li><li>Any action you took</li><li>Your name, role and signature</li></ul><p class="note-warn">Keep it factual. If you include an opinion, make it clear that it is your opinion and explain why.</p>'},
   {id:'n4b',t:46,title:'Reporting to the DSL',essential:true,style:'panel',body:'<p>Report concerns to the DSL (or a deputy) as soon as possible and on the same day. If neither is available, speak to a senior leader.</p><p>Don’t investigate, and don’t contact the family yourself unless the DSL asks you to.</p>'},
   {id:'n4e',t:56,title:'Sharing information to keep children safe',essential:true,style:'panel',body:'<p>A new legal duty to share information to safeguard children applies from <b>30 September 2026</b>, with its own statutory guidance for schools and other agencies.</p><ul><li>Data protection law does not stop you sharing information to keep a child safe.</li><li>Pass information to the DSL, who decides what to share with other agencies and how.</li><li>Never promise a child that you will keep information secret.</li></ul>'},
   {id:'n4c',t:72,title:'Concerns about a member of staff',style:'popup',body:'<p>Report to the headteacher. If the concern is about the headteacher, report to the chair of governors. The LADO is involved in allegations that an adult may have harmed a child.</p>'},
   {id:'n4d',t:92,title:'Whistleblowing',style:'card',body:'<p>If you have raised a concern and it has not been dealt with, follow your school’s whistleblowing policy. You can also call the NSPCC Whistleblowing Advice Line on 0800 028 0285.</p>'}]}]},
 {id:'m5',title:'Professional Responsibilities',lessons:[{id:'l5',title:'Boundaries and safer working',dur:105,
  scenes:[
   {t:0,layout:'title',kicker:'Module 5 · Professional Responsibilities',title:'Keeping clear, professional boundaries'},
   {t:12,layout:'list',kicker:'Boundaries',title:'Safer working practice',items:['Follow the staff code of conduct','Contact pupils only through school systems','No personal social media contact with pupils','Avoid situations that could be misunderstood']},
   {t:44,layout:'callout',kicker:'Low-level concerns',title:'Small things still matter',items:['Behaviour that isn’t right but isn’t harm','Share it under your school’s policy','Includes self-reporting your own mistakes']},
   {t:76,layout:'quote',kicker:'Key principle',title:'Notice, record, report. Don’t investigate.',items:['That job belongs to the DSL.']}],
  captions:[[0,'Professional boundaries protect children, and they protect you.'],[12,'Follow your school’s staff code of conduct at all times.'],[19,'Contact pupils and parents only through approved school systems.'],[27,'Do not connect with pupils on personal social media.'],[34,'Avoid situations that could be misunderstood, and follow your school’s guidance on safer working.'],[44,'A low-level concern is behaviour by an adult that does not meet the threshold of harm, but is not consistent with the code of conduct.'],[56,'It should still be shared, following your school’s policy.'],[64,'This includes reporting yourself if you realise you have made a mistake.'],[76,'Your role is to notice, record and report.'],[84,'Investigating is the job of the DSL and, where needed, other agencies.']],
  notes:[
   {id:'n5a',t:20,title:'Professional boundaries',essential:true,style:'panel',body:'<ul><li>Use school email and platforms, never personal phones or accounts, to contact pupils.</li><li>Do not give pupils gifts or special treatment outside school policy.</li><li>Be careful with lifts, one-to-one situations and physical contact. Follow your school’s guidance.</li></ul>'},
   {id:'n5b',t:50,title:'Low-level concerns',essential:true,style:'panel',body:'<p>A low-level concern is any concern, however small, that an adult may have acted in a way that is inconsistent with the staff code of conduct, but which does not meet the threshold for an allegation of harm.</p><p>Examples include being over-friendly with pupils, or having favourites. Share them in line with your school’s policy.</p>'},
   {id:'n5c',t:80,title:'Why you shouldn’t investigate',style:'card',body:'<p>Questioning a child repeatedly, or speaking to the family, can cause distress and may harm any later inquiry. Pass it to the DSL.</p>'}]}]},
 {id:'m6',title:'Online Safety and Emerging Risks',lessons:[{id:'l6',title:'Keeping children safe online',dur:115,
  scenes:[
   {t:0,layout:'title',kicker:'Module 6 · Online Safety',title:'Online and offline harm are connected'},
   {t:12,layout:'grid',kicker:'The 4 Cs',title:'Areas of online risk',items:['<b>Content</b>Harmful or illegal material','<b>Contact</b>Harmful contact with others','<b>Conduct</b>Behaviour that causes harm','<b>Commerce</b>Scams, gambling, pressure to buy']},
   {t:44,layout:'list',kicker:'If an image is shared',title:'Nudes or semi-nudes',items:['Do not view, copy, print or forward it','Do not ask the child to delete it','Report to the DSL straight away']},
   {t:72,layout:'callout',kicker:'Systems',title:'Filtering and monitoring',items:['Schools use systems to block and flag content','Report anything concerning that gets through','All staff share responsibility']},
   {t:98,layout:'quote',kicker:'Key principle',title:'Treat online concerns like any other concern.',items:['Record and report.']}],
  captions:[[0,'Children’s lives online and offline are closely connected.'],[12,'Online risks are often grouped into four areas, called the 4 Cs.'],[18,'Content: being exposed to harmful or illegal material, including misinformation, disinformation and conspiracy theories.'],[24,'Contact: being subjected to harmful contact with others.'],[30,'Conduct: online behaviour that increases the chance of, or causes, harm.'],[36,'Commerce: risks such as scams, online gambling and pressure to buy.'],[44,'If you learn that a nude or semi-nude image of a child has been shared, do not view, copy, print or forward it.'],[54,'Do not ask the child to delete it.'],[60,'Report it to the DSL straight away, and follow their instructions.'],[72,'Schools use filtering and monitoring systems to block and flag harmful content.'],[80,'If something worrying gets through, or you see a problem, report it.'],[98,'Treat online concerns in the same way as any other concern.'],[104,'Record and report.']],
  notes:[
   {id:'n6a',t:16,title:'The 4 Cs of online risk',essential:true,style:'panel',body:'<ul><li><b>Content:</b> illegal, inappropriate or harmful material, such as pornography, extremist content, self-harm imagery, and misinformation, disinformation and conspiracy theories.</li><li><b>Contact:</b> harmful contact, such as grooming or adults posing as children.</li><li><b>Conduct:</b> behaviour such as bullying, or making or sharing images without consent, including AI-generated images such as deepfakes.</li><li><b>Commerce:</b> scams, online gambling, phishing and inappropriate advertising.</li></ul>'},
   {id:'n6b',t:50,title:'If an image is shared',essential:true,style:'panel',body:'<p class="note-warn">Never view, copy, print, share, store or save the image, and never ask a child to share or download it. Do not delete it or ask the child to delete it.</p><ul><li>This applies to AI-generated images too, such as deepfakes or “nudified” photos of real pupils.</li><li>Confiscate the device only if your school policy says so.</li><li>Tell the DSL straight away.</li><li>Record what you were told, not what is in the image.</li></ul>'},
   {id:'n6c',t:76,title:'Filtering, monitoring and phones',style:'popup',body:'<p>All staff should know how their school’s filtering and monitoring works and how to report a problem. Systems should also deal with AI-generated content.</p><p>Since 1 September 2026, statutory guidance expects schools to be <b>mobile phone-free</b> throughout the school day by default. Know your school’s policy.</p>'}]}]}
 ]};

/* Online safety courses (sample wording, to be reviewed by a qualified safeguarding professional) */
const COURSE_OST={
 id:'ost',title:'Online Safety for Teachers',version:'1.0',status:'Published',price:18,audienceType:'staff',audienceShort:'Teachers and support staff',
 short:'Practical online safety for school staff: online risks, grooming, cyberbullying, nude image sharing, and safe practice in the classroom.',
 overview:'This course helps teachers and support staff recognise online risks to children and respond confidently. It covers the 4 Cs of online risk, grooming and sextortion, cyberbullying and harmful content, what to do when nude or semi-nude images are shared, and how to teach and work safely online.',
 audience:'Teachers, teaching assistants, pastoral staff and anyone who works with pupils using technology.',
 duration:'About 90 minutes, at your own pace',
 objectives:['Describe the 4 Cs of online risk and how they appear in school life','Recognise warning signs of grooming and sextortion','Respond to cyberbullying and harmful online content','Follow the correct steps when nude or semi-nude images are shared','Know where to report online concerns, including CEOP and Report Remove','Teach and work safely online, including with filtering, monitoring and AI tools'],
 modules:[
 {id:'om1',title:'Understanding Online Risk',lessons:[{id:'ol1',title:'Children’s lives online',dur:100,
  scenes:[
   {t:0,layout:'title',kicker:'Module 1 · Understanding Online Risk',title:'Online safety is safeguarding'},
   {t:12,layout:'list',kicker:'Where children are',title:'Children’s online world',items:['Games with live chat','Video sharing and livestreams','Messaging and group chats','AI chatbots and new apps']},
   {t:38,layout:'grid',kicker:'The 4 Cs',title:'Four areas of risk',items:['<b>Content</b>Seeing harmful or illegal material','<b>Contact</b>Harmful contact from others','<b>Conduct</b>Behaviour that causes harm','<b>Commerce</b>Scams, gambling and pressure to buy']},
   {t:72,layout:'quote',kicker:'Key principle',title:'An online concern is a safeguarding concern.',items:['Record it and tell the DSL.']}],
  captions:[[0,'Most children spend part of every day online.'],[6,'That means online safety is part of safeguarding, not a separate subject.'],[12,'Children play games with live chat, watch and share videos, and talk in group chats.'],[24,'Many also use AI chatbots and new apps that adults may not know well.'],[38,'Keeping Children Safe in Education groups online risk into four areas, the 4 Cs.'],[46,'Content: seeing harmful or illegal material, including misinformation, disinformation and conspiracy theories.'],[52,'Contact: harmful contact from other people, including adults posing as children.'],[59,'Conduct: behaviour online that causes harm, such as bullying or sharing images.'],[65,'Commerce: scams, online gambling and pressure to buy.'],[72,'An online concern is a safeguarding concern.'],[80,'Record what you know and tell the DSL, just as you would for any other worry.']],
  notes:[
   {id:'o1a',t:42,title:'The 4 Cs in school life',essential:true,style:'panel',body:'<ul><li><b>Content:</b> a violent video going round a group chat, or a conspiracy theory a pupil believes is true.</li><li><b>Contact:</b> a pupil says a new online “friend” wants to video call privately.</li><li><b>Conduct:</b> pupils share an edited or AI-generated photo of a classmate to mock them.</li><li><b>Commerce:</b> a pupil has spent money on in-game items after a scam offer.</li></ul><p>Since 2025, KCSIE lists misinformation, disinformation and conspiracy theories as content risks.</p>'},
   {id:'o1b',t:76,title:'Online safety in KCSIE 2026',essential:true,style:'panel',body:'<p>Keeping Children Safe in Education 2026 (in force from 1 September 2026) expects all staff to understand online safety as part of safeguarding, including the 4 Cs, filtering and monitoring, and the risks of generative AI, such as deepfakes.</p><p class="note-warn">Follow your school’s child protection policy for any online concern.</p>'},
   {id:'o1c',t:28,title:'New and emerging technology',style:'card',body:'<p>Apps change fast. You don’t need to know every app. Focus on the behaviour and the risk: who is the child talking to, what are they seeing, and how do they feel?</p>'}]}]},
 {id:'om2',title:'Grooming and Online Contact',lessons:[{id:'ol2',title:'Grooming and sextortion',dur:105,
  scenes:[
   {t:0,layout:'title',kicker:'Module 2 · Grooming and Online Contact',title:'When contact becomes grooming'},
   {t:12,layout:'list',kicker:'How it works',title:'What groomers often do',items:['Build trust with flattery and attention','Give gifts, game credit or money','Ask the child to keep it secret','Move the chat to a private app']},
   {t:44,layout:'list',kicker:'Warning signs',title:'Things you might notice',items:['Secrecy about an online friend','Unexplained gifts or money','Upset or withdrawn after being online','Talk of an older “boyfriend” or “girlfriend”']},
   {t:74,layout:'callout',kicker:'Act',title:'Tell the DSL straight away',items:['Don’t contact the other person','Don’t ask the child to show you images','The DSL may report to CEOP or the police']},
   {t:94,layout:'quote',kicker:'Key principle',title:'Secrecy is a red flag.',items:['Share the worry.']}],
  captions:[[0,'Online grooming is when someone builds a relationship with a child to abuse or exploit them.'],[12,'Groomers often build trust with flattery and attention.'],[20,'They may give gifts, game credit or money.'],[28,'They usually ask the child to keep the friendship secret.'],[36,'And they often try to move the conversation to a private or encrypted app.'],[44,'You might notice a child being secretive about an online friend.'],[52,'Or unexplained gifts or money, or a child who seems upset after being online.'],[62,'Some children talk about an older boyfriend or girlfriend they have met online.'],[74,'If you are worried, tell the DSL straight away.'],[80,'Do not contact the other person, and do not ask the child to show you any images.'],[88,'The DSL may report to CEOP or the police.'],[94,'Remember: secrecy is a red flag. Share the worry.']],
  notes:[
   {id:'o2a',t:48,title:'Warning signs of grooming',essential:true,style:'panel',body:'<ul><li>Being secretive about who they talk to online</li><li>Having new things they can’t explain, such as clothes, phones or game credit</li><li>Using sexual language or knowledge unusual for their age</li><li>Seeming anxious or upset when they get a message</li></ul><p>One sign alone may mean nothing. Share what you notice with the DSL.</p>'},
   {id:'o2b',t:90,title:'Reporting to CEOP',essential:true,style:'panel',body:'<p>CEOP is part of the National Crime Agency. It takes reports about online sexual abuse and grooming at <b>ceop.police.uk</b>.</p><p>In school, report to the DSL first. If a child is in immediate danger, call <b>999</b>.</p>'},
   {id:'o2c',t:66,title:'Sextortion',style:'popup',body:'<p>Financially motivated sexual extortion is when a child is tricked into sharing an image and then threatened unless they pay.</p><h4>Advice for the child</h4><ul><li>Don’t pay or send more.</li><li>Stop contact and block, but keep the messages as evidence.</li><li>Tell a trusted adult. It is not their fault.</li></ul>'}]}]},
 {id:'om3',title:'Cyberbullying and Harmful Content',lessons:[{id:'ol3',title:'Bullying, harmful content and radicalisation',dur:100,
  scenes:[
   {t:0,layout:'title',kicker:'Module 3 · Cyberbullying and Harmful Content',title:'Harm that follows children home'},
   {t:10,layout:'list',kicker:'Cyberbullying',title:'What it can look like',items:['Unkind messages or comments','Leaving someone out of group chats','Pretending to be someone else','Sharing photos to embarrass someone']},
   {t:40,layout:'callout',kicker:'Harmful content',title:'Content that can cause harm',items:['Self-harm and suicide content','Extreme violence or misogyny','Extremist or radicalising material']},
   {t:68,layout:'list',kicker:'Respond',title:'What to do',items:['Listen and take it seriously','Keep evidence of messages','Follow your behaviour and anti-bullying policies','Tell the DSL if a child may be at risk']},
   {t:90,layout:'quote',kicker:'Key principle',title:'It’s not “just online”.',items:['The harm is real.']}],
  captions:[[0,'Online bullying and harmful content can follow children home and into their bedrooms.'],[10,'Cyberbullying includes unkind messages and comments, and leaving someone out of group chats.'],[20,'It can also mean pretending to be someone else, or sharing photos to embarrass someone.'],[40,'Some content can cause serious harm, such as content promoting self-harm or suicide.'],[50,'Children may also see extreme violence, misogyny, or extremist material that could draw them in.'],[60,'Concerns about radicalisation should be shared with the DSL under the Prevent duty.'],[68,'If a child tells you about bullying or harmful content, listen and take it seriously.'],[75,'Keep evidence of messages, and follow your behaviour and anti-bullying policies.'],[82,'Tell the DSL if a child may be at risk of harm.'],[90,'It is never just online. The harm is real.']],
  notes:[
   {id:'o3a',t:72,title:'Responding to cyberbullying',essential:true,style:'panel',body:'<ul><li>Reassure the child they did the right thing by telling you.</li><li>Keep evidence: dates, times and screenshots of <b>messages</b> (never of nude images).</li><li>Follow your school’s anti-bullying and behaviour policies.</li><li>Tell the DSL if there is a safeguarding concern.</li></ul>'},
   {id:'o3b',t:58,title:'Harmful content and radicalisation',essential:true,style:'panel',body:'<p>Schools have a duty under Prevent to help stop people being drawn into terrorism. Signs can include a sudden change in views, talking about extremist material, or becoming isolated from friends.</p><p class="note-warn">Share any concern about radicalisation with the DSL. Don’t investigate it yourself.</p>'},
   {id:'o3c',t:86,title:'Report Harmful Content',style:'card',body:'<p>The UK Safer Internet Centre’s Report Harmful Content service helps people report legal but harmful content when a platform has not acted.</p>'}]}]},
 {id:'om4',title:'Sharing Nudes and Semi-nudes',lessons:[{id:'ol4',title:'When images are shared',dur:105,
  scenes:[
   {t:0,layout:'title',kicker:'Module 4 · Sharing Nudes and Semi-nudes',title:'When an image is shared'},
   {t:10,layout:'callout',kicker:'The law',title:'Nude images of under-18s are illegal',items:['Even if the child took the image themselves','Even if it was shared with consent','The child should still be treated as a victim']},
   {t:40,layout:'list',cls:'l-avoid',kicker:'Never',title:'What not to do',items:['View, copy, print or save the image','Forward it, even to the DSL','Delete it, or ask the child to delete it or show you']},
   {t:66,layout:'list',kicker:'Do',title:'What to do',items:['Tell the DSL straight away','Record what you were told','Reassure the child they are not in trouble']},
   {t:90,layout:'quote',kicker:'Key principle',title:'Support the child. Don’t blame them.',items:['The DSL leads from here.']}],
  captions:[[0,'This module covers what to do if nude or semi-nude images of a child are shared.'],[10,'Making or sharing a nude image of anyone under 18 is illegal.'],[17,'That is true even if the child took it themselves, and even if it was shared with consent.'],[28,'The child should still be treated as a victim, not as an offender.'],[40,'Never view, copy, print or save the image.'],[47,'Do not forward it, even to the DSL.'],[54,'And do not ask the child to delete it or to show it to you.'],[66,'Tell the DSL straight away.'],[72,'Record what you were told, not what is in the image.'],[79,'Reassure the child that they are not in trouble for telling you.'],[90,'Support the child. Don’t blame them. The DSL will lead from here.']],
  notes:[
   {id:'o4a',t:20,title:'National guidance for schools',essential:true,style:'panel',body:'<p>The UK Council for Internet Safety (UKCIS) advice <i>Sharing nudes and semi-nudes</i> (2024) explains how the DSL should respond, when to involve parents, and when to refer to the police or children’s social care.</p><ul><li>Never view, copy, print, share, store or save the image.</li><li>Do not delete it, or ask the child to delete it.</li><li>AI-generated or altered images of children, such as deepfakes, are treated in the same way.</li></ul><p class="note-warn">Your role is to pass it on quickly, not to investigate.</p>'},
   {id:'o4b',t:84,title:'Report Remove',essential:true,style:'panel',body:'<p>Report Remove is run by Childline and the Internet Watch Foundation. It helps young people under 18 report a nude image of themselves so it can be removed from the internet.</p><p>The DSL may tell the child about it as part of the school’s response.</p>'},
   {id:'o4c',t:58,title:'Avoiding victim blaming',style:'popup',body:'<h4>Say</h4><ul><li>“You’re not in trouble for telling me.”</li><li>“We’ll help sort this out.”</li></ul><h4>Avoid</h4><ul><li>“Why did you send it?”</li></ul>'}]}]},
 {id:'om5',title:'Safe Practice and Filtering',lessons:[{id:'ol5',title:'Teaching and working safely online',dur:100,
  scenes:[
   {t:0,layout:'title',kicker:'Module 5 · Safe Practice and Filtering',title:'Model the behaviour you teach'},
   {t:10,layout:'list',kicker:'In the classroom',title:'Teaching safely online',items:['Watch videos in full before showing them','Close notifications before screen sharing','Use school accounts and systems only','Check school policy before using AI tools']},
   {t:44,layout:'callout',kicker:'Systems',title:'Filtering and monitoring',items:['Blocks and flags harmful content','Report anything that gets through','Report useful sites that are wrongly blocked']},
   {t:70,layout:'list',kicker:'Your footprint',title:'Protecting yourself',items:['Keep personal accounts private','Never connect with pupils on personal accounts','Think before you post']},
   {t:88,layout:'quote',kicker:'Key principle',title:'Safe staff make safe classrooms.',items:['Follow your code of conduct online too.']}],
  captions:[[0,'Staff model safe online behaviour for children every day.'],[10,'Watch videos in full before showing them in class.'],[17,'Close notifications and other tabs before sharing your screen.'],[24,'Use school accounts and approved systems only.'],[31,'Check your school’s policy before using AI tools, and never enter pupils’ personal information unless the tool is approved.'],[44,'Schools use filtering and monitoring systems to block and flag harmful content.'],[52,'If something harmful gets through, report it using your school’s process.'],[60,'Report useful sites that are wrongly blocked too, so the system works well.'],[70,'Keep your personal social media accounts private.'],[76,'Never connect with pupils on personal accounts, and think before you post.'],[88,'Safe staff make safe classrooms. Your code of conduct applies online too.']],
  notes:[
   {id:'o5a',t:48,title:'Filtering and monitoring standards',essential:true,style:'panel',body:'<p>The Department for Education’s filtering and monitoring standards say how schools should keep pupils safe online. The DSL takes lead responsibility, but every member of staff should know how to report a problem.</p><ul><li>Harmful content that is not blocked, including AI-generated content</li><li>Useful content that is wrongly blocked</li><li>Pupils trying to get around the filter, for example with a VPN</li></ul>'},
   {id:'o5b',t:74,title:'Your digital footprint',essential:true,style:'panel',body:'<ul><li>Set personal accounts to private and check what is visible to the public.</li><li>Don’t accept friend or follow requests from pupils or recent former pupils.</li><li>Don’t post about pupils, colleagues or school incidents.</li></ul>'},
   {id:'o5c',t:34,title:'Using AI tools in class',style:'card',body:'<p>Only use AI tools your school has approved. Schools should check products against the Department for Education’s <i>Generative AI: product safety standards</i>. Never enter pupils’ names or other personal information into a tool that isn’t approved, and check AI output before sharing it with a class.</p>'},
   {id:'o5d',t:82,title:'Phone-free schools',style:'popup',body:'<p>Since 1 September 2026, statutory guidance expects schools in England to be mobile phone-free throughout the school day, including breaks and lunch, by default. Apply your school’s policy consistently, and use school devices and accounts for teaching.</p>'}]}]}
 ]};

const COURSE_OSP={
 id:'osp',title:'Online Safety for Parents',version:'1.0',status:'Published',price:150,licence:true,quizIds:['p1','p3','p6','p7','p11','p12','p15','p16','p18','p19'],audienceType:'parents',audienceShort:'Parents and carers',

 modules:[
 {id:'pm1',title:'Your Child’s Online World',lessons:[{id:'pl1',title:'Games, apps and age ratings',dur:95,
  scenes:[
   {t:0,layout:'title',kicker:'Module 1 · Your Child’s Online World',title:'Getting to know their online world'},
   {t:10,layout:'list',kicker:'What children do',title:'Where children spend time',items:['Games, often with live chat','Watching and making videos','Messaging and group chats','Social media, sometimes too young']},
   {t:40,layout:'grid',kicker:'Age ratings',title:'Check the rating',items:['<b>PEGI 3 and 7</b>Suitable for younger children','<b>PEGI 12</b>Some violence or bad language','<b>PEGI 16 and 18</b>Adult themes and content','<b>Social media</b>Most apps say 13 or over']},
   {t:74,layout:'quote',kicker:'Key principle',title:'Be curious, not furious.',items:['Ask them to show you.']}],
  captions:[[0,'Children’s online lives are a big part of their world, just like school and friends.'],[10,'Many children play games with live chat, where they can talk to people they don’t know.'],[20,'They watch and make videos, and chat with friends in messaging apps and group chats.'],[30,'Some use social media before they are old enough.'],[40,'Games carry PEGI age ratings: 3, 7, 12, 16 and 18.'],[50,'The rating tells you about the content, such as violence or bad language.'],[60,'Most social media apps say users must be at least 13.'],[74,'The best approach is to be curious, not furious.'],[80,'Ask your child to show you the games and apps they enjoy.']],
  notes:[
   {id:'pa1',t:46,title:'Age ratings explained',essential:true,style:'panel',body:'<p>PEGI ratings (3, 7, 12, 16 and 18) describe a game’s content. They don’t cover live chat with other players, which many games include.</p><h4>Tip</h4><p>Check the rating and the chat settings before your child plays.</p>'},
   {id:'pa5',t:30,title:'Fake news and AI images',style:'popup',body:'<p>Children see misinformation, conspiracy theories and AI-made pictures and videos online. Ask: who made this, and why? Show them how to check a story with a trusted source.</p>'},
   {id:'pa2',t:64,title:'Social media age limits',essential:true,style:'panel',body:'<p>Most social media apps say users must be at least 13. Younger children who join may see content and contact that isn’t suitable, and may miss safety features designed for teenagers.</p>'},
   {id:'pa3',t:24,title:'Screen time',style:'card',body:'<p>What your child does online matters as much as how long. Agree screen-free times together, such as meals and the hour before bed.</p>'},
   {id:'pa4',t:84,title:'Phones and school',style:'card',body:'<p>Since September 2026, schools in England are expected to be mobile phone-free throughout the school day. Ask your child’s school about its policy, and how to reach your child in an emergency.</p>'}]}]},
 {id:'pm2',title:'Settings, Controls and Privacy',lessons:[{id:'pl2',title:'Setting things up safely',dur:95,
  scenes:[
   {t:0,layout:'title',kicker:'Module 2 · Settings, Controls and Privacy',title:'Setting things up safely'},
   {t:10,layout:'list',kicker:'Parental controls',title:'Controls you can use',items:['Broadband and mobile network filters','Device and console controls','Approval before downloads or purchases','Limits on in-game chat']},
   {t:42,layout:'callout',kicker:'Privacy',title:'Protect their information',items:['Set accounts to private','Turn off location sharing','Avoid posting school uniform or full names']},
   {t:72,layout:'quote',kicker:'Key principle',title:'Controls help. Conversations matter more.',items:['No filter catches everything.']}],
  captions:[[0,'Settings and controls are a good first step in keeping children safe online.'],[10,'Most broadband and mobile providers offer free filters.'],[17,'Phones, tablets and games consoles have their own parental controls.'],[24,'You can ask to approve downloads and purchases before they happen.'],[31,'And you can limit or turn off chat with strangers in many games.'],[42,'Set your child’s accounts to private, so only people they know can see them.'],[50,'Turn off location sharing unless you have agreed it together.'],[58,'Avoid posting photos that show school uniforms or your child’s full name.'],[72,'Controls help, but conversations matter more.'],[79,'No filter catches everything, so keep talking.']],
  notes:[
   {id:'pb1',t:20,title:'Setting up parental controls',essential:true,style:'panel',body:'<ul><li>Turn on your broadband provider’s free filter.</li><li>Use the family settings on phones, tablets and consoles.</li><li>Set up approval for app downloads and purchases.</li><li>Check settings again after updates or new devices.</li></ul>'},
   {id:'pb2',t:52,title:'Location sharing',essential:true,style:'panel',body:'<p>Some apps can show a child’s location on a map to friends, or to anyone. Check each app’s settings and turn location sharing off unless you have agreed otherwise.</p>'},
   {id:'pb3',t:28,title:'In-app purchases',style:'popup',body:'<p>Many free games make money from in-game purchases and “loot boxes”. Require a password for purchases and talk about spending limits.</p>'}]}]},
 {id:'pm3',title:'Talking With Your Child',lessons:[{id:'pl3',title:'Keeping the conversation going',dur:95,
  scenes:[
   {t:0,layout:'title',kicker:'Module 3 · Talking With Your Child',title:'Keep talking'},
   {t:10,layout:'list',kicker:'Conversation tips',title:'Making it easy to talk',items:['Ask them to show you their favourite apps','Talk little and often','Agree family rules together','Promise they won’t be in trouble for telling you']},
   {t:44,layout:'list',kicker:'Warning signs',title:'Signs something may be wrong',items:['Secretive about their phone','Upset after being online','New older friends you don’t know','Gifts or money you can’t explain']},
   {t:76,layout:'quote',kicker:'Key principle',title:'Make sure they know they can tell you anything.',items:['Stay calm when they do.']}],
  captions:[[0,'Talking with your child is the most powerful online safety tool you have.'],[10,'Ask them to show you their favourite games and apps.'],[17,'Talk little and often, not just when something goes wrong.'],[24,'Agree family rules together, so they feel part of the decision.'],[32,'Make sure they know they won’t be in trouble for telling you about something worrying.'],[44,'Some signs may mean something is wrong.'],[50,'Your child might be secretive about their phone, or seem upset after being online.'],[58,'They might mention new, older friends, or have gifts or money you can’t explain.'],[66,'Changes in sleep, mood or appetite can also be signs.'],[76,'Make sure they know they can tell you anything, and stay calm when they do.']],
  notes:[
   {id:'pc1',t:14,title:'Conversation starters',essential:true,style:'panel',body:'<ul><li>“What’s the best thing you’ve seen online this week?”</li><li>“Who do you play with in that game?”</li><li>“What would you do if someone asked you to keep a secret online?”</li></ul>'},
   {id:'pc2',t:54,title:'Signs something may be wrong',essential:true,style:'panel',body:'<ul><li>Hiding the screen or deleting messages</li><li>Being upset, angry or withdrawn after going online</li><li>Talking about a new older friend</li><li>New things or money they can’t explain</li></ul><p>If you’re worried, talk to your child calmly and contact the school’s Designated Safeguarding Lead.</p>'},
   {id:'pc3',t:36,title:'Why not just ban the device?',style:'card',body:'<p>Children often don’t tell adults about problems because they fear losing their phone or games. Keeping devices as an option makes it more likely they’ll come to you.</p>'}]}]},
 {id:'pm4',title:'Getting Help',lessons:[{id:'pl4',title:'What to do if something goes wrong',dur:95,
  scenes:[
   {t:0,layout:'title',kicker:'Module 4 · Getting Help',title:'If something goes wrong'},
   {t:10,layout:'list',kicker:'First steps',title:'If you’re worried',items:['Stay calm and listen','Save evidence of messages','Report and block on the app','Tell the school’s DSL']},
   {t:40,layout:'grid',kicker:'Where to report',title:'Getting help',items:['<b>999</b>A child is in immediate danger','<b>CEOP</b>Online sexual abuse or grooming','<b>Report Remove</b>A nude image of someone under 18','<b>NSPCC helpline</b>Advice for adults: 0808 800 5000']},
   {t:76,layout:'quote',kicker:'Key principle',title:'You don’t have to handle it alone.',items:['Ask for help early.']}],
  captions:[[0,'If something goes wrong online, how you respond makes a big difference.'],[10,'Stay calm and listen to your child.'],[16,'Save evidence of messages, such as screenshots, but never save or share nude images.'],[25,'Report and block the person on the app or game.'],[31,'And let the school’s Designated Safeguarding Lead know.'],[40,'If a child is in immediate danger, call 999.'],[47,'Report online sexual abuse or grooming to CEOP.'],[54,'Report Remove, from Childline and the Internet Watch Foundation, helps under-18s get nude images of themselves removed.'],[64,'The NSPCC helpline gives advice to adults on 0808 800 5000.'],[76,'You don’t have to handle it alone. Ask for help early.']],
  notes:[
   {id:'pd1',t:18,title:'If a nude image is shared',essential:true,style:'panel',body:'<p class="note-warn">Don’t forward, save or screenshot a nude image of a child, even to report it. It is illegal to make or share images of anyone under 18. This includes fake images made with AI.</p><ul><li>Reassure your child they are not in trouble.</li><li>Use Report Remove to get the image taken down.</li><li>Tell the school’s DSL.</li></ul>'},
   {id:'pd2',t:44,title:'Where to report',essential:true,style:'panel',body:'<ul><li><b>Immediate danger:</b> call 999.</li><li><b>Online sexual abuse or grooming:</b> ceop.police.uk</li><li><b>Nude image of an under-18:</b> Report Remove (Childline and IWF)</li><li><b>Advice for adults:</b> NSPCC helpline 0808 800 5000</li><li><b>Support for children:</b> Childline 0800 1111</li></ul>'},
   {id:'pd3',t:28,title:'Sextortion',style:'popup',body:'<p>If someone is threatening to share an image unless your child pays, don’t pay. Stop contact, keep the messages, and report it to the police or CEOP. It is not your child’s fault.</p>'}]}]}
 ]};

 {id:'t3',type:'A',m:'om1',t:'01:40',note:'o1a',text:'Under KCSIE, misinformation, disinformation and conspiracy theories belong to which of the 4 Cs?',opts:['Content','Contact','Conduct','Commerce'],ans:[0],fb:'They are now listed as content risks.'},
 {id:'t4',type:'A',m:'om1',t:'02:14',note:'o1b',text:'In 2025, how many secondary school age children had seen harmful content online, according to Ofcom?',opts:['1 in 10','3 in 10','7 in 10','Almost all'],ans:[2],fb:'Seven in ten, most often bullying and hateful content.'},
 {id:'t5',type:'B',m:'om2',t:'00:24',note:'o2a',text:'Which tactics does the lesson describe groomers commonly using? Select all that apply.',opts:['Flattery and attention to build trust','Gifts, game credit or money','Asking the child to keep it secret','Contacting the school to introduce themselves'],ans:[0, 1, 2],fb:'They also try to move the chat to a private or encrypted app.'},
 {id:'t6',type:'A',m:'om2',t:'01:14',note:'o2a',text:'How many online grooming offences did police forces across the UK record in the year to March 2025?',opts:['726','7,263','72,630','Fewer than 100'],ans:[1],fb:'7,263, a record high.'},
 {id:'t7',type:'A',m:'om2',t:'01:38',note:'o2c',text:'Reports of sexual extortion to the IWF rose 72% in the first half of 2025. What proportion of the children involved were boys?',opts:['25%','50%','72%','97%'],ans:[3],fb:'97% of the children involved were boys.'},
 {id:'t8',type:'A',m:'om2',t:'02:06',note:'o2b',text:'A pupil is being threatened by someone online who has an image of them. What should you NOT do?',opts:['Tell the DSL straight away','Ask the pupil to show you the image so you can judge it','Reassure the pupil they are not in trouble','Let the DSL decide whether to report to CEOP or the police'],ans:[1],fb:'Never ask a child to show you any images, and don’t contact the other person yourself.'},
 {id:'t9',type:'B',m:'om3',t:'00:40',note:'o3a',text:'Which does the lesson give as examples of cyberbullying? Select all that apply.',opts:['Deliberately leaving someone out of a group chat','Setting up fake accounts to pretend to be someone else','Sharing photos to embarrass someone','Disagreeing politely in a class forum'],ans:[0, 1, 2],fb:'Because it is online, it can be seen by many people and is hard to escape.'},
 {id:'t10',type:'A',m:'om3',t:'01:03',note:'o3b',text:'In the year to March 2025, which age group made up the largest share of referrals to Prevent?',opts:['Aged 11 to 15, at 36%','Aged 16 to 17, at 13%','Under 10','Adults over 40'],ans:[0],fb:'There were 8,778 referrals, and 11 to 15 year olds were the largest group.'},
 {id:'t11',type:'A',m:'om3',t:'00:21',note:'o3a',text:'The ONS found roughly what proportion of children aged 10 to 15 had experienced online bullying behaviour in a year?',opts:['1 in 50','1 in 5','1 in 2','3 in 4'],ans:[1],fb:'Around one in five, and many did not tell anyone.'},
 {id:'t12',type:'C',m:'om3',t:'01:27',note:'o3c',text:'A pupil shows you cruel messages about them in a group chat. Which response matches the lesson?',opts:['Tell them to delete the app and move on','Listen, help them keep evidence without sharing it further, follow the anti-bullying policy, and tell the DSL if they may be at risk','Forward the messages to the class to show how unkind they are','Wait to see if it continues'],ans:[1],fb:'Take it seriously, keep evidence such as screenshots, and involve the DSL if a child may be at risk, including of self-harm.'},
 {id:'t13',type:'A',m:'om4',t:'00:17',note:'o4a',text:'A 15-year-old shared a nude image of themselves with consent. What does the national guidance say?',opts:['It is legal because they took it themselves','It is illegal, and the child should be treated as a victim who needs support','It is legal if both are over 14','Only the person who received it has done anything wrong'],ans:[1],fb:'Images of under-18s are illegal even if self-taken or shared with consent, but the child is treated as a victim, not an offender.'},
 {id:'t14',type:'B',m:'om4',t:'01:35',note:'o4b',text:'Which actions must you never take with a nude image of a child? Select all that apply.',opts:['View, copy, print or save it','Forward it, even to the DSL','Record what you were told about it','Delete it, or ask the child to delete it'],ans:[0, 1, 3],fb:'Recording what you were told is correct. The other actions could break the law.'},
 {id:'t15',type:'A',m:'om4',t:'01:10',note:'o4b',text:'In 2024, how much did reports of AI-generated child sexual abuse imagery actioned by the IWF rise?',opts:['By 38%','By 380%','They fell','By 3,800%'],ans:[1],fb:'A 380% rise, to 245 reports. AI-made images are handled exactly like real photographs.'},
 {id:'t16',type:'A',m:'om4',t:'01:55',note:'o4b',text:'Which service from Childline and the IWF helps young people get nude images of themselves taken down?',opts:['CEOP','Report Remove','Prevent','Report Harmful Content'],ans:[1],fb:'Report Remove.'},
 {id:'t17',type:'A',m:'om5',t:'00:15',note:'o5a',text:'Why does the lesson say you should watch videos in full before showing them in class?',opts:['Adverts and suggested videos can appear without warning','It is required by copyright law','So you can time the lesson','Pupils prefer it'],ans:[0],fb:'Adverts and suggested videos can appear without warning.'},
 {id:'t18',type:'A',m:'om5',t:'00:42',note:'o5a',text:'What should you do about useful websites that filtering wrongly blocks?',opts:['Use a personal device to get round it','Report them, so the system keeps working well for teaching','Ask pupils to use a VPN','Nothing: filtering should never be questioned'],ans:[1],fb:'Report harmful content that gets through, and useful sites that are wrongly blocked.'},

 {id:'t20',type:'A',m:'om5',t:'01:07',note:'o5b',text:'Which advice about personal social media matches the lesson?',opts:['Accept pupils’ friend requests but don’t message them','Keep accounts private, and never connect with or contact pupils through personal accounts','Only post about school at weekends','Use a nickname, then it’s fine to connect'],ans:[1],fb:'Your code of conduct applies online, just as it does in the classroom.'}

/* Positive behaviour courses (sample wording, to be reviewed by an experienced behaviour lead) */
const COURSE_PBS={
 id:'pbs',title:'Positive Behaviour Management for Staff',version:'1.0',status:'Published',price:18,audienceType:'staff',audienceShort:'Teachers and support staff',
 short:'Practical, calm behaviour management: clear routines, meaningful praise, responding to low-level disruption and de-escalating when things go wrong.',
 overview:'This course gives teachers and support staff practical tools for a calm, purposeful classroom. It covers seeing behaviour as communication, teaching routines, using praise well, responding to low-level disruption with the least intrusive step, and de-escalation. It also explains when behaviour may point to additional needs or a safeguarding concern.',
 audience:'Teachers, teaching assistants, cover supervisors, midday supervisors and anyone who manages pupils’ behaviour.',
 duration:'About 90 minutes, at your own pace',
 objectives:['Explain why behaviour is a form of communication','Teach and reinforce clear classroom routines','Use specific, sincere praise and recognition','Respond to low-level disruption with the least intrusive approach','De-escalate a situation calmly and safely','Recognise when behaviour may signal additional needs or a safeguarding concern'],
 modules:[
 {id:'bm1',title:'Foundations of Positive Behaviour',lessons:[{id:'bl1',title:'Behaviour, relationships and culture',dur:100,
  scenes:[
   {t:0,layout:'title',kicker:'Module 1 · Foundations',title:'Good behaviour is taught, not assumed'},
   {t:12,layout:'list',kicker:'Behaviour is communication',title:'Behind the behaviour',items:['Tired, hungry or anxious','Struggling with the work','Wanting attention or connection','Unmet needs at home or school']},
   {t:42,layout:'grid',kicker:'What works',title:'A positive culture',items:['<b>Relationships</b>Pupils behave for adults they trust','<b>Expectations</b>High and clearly explained','<b>Consistency</b>Everyone applies the policy','<b>Calm</b>Adults model the behaviour they want']},
   {t:76,layout:'quote',kicker:'Key principle',title:'Firm, fair and kind.',items:['Every day is a fresh start.']}],
  captions:[[0,'Good behaviour is taught, not assumed.'],[6,'This module sets out the ideas behind positive behaviour management.'],[12,'Behaviour is a form of communication. It often tells us something a child cannot put into words.'],[22,'A child may be tired, hungry or anxious, or struggling with the work.'],[31,'They may want attention or connection, or have needs that are not being met.'],[42,'Pupils behave best for adults they trust, so relationships come first.'],[50,'Expectations should be high and clearly explained.'],[57,'Everyone should apply the school behaviour policy in the same way.'],[64,'And adults should stay calm and model the behaviour they want to see.'],[76,'Be firm, fair and kind, and give every pupil a fresh start each day.']],
  notes:[
   {id:'b1a',t:16,title:'Behaviour as communication',essential:true,style:'panel',body:'<p>Asking “what is this behaviour telling me?” helps you respond to the cause, not only the symptom.</p><h4>This doesn’t mean</h4><ul><li>Lowering expectations</li><li>Ignoring the impact on other pupils</li></ul><p>It means holding the boundary while trying to understand.</p>'},
   {id:'b1b',t:58,title:'Your school behaviour policy',essential:true,style:'panel',body:'<p>Every school must have a behaviour policy. The Department for Education’s <i>Behaviour in schools</i> guidance expects all staff to know it and apply it consistently.</p><p>Since 1 September 2026, the statutory <i>Mobile phones in schools</i> guidance expects schools to be phone-free throughout the school day by default, as part of their behaviour policy. Apply it consistently, including any sanctions, and make reasonable adjustments where a pupil needs them.</p><p class="note-warn">This course supports your school’s policy. Where they differ, follow your policy.</p>'},
   {id:'b1c',t:46,title:'Belonging',style:'card',body:'<p>Pupils who feel they belong are more likely to meet expectations. Greeting pupils by name and noticing them on a good day both build belonging.</p>'}]}]},
 {id:'bm2',title:'Routines and Clear Expectations',lessons:[{id:'bl2',title:'Teaching routines',dur:100,
  scenes:[
   {t:0,layout:'title',kicker:'Module 2 · Routines and Expectations',title:'Routines free up time for learning'},
   {t:10,layout:'list',kicker:'Teach it',title:'Four steps to a routine',items:['Explain what and why','Model it yourself','Practise it together','Praise and reinforce it']},
   {t:42,layout:'list',kicker:'Key routines',title:'Routines worth teaching',items:['Entering and leaving the room','Getting everyone’s attention','Moving between activities','Asking for help']},
   {t:72,layout:'quote',kicker:'Key principle',title:'Same words. Same routine. Every time.',items:['Consistency makes it easy to succeed.']}],
  captions:[[0,'Routines reduce uncertainty and free up time for learning.'],[10,'Teach routines like any other content.'],[15,'First, explain what you want and why it matters.'],[22,'Then model it yourself, so pupils can see exactly what it looks like.'],[29,'Practise it together, and praise pupils who get it right.'],[42,'Routines worth teaching include how pupils enter and leave the room,'],[50,'how you get everyone’s attention, how they move between activities,'],[58,'and how they ask for help.'],[72,'Use the same words and the same routine every time.'],[80,'Consistency makes it easy for pupils to succeed.']],
  notes:[
   {id:'b2a',t:20,title:'Teaching a routine',essential:true,style:'panel',body:'<ol style="padding-left:18px"><li><b>Explain:</b> “When I raise my hand, stop, look and listen.”</li><li><b>Model:</b> show what that looks like.</li><li><b>Practise:</b> try it, and try again until it is smooth.</li><li><b>Reinforce:</b> “Thank you, table 3, that was quick.”</li></ol>'},
   {id:'b2b',t:74,title:'Consistent language',essential:true,style:'panel',body:'<p>Using the same short phrases across the school helps pupils know what is expected, whoever is in the room.</p><ul><li>Say what you want: “Walk, please” rather than “Don’t run”.</li><li>Keep instructions short and clear.</li></ul>'},
   {id:'b2c',t:46,title:'Meet and greet',style:'popup',body:'<p>Standing at the door and greeting pupils by name sets a calm tone and lets you spot anyone who seems upset before the lesson starts.</p>'}]}]},
 {id:'bm3',title:'Praise and Recognition',lessons:[{id:'bl3',title:'Using praise well',dur:95,
  scenes:[
   {t:0,layout:'title',kicker:'Module 3 · Praise and Recognition',title:'Catch them getting it right'},
   {t:10,layout:'list',kicker:'Effective praise',title:'Praise that works',items:['Specific: say exactly what they did','Sincere: mean it','Proportionate: match the effort','Often: far more than corrections']},
   {t:44,layout:'callout',kicker:'Public or private?',title:'Know your pupils',items:['Some pupils love public praise','Others prefer a quiet word or a note home','Recognise effort, not just results']},
   {t:72,layout:'quote',kicker:'Key principle',title:'What you notice, you get more of.',items:['Notice the good.']}],
  captions:[[0,'Catching pupils getting it right is one of the most powerful tools you have.'],[10,'Good praise is specific. Say exactly what the pupil did.'],[18,'It is sincere, and it matches the effort involved.'],[25,'And aim for far more positive interactions than corrections.'],[44,'Some pupils love public praise. Others find it embarrassing.'],[52,'A quiet word, a positive note or a call home may work better.'],[60,'Recognise effort and improvement, not only results.'],[72,'What you notice, you get more of. So notice the good.']],
  notes:[
   {id:'b3a',t:14,title:'Specific praise',essential:true,style:'panel',body:'<h4>Instead of</h4><p>“Good job.”</p><h4>Try</h4><p>“You started straight away and checked your answers. That’s exactly what I was looking for.”</p>'},
   {id:'b3b',t:48,title:'Private recognition',essential:true,style:'panel',body:'<p>Older pupils and those who find attention hard may prefer private recognition, such as a word as they leave, a sticky note on their book, or a positive message home.</p>'},
   {id:'b3c',t:26,title:'Positive to corrective',style:'card',body:'<p>Many schools encourage staff to make far more positive comments than corrections. Try counting your own for one lesson.</p>'}]}]},
 {id:'bm4',title:'Responding to Low-level Disruption',lessons:[{id:'bl4',title:'The least intrusive step',dur:105,
  scenes:[
   {t:0,layout:'title',kicker:'Module 4 · Low-level Disruption',title:'Small steps first'},
   {t:10,layout:'list',kicker:'Least intrusive first',title:'A step-by-step approach',items:['A look or a non-verbal cue','Moving closer','A quiet, private reminder','A clear choice and consequence']},
   {t:46,layout:'list',cls:'l-avoid',kicker:'Avoid',title:'What makes it worse',items:['Public arguments','Sarcasm or shouting','Bringing up past behaviour','Consequences you can’t follow through']},
   {t:74,layout:'callout',kicker:'Afterwards',title:'Follow up and repair',items:['Speak privately once things are calm','Focus on what happens next time','Make a fresh start']},
   {t:94,layout:'quote',kicker:'Key principle',title:'Deal with it, then move on.',items:['Protect the learning.']}],
  captions:[[0,'Most behaviour you deal with will be low-level disruption, such as chatting or not starting work.'],[10,'Start with the least intrusive step.'],[15,'A look, or a non-verbal cue, is often enough.'],[22,'Moving closer to the pupil can settle things without a word.'],[29,'If needed, give a quiet, private reminder of what you expect.'],[37,'Then a clear choice and the consequence, following your school policy.'],[46,'Avoid public arguments, sarcasm and shouting.'],[53,'Don’t bring up past behaviour, and never threaten a consequence you can’t follow through.'],[64,'Give take-up time. Walk away and let the pupil make the right choice.'],[74,'Afterwards, speak to the pupil privately once things are calm.'],[82,'Focus on what will happen next time, and make a fresh start.'],[94,'Deal with it, then move on, and protect the learning for everyone.']],
  notes:[
   {id:'b4a',t:14,title:'The least intrusive approach',essential:true,style:'panel',body:'<ol style="padding-left:18px"><li>Non-verbal cue (a look, a gesture)</li><li>Proximity (move closer)</li><li>Quiet private reminder of the expectation</li><li>Choice: “You can start now, or we’ll finish this at break.”</li><li>Consequence, applied calmly in line with policy</li></ol>'},
   {id:'b4b',t:66,title:'Take-up time',essential:true,style:'panel',body:'<p>After giving an instruction or choice, step away for a moment. This lets the pupil comply without losing face in front of others.</p><p>Standing over a pupil and waiting can turn a small moment into a confrontation.</p>'},
   {id:'b4c',t:78,title:'Restorative conversations',style:'card',body:'<p>Short questions help: What happened? Who was affected? What do we need to do now? What will you do next time?</p>'}]}]},
 {id:'bm5',title:'De-escalation and Wider Needs',lessons:[{id:'bl5',title:'Staying calm and looking deeper',dur:105,
  scenes:[
   {t:0,layout:'title',kicker:'Module 5 · De-escalation and Wider Needs',title:'When things escalate'},
   {t:10,layout:'list',kicker:'De-escalation',title:'Calm the situation',items:['Stay calm and lower your voice','Give space and reduce the audience','Use the pupil’s name and acknowledge feelings','Offer a simple choice or a way out']},
   {t:44,layout:'callout',kicker:'Look deeper',title:'Behaviour can signal a need',items:['Special educational needs or disability','Trauma or difficulties at home','A safeguarding concern']},
   {t:74,layout:'list',kicker:'Afterwards',title:'Record and share',items:['Record what happened, factually','Tell the SENCo if needs may be unmet','Tell the DSL if you have a safeguarding worry']},
   {t:94,layout:'quote',kicker:'Key principle',title:'Calm is contagious.',items:['So is panic.']}],
  captions:[[0,'Sometimes behaviour escalates. Your calm response can bring it back down.'],[10,'Stay calm, and lower your voice and your body language.'],[17,'Give the pupil space and, if you can, reduce the audience.'],[24,'Use their name, and acknowledge how they feel.'],[31,'Offer a simple choice, or a way out that lets them calm down.'],[44,'Behaviour can be a sign of an unmet need.'],[50,'It may be linked to special educational needs or disability, which may need reasonable adjustments.'],[58,'It may reflect trauma or difficulties at home.'],[64,'A sudden change in behaviour can also be a safeguarding concern.'],[74,'Afterwards, record what happened factually.'],[80,'Tell the SENCo if needs may not be met, and tell the DSL if you have a safeguarding worry.'],[94,'Remember: calm is contagious. So is panic.']],
  notes:[
   {id:'b5a',t:14,title:'De-escalation steps',essential:true,style:'panel',body:'<ul><li>Keep your voice low and slow.</li><li>Stand side-on, not face to face, and keep a safe distance.</li><li>Say less: “I can see you’re upset. Let’s take a break.”</li><li>Remove the audience if you can.</li><li>Get help from a colleague early.</li></ul>'},
   {id:'b5b',t:66,title:'When behaviour may be a safeguarding concern',essential:true,style:'panel',body:'<p>A sudden change in behaviour, such as withdrawal, aggression, or being unusually anxious, can be a sign that something is wrong at home or elsewhere.</p><p>KCSIE 2026 also asks staff to be particularly alert to pupils who are repeatedly removed from class, suspended several times, or on a part-time timetable, as they may need early help.</p><p class="note-warn">If you are worried, record it and tell the DSL the same day.</p>'},
   {id:'b5c',t:36,title:'Reasonable force and restrictive interventions',style:'popup',body:'<p>Since 1 April 2026, the Department for Education guidance <i>Restrictive interventions, including use of reasonable force, in schools</i> has replaced the 2013 guidance on reasonable force.</p><ul><li>Force may only be used where it is reasonable and necessary, for example to prevent injury, and only as a last resort.</li><li>Schools now have a legal duty to record and report the use of force, and of seclusion.</li><li>Follow your school’s policy and any training you have had.</li></ul>'}]}]}
 ]};

   {t:10,layout:'list',kicker:'Common reasons',title:'What might be going on',items:['Tired or hungry','Worried, frustrated or bored','Wanting your attention','Finding something hard to say']},
   {t:40,layout:'callout',kicker:'Age and stage',title:'Expect what fits their age',items:['Toddlers test limits','Young children are still learning to wait','Teenagers want more independence']},

  captions:[[0,'All behaviour has a reason, even when it is hard to see.'],[10,'Children may act up when they are tired or hungry,'],[16,'or when they feel worried, frustrated or bored.'],[23,'Sometimes they want your attention, or find something hard to put into words.'],[40,'It also helps to expect what fits your child’s age.'],[46,'Young children are still learning to wait and share.'],[53,'Teenagers naturally want more independence.'],[68,'Look for patterns rather than blame.'],[74,'When does it happen? What helps? What makes it worse?']],
  notes:[
   {id:'qa1',t:14,title:'What’s behind the behaviour?',essential:true,style:'panel',body:'<p>Before reacting, it can help to ask yourself:</p><ul><li>Are they tired, hungry or unwell?</li><li>Has something changed at home or school?</li><li>Are they asking for my attention?</li></ul>'},
   {id:'qa2',t:44,title:'Age and stage',essential:true,style:'panel',body:'<p>Some behaviour is a normal part of growing up, such as toddler tantrums or teenagers pushing back. Your child still needs boundaries, but knowing it is normal can help you stay calm.</p>'},

   {t:0,layout:'title',kicker:'Lesson 2 · Routines and Boundaries',title:'Predictable feels safe'},
   {t:10,layout:'list',kicker:'Routines',title:'Routines that help',items:['Mornings and getting ready for school','Mealtimes','Screens off before bed','A regular bedtime']},
   {t:38,layout:'list',kicker:'Family rules',title:'A few clear rules',items:['Keep them few and simple','Say what to do: “Walk inside”','Agree them together','All adults stick to them']},
   {t:66,layout:'quote',kicker:'Key idea',title:'Say what you mean, and follow through.',items:['Calmly, every time.']}],
  captions:[[0,'Children feel safer when life is predictable.'],[10,'Routines help with mornings and getting ready for school,'],[17,'with mealtimes, and with switching off screens before bed.'],[25,'A regular bedtime helps children manage their feelings and behaviour the next day.'],[38,'Keep family rules few and simple.'],[44,'Say what you want them to do, such as “walk inside”, rather than “don’t run”.'],[52,'Agree the rules together, and make sure all the adults stick to them.'],[66,'Say what you mean, and follow through calmly, every time.']],
  notes:[
   {id:'qb1',t:40,title:'Making family rules',essential:true,style:'panel',body:'<ul><li>Choose three to five rules that matter most.</li><li>Phrase them positively: “We speak kindly”.</li><li>Put them somewhere everyone can see.</li><li>Talk about them when everyone is calm.</li></ul>'},
   {id:'qb2',t:68,title:'Follow through calmly',essential:true,style:'panel',body:'<p>Give one clear warning, then follow through with a small, fair consequence you can actually carry out. Big threats you won’t keep teach children that rules don’t matter.</p>'},
   {id:'qb3',t:18,title:'Visual timetables',style:'popup',body:'<p>A simple picture list of the morning or bedtime routine helps younger children, and children with additional needs, know what comes next.</p>'}]}]},
 {id:'qm3',title:'Praise, Connection and Calm',lessons:[{id:'ql3',title:'Encouraging good behaviour',dur:90,

   {t:36,layout:'callout',kicker:'Staying calm',title:'When things get heated',items:['Pause and take a breath','Lower your voice','Name the feeling: “You’re cross”','Talk it through later']},

   {id:'qc2',t:40,title:'Staying calm in the moment',essential:true,style:'panel',body:'<ul><li>It’s fine to step away for a minute if your child is safe.</li><li>Keep words few and your voice low.</li><li>Shouting usually raises the temperature for everyone.</li><li>Talk about what happened later, not in the heat of the moment.</li></ul>'},
