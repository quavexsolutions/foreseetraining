const SGS_V12={"l1":{"dur":154,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 1 · Introduction to Safeguarding","title":"Safeguarding is everyone’s responsibility","ph":1},{"t":20.19,"layout":"stat","kicker":"How common is abuse?","title":"adults in England and Wales experienced abuse before the age of 16","stat":"1 in 5","src":"ONS, March 2020","pct":20},{"t":42.51,"layout":"grid","kicker":"What safeguarding means","title":"Four parts of safeguarding","items":["<b>Protect</b>Children from maltreatment","<b>Prevent</b>Harm to health or development","<b>Provide</b>Safe and effective care","<b>Act</b>So every child has the best outcomes"],"art":"hub","hub":"Safeguarding","hubIc":"shield","icons":["shield","alert","home","target"],"ask":{"q":"Safeguarding is wider than child protection. So what is child protection?","opts":["Everything a school does to help children thrive","The action taken when a child is suffering, or likely to suffer, significant harm","The school’s attendance policy"],"a":1,"why":"Child protection is one part of safeguarding: the action taken when a child is suffering, or is likely to suffer, significant harm."}},{"t":69.69,"layout":"callout","kicker":"Statutory guidance","title":"Keeping Children Safe in Education 2026","items":["In force from 1 September 2026","All staff read at least Part one","Your school policy explains local procedures"],"art":"checklist"},{"t":92.96,"layout":"stat","kicker":"Children who need protection","title":"children in England were on a child protection plan in March 2025, about 1 in every 250","stat":"50,000","src":"DfE, Children in need, 2025"},{"t":113.19,"layout":"list","kicker":"Who to tell","title":"Your Designated Safeguarding Lead","items":["A senior member of staff","Leads on safeguarding and child protection","Supported by one or more deputies","Know their name and how to reach them"],"ph":2,"icons":["staff","shield","users","phone"]},{"t":134.69,"layout":"quote","kicker":"Key principle","title":"“It could happen here.”","items":["If in doubt, speak to the DSL."]}],"captions":[[0.0,"Welcome to Safeguarding Children in Schools."],[2.77,"Everyone who works in a school, whether you teach, support learning, run the office or look after the site, sees children every day."],[11.08,"That makes you one of the people most likely to notice when something is wrong, and this course will help you know exactly what to do next."],[20.19,"Abuse is more common than many people think."],[23.3,"The Office for National Statistics estimates that one in five adults in England and Wales experienced at least one form of abuse before the age of sixteen."],[34.25,"That is around 8.5 million people."],[36.65,"In any school, it is likely that some children are living with harm right now."],[42.51,"Safeguarding is wider than child protection."],[45.48,"It means protecting children from maltreatment, preventing harm to their mental and physical health or development, making sure they grow up with safe and effective care, and acting so that every child can have the best outcomes."],[60.91,"Child protection is one part of this: the action we take when a child is suffering, or is likely to suffer, significant harm."],[69.69,"In England, schools must follow the statutory guidance Keeping Children Safe in Education."],[75.68,"The current edition came into force on 1 September 2026."],[79.42,"Every member of staff should read at least Part one, and your school’s child protection policy explains how the guidance works in your setting, including who to speak to and how to record a concern."],[92.96,"Nearly 50,000 children in England were on a child protection plan in March 2025."],[98.74,"That is about one in every 250 children, or roughly one or two children in a typical primary school."],[105.97,"Behind every one of those plans is a child whose safety depended on adults noticing and acting."],[113.19,"Every school has a Designated Safeguarding Lead, known as the DSL, who is a senior member of staff with lead responsibility for safeguarding and child protection."],[123.7,"They are supported by one or more deputies."],[126.49,"Make sure you know their names, where to find them, and how to reach them, including during school trips and after hours."],[134.69,"The most important attitude you can bring to your work is this: it could happen here."],[140.5,"Never assume a child is safe because of their family, their background or the reputation of your school."],[147.62,"If something worries you, speak to the DSL."],[150.56,"You will never be wrong to share a concern."]],"segs":[{"t":0.0,"d":19.84,"a":"l1_0"},{"t":20.19,"d":21.97,"a":"l1_1"},{"t":42.51,"d":26.83,"a":"l1_2"},{"t":69.69,"d":22.92,"a":"l1_3"},{"t":92.96,"d":19.88,"a":"l1_4"},{"t":113.19,"d":21.15,"a":"l1_5"},{"t":134.69,"d":18.81,"a":"l1_6"}],"sources":[["Office for National Statistics, Child abuse in England and Wales: March 2020","https://www.ons.gov.uk/peoplepopulationandcommunity/crimeandjustice/bulletins/childabuseinenglandandwales/march2020"],["Department for Education, Children in need, reporting year 2025","https://explore-education-statistics.service.gov.uk/find-statistics/children-in-need/2025"],["Department for Education, Keeping children safe in education 2026","https://www.gov.uk/government/publications/keeping-children-safe-in-education--2"]],"nt":{"n1a":44.0,"n1b":71.2,"n1c":114.7,"n1d":136.2}},"l2":{"dur":172,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 2 · Recognising Abuse and Neglect","title":"Knowing what to look for","ph":1},{"t":16.96,"layout":"grid","kicker":"Four categories","title":"Types of abuse","items":["<b>Physical</b>Hitting, shaking, burning or other harm","<b>Emotional</b>Persistent ill treatment that harms development","<b>Sexual</b>Forcing or enticing a child into sexual activity","<b>Neglect</b>Persistent failure to meet basic needs"],"art":"quad","icons":["hand","heart","alert","food"],"more":["Includes hitting, shaking, throwing, poisoning, burning or scalding, drowning or suffocating, or otherwise causing physical harm.","Persistent emotional ill treatment, such as making a child feel worthless or unloved, frightening them, or seeing or hearing the ill treatment of someone else, including domestic abuse.","Includes contact and non-contact activities, such as making a child look at sexual images, and grooming a child in preparation for abuse, including online.","Persistent failure to meet basic needs, such as adequate food, clothing or shelter, protection from harm, supervision, or access to medical care."]},{"t":47.09,"layout":"stat","kicker":"The most common harm","title":"of children on child protection plans in 2025 were there because of neglect, and 37% because of emotional abuse","stat":"50%","src":"DfE, Children in need, 2025","pct":50,"ask":{"q":"What was the most common reason children were on child protection plans in 2025?","opts":["Neglect","Physical abuse","Online abuse"],"a":0,"why":"Half of all children on child protection plans were there because of neglect, and more than a third because of emotional abuse."}},{"layout":"stat","art":"duo","kicker":"What assessments find","title":"The most common concerns at home","duo":[["1 in 3","assessments found concerns about a parent or carer’s mental health",33],["1 in 3","found a parent or carer was a victim of domestic abuse",33]],"src":"DfE, Children in need 2025","t":68.85},{"t":95.19,"layout":"list","kicker":"Possible signs","title":"Things you might notice","items":["Changes in behaviour or mood","Injuries with no clear explanation","Often hungry, tired or unkempt","Absence, part-time timetables or removal from class"],"icons":["heart","alert","food","clock"]},{"t":122.44,"layout":"stat","kicker":"Between children","title":"girls said being sent unwanted explicit pictures or videos happens a lot or sometimes to them or their peers","stat":"9 in 10","src":"Ofsted, 2021","pct":90},{"t":148.3,"layout":"quote","kicker":"Key principle","title":"You don’t need proof to share a worry.","items":["Pass it to the DSL. They decide what happens next."]}],"captions":[[0.0,"In this module we look at the different forms abuse and neglect can take, and the signs that something may be wrong."],[7.64,"Abuse is rarely obvious."],[9.23,"More often it shows itself through small changes that only someone who knows the child well is likely to notice."],[16.96,"Keeping Children Safe in Education describes four main categories of abuse."],[22.07,"Physical abuse means causing physical harm, such as hitting, shaking or burning."],[27.52,"Emotional abuse is persistent ill treatment that seriously affects a child’s emotional development."],[34.26,"Sexual abuse involves forcing or enticing a child into sexual activity, including online."],[40.33,"And neglect is the persistent failure to meet a child’s basic physical or psychological needs."],[47.09,"Neglect is the most common reason children need protection."],[50.96,"In 2025, half of all children on child protection plans in England were there because of neglect, and more than a third because of emotional abuse."],[60.58,"These are the forms of harm that school staff are often best placed to spot, because they build up slowly, day after day."],[68.85,"What happens at home matters too."],[71.15,"When children’s social care assessed children in need in the year to March 2025, the two most common concerns were a parent or carer’s mental health, and a parent or carer being the victim of domestic abuse."],[85.57,"Each was found in around one in three assessments."],[89.05,"A child who lives with domestic abuse is a victim of that abuse in their own right."],[95.19,"Signs to look out for include changes in behaviour or mood, injuries with no clear explanation, and a child who is often hungry, tired or unkempt."],[105.18,"Frequent or unexplained absence, being on a part-time timetable, or being repeatedly removed from class can also be warning signs."],[114.08,"One sign on its own may have an innocent explanation, which is why it matters to record what you notice and share it."],[122.44,"Abuse can also happen between children."],[125.21,"When Ofsted reviewed sexual abuse in schools and colleges in 2021, nearly nine in ten girls, and nearly half of boys, said that being sent explicit pictures or videos they did not want to see happens a lot or sometimes to them or their peers."],[142.36,"Child-on-child abuse should never be dismissed as banter or part of growing up."],[148.3,"Exploitation is another serious risk, whether children are drawn into sexual exploitation, into criminal activity such as carrying drugs or money, or into modern slavery."],[160.75,"You do not need proof to act on any of these concerns."],[164.71,"Pass your worry to the DSL, who can see the wider picture and decide what happens next."]],"segs":[{"t":0.0,"d":16.61,"a":"l2_0"},{"t":16.96,"d":29.78,"a":"l2_1"},{"t":47.09,"d":21.41,"a":"l2_2"},{"t":68.85,"d":25.99,"a":"l2_d"},{"t":95.19,"d":26.9,"a":"l2_3"},{"t":122.44,"d":25.51,"a":"l2_4"},{"t":148.3,"d":22.77,"a":"l2_5"}],"sources":[["Department for Education, Keeping children safe in education 2026","https://www.gov.uk/government/publications/keeping-children-safe-in-education--2"],["Department for Education, Children in need, reporting year 2025","https://explore-education-statistics.service.gov.uk/find-statistics/children-in-need/2025"],["Ofsted, Review of sexual abuse in schools and colleges (2021)","https://www.gov.uk/government/publications/review-of-sexual-abuse-in-schools-and-colleges/review-of-sexual-abuse-in-schools-and-colleges"]],"nt":{"n2a":18.5,"n2b":48.6,"n2e":96.6,"n2c":123.9,"n2d":149.8}},"l3":{"dur":134,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 3 · Responding to a Disclosure","title":"When a child tells you something worrying","ph":0},{"t":15.79,"layout":"stat","kicker":"Why your response matters","title":"children who are sexually abused are identified by professionals","stat":"1 in 8","src":"Children’s Commissioner, 2015","pct":12.5,"ask":{"q":"What proportion of children who are sexually abused come to the attention of professionals?","opts":["About 1 in 8","About half","Almost all"],"a":0,"why":"The Children’s Commissioner estimated only about one in eight. That is why your response to a disclosure matters so much."}},{"layout":"stat","kicker":"Children do reach out","stat":"162,018","title":"Childline counselling sessions with children and young people in 2024/25","src":"NSPCC, 2024/25","t":36.19},{"t":60.43,"layout":"list","kicker":"Do","title":"How to respond","items":["Stay calm and listen carefully","Let the child speak in their own words","Reassure them they were right to tell you","Explain what will happen next"],"ph":0,"art":"process","icons":["ear","chat","heart","arrow"]},{"t":84.0,"layout":"list","kicker":"Avoid","title":"What not to do","items":["Promising to keep it a secret","Asking leading questions","Showing shock or disbelief","Investigating it yourself"],"cls":"l-avoid","art":"avoid"},{"t":106.66,"layout":"callout","kicker":"Then act","title":"Record it and tell the DSL today","items":["Write down their words, as soon as you can","Tell the DSL the same day","If a child is in immediate danger, call 999"],"ph":3,"art":"process","icons":["doc","shield","phone"]},{"t":124.14,"layout":"quote","kicker":"Key principle","title":"Listen, reassure, pass it on.","items":["You don’t need all the answers."]}],"captions":[[0.0,"This module covers what to do when a child tells you something worrying."],[4.54,"This is called a disclosure."],[6.3,"It may come at an unexpected moment, in a corridor, at lunchtime or at the end of a lesson, and it often comes in pieces rather than all at once."],[15.79,"Many children never tell anyone."],[17.86,"The Children’s Commissioner for England estimated that only one in eight children who are sexually abused come to the attention of professionals."],[27.27,"So when a child does choose to tell you, how you respond really matters."],[31.95,"It can decide whether they ever feel able to speak up again."],[36.19,"Children who do find the words often reach out somewhere."],[40.56,"In 2024 to 2025, Childline counsellors delivered 162,018 counselling sessions to children and young people."],[48.75,"Many children share a small part of what is happening first, to see how an adult reacts."],[55.49,"Your calm response may be what helps them tell you the rest."],[60.43,"Stay calm and give the child your full attention."],[63.75,"Let them speak in their own words and at their own pace, and use open prompts such as “tell me more”, rather than questions that suggest an answer."],[73.7,"Reassure them that they were right to tell you and that they will be taken seriously."],[79.45,"Then explain, in a way they understand, what will happen next."],[84.0,"There are some things to avoid."],[86.15,"Never promise to keep what you are told a secret, because you will need to share it to keep the child safe."],[93.59,"Try not to show shock or disbelief, and do not investigate or question the child in detail yourself."],[100.54,"That is the job of the DSL and, where needed, children’s social care or the police."],[106.66,"As soon as you can, write down what the child said, using their own words, along with the date, the time and who was present."],[114.83,"Then tell the DSL straight away, and certainly on the same day."],[118.95,"If a child is in immediate danger, call 999 first and then inform the DSL."],[124.14,"You are not expected to have all the answers."],[126.98,"You are expected to listen, to reassure, and to pass the information on quickly to the right person."]],"segs":[{"t":0.0,"d":15.44,"a":"l3_0"},{"t":15.79,"d":20.05,"a":"l3_1"},{"t":36.19,"d":23.89,"a":"l3_d"},{"t":60.43,"d":23.22,"a":"l3_2"},{"t":84.0,"d":22.31,"a":"l3_3"},{"t":106.66,"d":17.13,"a":"l3_4"},{"t":124.14,"d":9.14,"a":"l3_5"}],"sources":[["Children’s Commissioner for England, Only 1 in 8 children who are sexually abused are identified by professionals (2015)","https://www.childrenscommissioner.gov.uk/news/only-1-in-8-children-who-are-sexually-abused-are-identified-by-professionals/"],["Department for Education, Keeping children safe in education 2026","https://www.gov.uk/government/publications/keeping-children-safe-in-education--2"],["NSPCC, Childline and NSPCC Helpline statistics 2024/25","https://learning.nspcc.org.uk/research-resources/statistics-briefings/childline-nspcc-helpline-statistics"]],"nt":{"n3a":61.9,"n3c":66.9,"n3b":85.5,"n3d":108.1}},"l4":{"dur":148,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 4 · Recording and Reporting","title":"Write it down. Pass it on.","ph":3},{"t":15.64,"layout":"list","kicker":"Record","title":"A good record includes","items":["Date, time and place","The child’s own words","Facts, not opinions or guesses","Your name, role and signature"],"art":"checklist"},{"t":39.8,"layout":"stat","kicker":"Schools make a difference","title":"of referrals to children’s social care in England came from schools, second only to the police","stat":"21%","src":"DfE, Children in need, 2025","pct":21,"ask":{"q":"Who made more referrals to children’s social care than schools?","opts":["Health services","The police","Parents"],"a":1,"why":"Schools made 21% of referrals, second only to the police."}},{"t":62.81,"layout":"callout","kicker":"Report","title":"Tell the DSL the same day","items":["Use your school’s system, on paper or online","Don’t wait to collect more evidence","Anyone can refer to children’s social care"]},{"t":90.91,"layout":"grid","kicker":"Concerns about adults","title":"Who to tell","items":["<b>A staff member</b>Tell the headteacher","<b>The headteacher</b>Tell the chair of governors","<b>Local authority</b>The LADO advises on allegations","<b>Not acted on?</b>Use whistleblowing routes"],"art":"route"},{"layout":"stat","kicker":"Why records matter","stat":"22.6%","pct":22.6,"title":"of referrals were re-referrals: children referred again within 12 months","src":"DfE, Children in need 2025","t":117.93},{"t":140.98,"layout":"quote","kicker":"Key principle","title":"Never assume someone else has reported it.","items":["Share it yourself."]}],"captions":[[0.0,"Once you have a concern, you need to record it and report it."],[4.24,"Clear, factual records help the DSL to see patterns over time, to make the right decisions and, when needed, to share accurate information with other agencies."],[15.64,"A good record includes the date, time and place, what you saw or heard, and the child’s own words wherever possible."],[23.78,"Stick to the facts."],[25.12,"If you include an opinion, make it clear that it is your opinion and explain why you hold it."],[31.65,"Add your name and role, sign it, and pass it on using your school’s system, whether that is on paper or online."],[39.8,"Schools play a huge part in keeping children safe."],[43.45,"Of the almost 633,000 referrals made to children’s social care in England in the year to March 2025, more than one in five came from schools."],[53.75,"Only the police made more."],[55.65,"Many of those referrals began with a member of staff writing down something they had noticed."],[62.81,"Report your concern to the DSL, or a deputy, on the same day."],[67.03,"Do not wait to collect more evidence, and do not contact the family yourself unless the DSL asks you to."],[74.23,"Anyone can make a referral directly to children’s social care if they believe a child is at risk."],[80.94,"And from 30 September 2026, a new duty to share information reminds us that data protection law is never a barrier to keeping a child safe."],[90.91,"If your concern is about a member of staff, tell the headteacher."],[95.42,"If it is about the headteacher, tell the chair of governors."],[99.59,"The Local Authority Designated Officer, known as the LADO, advises on allegations that an adult may have harmed a child."],[107.92,"If you ever feel a concern has not been acted on, use your school’s whistleblowing procedure, or call the NSPCC Whistleblowing Advice Line."],[117.93,"Concerns often come back."],[119.68,"In the year to March 2025, almost a quarter of referrals to children’s social care, 22.6%, were re-referrals: children referred again within twelve months of an earlier referral."],[132.15,"Clear, dated records help the DSL see when worries are building up again, so every small note you write can matter later."],[140.98,"Finally, never assume that someone else has already reported a concern."],[145.45,"If you are worried, share it yourself."]],"segs":[{"t":0.0,"d":15.29,"a":"l4_0"},{"t":15.64,"d":23.81,"a":"l4_1"},{"t":39.8,"d":22.66,"a":"l4_2"},{"t":62.81,"d":27.75,"a":"l4_3"},{"t":90.91,"d":26.67,"a":"l4_4"},{"t":117.93,"d":22.7,"a":"l4_d"},{"t":140.98,"d":6.85,"a":"l4_5"}],"sources":[["Department for Education, Children in need, reporting year 2025","https://explore-education-statistics.service.gov.uk/find-statistics/children-in-need/2025"],["Department for Education, Keeping children safe in education 2026","https://www.gov.uk/government/publications/keeping-children-safe-in-education--2"]],"nt":{"n4a":17.1,"n4b":64.3,"n4e":69.3,"n4c":92.4,"n4d":97.4}},"l5":{"dur":133,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 5 · Professional Responsibilities","title":"Keeping clear, professional boundaries","ph":1},{"t":13.4,"layout":"list","kicker":"Boundaries","title":"Safer working practice","items":["Follow the staff code of conduct","Contact pupils only through school systems","No personal social media contact with pupils","Avoid situations that could be misunderstood"],"art":"checklist"},{"t":37.86,"layout":"callout","kicker":"Low-level concerns","title":"Small things still matter","items":["Behaviour that isn’t right but isn’t harm","Share it under your school’s policy","Includes self-reporting your own mistakes"],"ask":{"q":"Should you report your own mistake as a low-level concern?","opts":["No, only other people’s","Yes, self-reporting is included","Only if a pupil complains"],"a":1,"why":"Low-level concerns include self-reporting, for example if you realise you have acted in a way that could be misunderstood."}},{"t":63.4,"layout":"explain","kicker":"KCSIE 2026","title":"Pupils who may need extra support","text":"Pupils removed from class or on part-time timetables, young carers, children with mental health needs, and those at risk of radicalisation.","ph":2},{"layout":"stat","kicker":"Easy to miss","stat":"120,000","title":"young unpaid carers aged 5 to 17 in England","src":"ONS, Census 2021","t":90.45},{"t":115.2,"layout":"quote","kicker":"Key principle","title":"Notice, record, report. Don’t investigate.","items":["That job belongs to the DSL."]}],"captions":[[0.0,"Professional boundaries protect children, and they protect you too."],[4.07,"Children need to be able to trust the adults around them, and clear boundaries make it much easier for everyone to spot behaviour that is not right."],[13.4,"Follow your school’s staff code of conduct at all times."],[17.16,"Contact pupils and parents only through approved school systems, never through personal phones or social media accounts."],[25.22,"Be careful with lifts, gifts, one-to-one situations and physical contact, and follow your school’s guidance on safer working practice, so that your actions can never be misunderstood."],[37.86,"A low-level concern is any concern, however small, that an adult may have acted in a way that is not consistent with the code of conduct, but which does not meet the threshold for harm."],[49.69,"Examples include being over-friendly with a pupil or having favourites."],[54.23,"These should still be shared, following your school’s policy, and that includes reporting yourself if you realise you have made a mistake."],[63.4,"Keeping Children Safe in Education 2026 also asks every member of staff to be particularly alert to children who may need early help."],[72.51,"This includes pupils who are repeatedly removed from class or on a part-time timetable, young carers, children with mental health needs, and those at risk of being radicalised."],[84.56,"Your daily contact with these children is exactly what makes early help possible."],[90.45,"Some of these children are easy to miss."],[93.38,"The 2021 Census found around 120,000 young unpaid carers aged five to seventeen in England, many of them looking after a parent, brother or sister at home."],[104.74,"Tiredness, lateness or unfinished homework can be a sign of caring at home, not a lack of effort, so be curious and share what you notice."],[115.2,"Your role is to notice, record and report."],[118.37,"Investigating is the job of the DSL and, where needed, other agencies."],[123.66,"Asking repeated questions, or speaking to families yourself, can cause distress and may harm any later enquiry."]],"segs":[{"t":0.0,"d":13.05,"a":"l5_0"},{"t":13.4,"d":24.11,"a":"l5_1"},{"t":37.86,"d":25.19,"a":"l5_2"},{"t":63.4,"d":26.7,"a":"l5_3"},{"t":90.45,"d":24.4,"a":"l5_d"},{"t":115.2,"d":16.83,"a":"l5_4"}],"sources":[["Department for Education, Keeping children safe in education 2026","https://www.gov.uk/government/publications/keeping-children-safe-in-education--2"],["Office for National Statistics, Unpaid care by age, sex and deprivation, England and Wales: Census 2021","https://www.ons.gov.uk/peoplepopulationandcommunity/healthandsocialcare/socialcare/articles/unpaidcarebyagesexanddeprivationenglandandwales/census2021"]],"nt":{"n5a":14.9,"n5b":39.4,"n5c":116.8}},"l6":{"dur":168,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 6 · Online Safety","title":"Online and offline harm are connected","ph":4},{"t":13.69,"layout":"stat","kicker":"Children online","title":"of children aged 8 to 17 go online, and 78% have their own mobile phone","stat":"99%","src":"Ofcom, 2025/26","pct":99},{"t":34.87,"layout":"grid","kicker":"The 4 Cs","title":"Areas of online risk","items":["<b>Content</b>Harmful material, misinformation, conspiracy theories","<b>Contact</b>Harmful contact, such as grooming","<b>Conduct</b>Bullying, or sharing images without consent","<b>Commerce</b>Scams, gambling, pressure to buy"],"art":"quad","icons":["eye","users","alert","pound"]},{"layout":"stat","kicker":"The scale of online abuse","stat":"291,730","title":"reports confirmed as child sexual abuse imagery by the Internet Watch Foundation in 2024","src":"Internet Watch Foundation, 2024","t":64.74},{"t":85.35,"layout":"stat","kicker":"Images","title":"of the child sexual abuse imagery confirmed by the IWF in 2024 was “self-generated”","stat":"91%","src":"Internet Watch Foundation, 2024","pct":91},{"t":108.67,"layout":"list","kicker":"If an image is shared","title":"Nudes or semi-nudes","items":["Never view, copy, print, forward or save it","Don’t delete it or ask the child to","Tell the DSL straight away"],"art":"avoid","marks":["x","x","ok"],"ask":{"q":"A pupil says a nude image of them is on a classmate’s phone. What should you record?","opts":["A description of the image","What you were told, not what is in the image","Nothing until the DSL has seen it"],"a":1,"why":"Record what you were told. Never view the image, and tell the DSL straight away."}},{"t":132.7,"layout":"callout","kicker":"Systems and phones","title":"Filtering, monitoring and phone-free schools","items":["Systems block and flag harmful content","Schools are phone-free by default","Report anything that gets through"]},{"t":153.15,"layout":"quote","kicker":"Key principle","title":"Treat online concerns like any other concern.","items":["Record and report."]}],"captions":[[0.0,"Children’s lives online and offline are closely connected."],[3.57,"The friendships, pressures and risks they experience on their phones follow them into school, and what happens in school often continues online in the evening."],[13.69,"Almost every child is online."],[15.8,"Ofcom’s latest research found that 99% of children aged 8 to 17 go online, and 78% have their own mobile phone."],[23.85,"Ownership rises sharply as children move to secondary school, so online safety matters for every member of staff, whatever age group you work with."],[34.87,"Online risks are grouped into four areas, known as the 4 Cs."],[39.27,"Content means seeing harmful or illegal material, including misinformation, disinformation and conspiracy theories."],[47.69,"Contact means harmful contact with others, such as grooming."],[52.09,"Conduct covers behaviour that causes harm, like bullying or sharing images without consent."],[58.75,"And commerce covers risks such as scams, online gambling and pressure to buy."],[64.74,"The scale of online abuse is huge."],[67.68,"In 2024, the Internet Watch Foundation confirmed 291,730 reports as containing child sexual abuse imagery, and a single report can include many images."],[80.76,"Behind every one of those images is a real child."],[85.35,"Images are a growing concern."],[87.51,"In 2024 the Internet Watch Foundation found that 91% of the child sexual abuse imagery it confirmed was so-called self-generated, often created after a child had been groomed, coerced or tricked online."],[102.52,"AI tools now make it possible to create fake nude images of real children too."],[108.67,"If you learn that a nude or semi-nude image of a child has been shared, never view, copy, print, forward or save it, and do not delete it or ask the child to delete it."],[120.11,"Reassure the child that they are not in trouble, record what you were told rather than what is in the image, and tell the DSL straight away."],[129.64,"The same applies to images made with AI."],[132.7,"Schools use filtering and monitoring systems to block and flag harmful content, and since September 2026 schools in England are expected to be mobile phone-free throughout the school day."],[144.9,"Know how your school’s systems work, and report anything worrying that gets through, just as you would any other concern."],[153.15,"Treat online concerns in exactly the same way as any other safeguarding concern: record what you people, including adults posing as children, is a Contact risk."}},{"t":132.82,"layout":"stat","kicker":"Harmful content","title":"secondary school age children have seen harmful content online","stat":"7 in 10","src":"Ofcom, Online Nation 2025","pct":70},{"t":160.67,"layout":"quote","kicker":"Key principle","title":"An online concern is a safeguarding concern.","items":["Record it and tell the DSL."]}],"captions":[[0.0,"Most children now spend part of every day online, gaming, watching videos and talking to friends."],[7.52,"For the children you teach, there is no real line between online and offline life, so online safety is not a separate subject."],[17.29,"It is part of safeguarding, and part of every member of staff’s role."],[22.98,"Ofcom’s latest research shows that 99% of children aged 8 to 17 go online, and 78% have their own mobile phone."],[31.24,"Ownership jumps around the move to secondary school, and more than half of ten-year-olds already have a phone of their own."],[40.4,"Whatever age group you work with, many of your pupils carry the whole internet in their pocket."],[47.81,"Children play games with live voice and text chat, where they can talk to people they have never met."],[55.42,"They watch, make and share videos and livestreams, and spend hours in group chats with friends."],[62.59,"Many now use AI chatbots and new apps that adults may not know well, so stay curious about what your pupils are actually using."],[72.52,"Artificial intelligence is now part of that world."],[76.49,"Ofcom’s latest report, published in 2026, found that over half of children aged 8 to 17, 56%, say they have used AI."],[85.69,"One in ten of those users said they had used AI as someone to talk to, or as a friend."],[92.51,"Ask your pupils which tools they use, and what they use them for."],[98.01,"Keeping Children Safe in Education groups online risk into four areas, known as the 4 Cs."],[105.01,"Content means seeing harmful or illegal material, now including misinformation, disinformation and conspiracy theories."],[114.37,"Contact means harmful contact with other people, including adults pretending to be children."],[121.61,"Conduct is behaviour that causes harm, such as bullying or sharing images, and commerce covers scams, online gambling and pressure to buy."],[132.82,"Harm is not rare."],[134.2,"In 2025, Ofcom found that seven in ten children of secondary school age had seen harmful content online, most often bullying and hateful content."],[146.0,"Keeping Children Safe in Education expects every school to have a whole-school approach to online safety, and to keep up with new and emerging technology such as generative AI."],[160.67,"So the key principle for this course is simple."],[164.46,"An online concern is a safeguarding concern."],[168.01,"Record what you know and tell the DSL, exactly as you would for any other worry about a child."]],"segs":[{"t":0.0,"d":22.63,"a":"ol1_0"},{"t":22.98,"d":24.48,"a":"ol1_1"},{"t":47.81,"d":24.36,"a":"ol1_2"},{"t":72.52,"d":25.14,"a":"ol1_d"},{"t":98.01,"d":34.46,"a":"ol1_3"},{"t":132.82,"d":27.5,"a":"ol1_4"},{"t":160.67,"d":14.94,"a":"ol1_5"}],"sources":[["Ofcom, Children and Parents: Media Use and Attitudes Report 2025/26","https://www.ofcom.org.uk/media-use-and-attitudes/media-habits-children/childrens"],["Ofcom, Online Nation 2025","https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/online-research/online-nation/2025/online-nations-report-2025.pdf"],["Department for Education, Keeping children safe in education 2026","https://www.gov.uk/government/publications/keeping-children-safe-in-education--2"],["Ofcom, Children and Parents: Media Use and Attitudes Report 2025/26 (May 2026)","https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/media-literacy-research/children/2026-children-and-parents-report/children-and-parents-media-use-and-attitudes-report-2025-6.pdf"]],"nt":{"o1a":99.5,"o1b":134.3,"o1c":138.3}},"ol2":{"dur":158,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 2 · Grooming and Online Contact","title":"When contact becomes grooming","ph":"ost-2"},{"t":22.83,"layout":"list","kicker":"How it works","title":"What groomers often do","items":["Build trust with flattery and attention","Give gifts, game credit or money","Ask the child to keep it secret","Move the chat to a private app"],"icons":["heart","gift","lock","chat"],"art":"stairs","ask":{"q":"Why do groomers often try to move a chat to a private app?","opts":["Because the graphics are better","To avoid being seen and keep it secret","Because games don’t allow chat"],"a":1,"why":"Secrecy is the groomer’s most important tool. Moving to a private or encrypted app keeps the contact hidden."}},{"t":48.96,"layout":"list","kicker":"Warning signs","title":"Things you might notice","items":["Secrecy about an online friend","Unexplained gifts or money","Upset or withdrawn after being online","Talk of an older “boyfriend” or “girlfriend”"],"icons":["lock","gift","alert","users"]},{"layout":"stat","kicker":"A growing crime","stat":"7,263","title":"online grooming offences recorded by UK police in the year to March 2025, a record high","src":"NSPCC, from UK police data, 2025","t":72.12},{"t":96.38,"layout":"chart","kicker":"Sextortion","title":"Reports of child sexual extortion to the IWF, January to June","src":"Internet Watch Foundation, 2025","bars":[["2024",89,"89"],["2025",153,"153"]],"max":160},{"t":124.14,"layout":"callout","kicker":"Act","title":"Tell the DSL straight away","items":["Don’t contact the other person","Don’t ask the child to show you images","The DSL may report to CEOP or the police"],"ph":"ost-2b"},{"t":145.67,"layout":"quote","kicker":"Key principle","title":"Secrecy is a red flag.","items":["Share the worry."]}],"captions":[[0.0,"Online grooming is when someone builds a relationship with a child in order to abuse or exploit them."],[7.62,"It can happen through games, social media or messaging apps, and the person may pretend to be another young person."],[16.29,"Grooming is often slow and patient, which is why the warning signs matter so much."],[22.83,"Groomers usually start by building trust, with flattery, attention and a sense that they understand the child better than anyone else."],[33.26,"They may give gifts, game credit or money."],[36.53,"They ask the child to keep the friendship secret, and they often try to move the conversation from a public game or platform to a private or encrypted app."],[48.96,"In school, you might notice a child who is secretive about an online friend, or who has gifts or money they cannot explain."],[57.34,"They may seem upset, anxious or withdrawn after being online, or talk about an older boyfriend or girlfriend they met on the internet."],[66.46,"None of these signs proves grooming on its own, but each one is worth sharing."],[72.12,"Grooming is a crime that police are recording more and more often."],[77.42,"Data gathered by the NSPCC from police forces across the UK showed 7,263 online grooming offences recorded in the year to March 2025, a record high."],[89.29,"Every one of those offences involved a child talking to someone they trusted online."],[96.38,"One fast-growing form of online abuse is sexual extortion, often called sextortion."],[103.1,"A child is tricked into sharing an image, then threatened unless they pay money or send more."],[110.62,"The Internet Watch Foundation received 153 reports in the first half of 2025, up 72% on the same period a year earlier, and 97% of the children involved were boys."],[124.14,"If you are worried, tell the DSL straight away."],[127.62,"Do not contact the other person yourself, and never ask the child to show you any images."],[134.21,"Reassure a child who is being threatened that they are not in trouble and that help is available."],[141.39,"The DSL may report the concern to CEOP or the police."],[145.67,"Remember that secrecy is the groomer’s most important tool."],[149.87,"When a child is keeping :"There were 8,778 referrals, and children aged 11 to 15 were the largest group, at 36%."}},{"t":85.76,"layout":"list","kicker":"Respond","title":"What to do","items":["Listen and take it seriously","Keep evidence of messages","Follow your behaviour and anti-bullying policies","Tell the DSL if a child may be at risk"],"icons":["ear","camera","doc","shield"],"art":"process"},{"t":108.44,"layout":"quote","kicker":"Key principle","title":"It’s not “just online”.","items":["The harm is real."]}],"captions":[[0.0,"Bullying used to stop at the school gate."],[3.2,"Now it can follow children home, into their bedrooms and onto the phone beside their bed."],[10.16,"This module looks at cyberbullying, harmful content and online radicalisation, and what to do when a child is affected."],[19.8,"The Office for National Statistics found that around one in five children aged 10 to 15 in England and Wales had experienced at least one type of online bullying behaviour in a year."],[32.98,"Many of them did not tell anyone, which is why staff need to notice and ask."],[38.83,"Cyberbullying can be unkind messages or comments, or deliberately leaving someone out of a group chat."],[46.37,"It can mean setting up fake accounts to pretend to be someone else, or sharing photos and videos to embarrass or humiliate a person."],[56.13,"Because it is online, it can be seen by many people and is hard to escape."],[61.94,"Some content can draw children towards extremist views."],[66.33,"In the year to March 2025 there were 8,778 referrals to Prevent, and children aged 11 to 15 were the largest group, at 36%."],[76.15,"Concerns about radicalisation, like any other harmful content, should be shared with the DSL under the Prevent duty."],[85.76,"If a child tells you about bullying or harmful content, listen and take it seriously."],[92.02,"Help them keep evidence, such as screenshots of messages, without sharing them further."],[98.43,"Follow your school’s behaviour and anti-bullying policies, and tell the DSL if a child may be at risk of harm, including self-harm."],[108.44,"Never treat online harm as less serious because it happened on a screen."],[114.22,"It is not just online."],[115.99,"The harm is real."]],"segs":[{"t":0.0,"d":19.45,"a":"ol3_0"},{"t":19.8,"d":18.68,"a":"ol3_1"},{"t":38.83,"d":22.76,"a":"ol3_2"},{"t":61.94,"d":23.47,"a":"ol3_3"},{"t":85.76,"d":22.33,"a":"ol3_4"},{"t":108.44,"d":8.91,"a":"ol3_5"}],"sources":[["Office for National Statistics, Online bullying in England and Wales: year ending March 2020","https://www.ons.gov.uk/peoplepopulationandcommunity/crimeandjustice/bulletins/onlinebullyinginenglandandwales/yearendingmarch2020"],["Home Office, Individuals referred to and supported through the Prevent programme, April 2024 to March 2025","https://www.gov.uk/government/statistics/individuals-referred-to-prevent-to-march-2025/individuals-referred-to-and-supported-through-the-prevent-programme-april-2024-to-march-2025"],["Department for Education, Keeping children safe in education 2026","https://www.gov.uk/government/publications/keeping-children-safe-in-education--2"]],"nt":{"o3a":40.3,"o3b":63.5,"o3c":87.3}},"ol4":{"dur":146,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 4 · Sharing Nudes and Semi-nudes","title":"When an image is shared","ph":"ost-4"},{"t":15.59,"layout":"callout","kicker":"The law","title":"Nude images of under-18s are illegal","items":["Even if the child took the image themselves","Even if it was shared with consent","The child should still be treated as a victim"]},{"t":41.49,"layout":"stat","kicker":"How images are made","title":"of child sexual abuse imagery confirmed by the IWF in 2024 was “self-generated”","stat":"91%","src":"Internet Watch Foundation, 2024","pct":91},{"layout":"stat","kicker":"AI-made images","stat":"+380%","pct":100,"title":"rise in reports of AI-generated child sexual abuse imagery actioned by the IWF in 2024 (245 reports)","src":"Internet Watch Foundation, 2024","t":68.85},{"t":93.84,"layout":"list","kicker":"Never","title":"What not to do","items":["View, copy, print or save the image","Forward it, even to the DSL","Delete it, or ask the child to delete it or show you"],"cls":"l-avoid","icons":["eye","mail","alert"],"art":"avoid","ask":{"q":"Can you forward an image to the DSL so they can see it?","opts":["Yes, by email","No, never forward it, even to the DSL","Only if the child agrees"],"a":1,"why":"Never view, copy, save or forward the image, even to the DSL. Tell the DSL what you were told."}},{"t":113.8,"layout":"list","kicker":"Do","title":"What to do","items":["Tell the DSL straight away","Record what you were told","Reassure the child they are not in trouble"],"icons":["shield","doc","heart"],"ph":"ost-4b","art":"process"},{"t":139.56,"layout":"quote","kicker":"Key principle","title":"Support the child. Don’t blame them.","items":["The DSL leads from here."]}],"captions":[[0.0,"This module covers one of the most sensitive situations staff face: when a nude or semi-nude image of a child has been made or shared."],[9.32,"How you respond in the first few minutes can protect the child, or add to their harm."],[15.59,"Making, possessing or sharing a nude or semi-nude image of anyone under 18 is illegal."],[22.65,"That is true even if the child took the picture themselves, and even if it was shared with consent."],[30.79,"The national guidance for schools is clear that the child should be treated as a victim who needs support, not as an offender."],[41.49,"Most abuse images are now created by children themselves, often after being groomed, pressured or tricked."],[49.86,"In 2024, 91% of the child sexual abuse imagery confirmed by the Internet Watch Foundation was so-called self-generated."],[59.26,"AI tools can also be used to create fake nude images of real children, and these are treated in exactly the same way."],[68.85,"AI is making this harder."],[70.83,"In 2024 the Internet Watch Foundation took action on 245 reports of AI-generated child sexual abuse imagery, a rise of 380% on the year before."],[82.16,"Some of these images show real, recognisable children."],[86.44,"An AI-made nude image of a pupil is handled in exactly the same way as a real photograph."],[93.84,"Never view, copy, print or save the image, and never forward it to anyone, even to the DSL."],[100.89,"Do not delete it, and do not ask the child to delete it or to show it to you."],[106.86,"Each of these actions could break the law and could make things harder for the child."],[113.8,"Instead, tell the DSL straight away."],[116.63,"Record what you were told, not what is in the image."],[120.7,"Reassure the child that they are not in trouble for telling you and that adults will help."],[127.76,"Childline and the Internet Watch Foundation run a service called Report Remove, which helps young people get nude images of themselves taken down."],[139.56,"Avoid any language that blames the child."],[142.55,"Support them, and let the DSL lead from here."]],"segs":[{"t":0.0,"d":15.24,"a":"ol4_0"},{"t":15.59,"d":25.55,"a":"ol4_1"},{"t":41.49,"d":27.01,"a":"ol4_2"},{"t":68.85,"d":24.64,"a":"ol4_d"},{"t":93.84,"d":19.61,"a":"ol4_3"},{"t":113.8,"d":25.41,"a":"ol4_4"},{"t":139.56,"d":6.26,"a":"ol4_5"}],"sources":[["UKCIS, Sharing nudes and semi-nudes: advice for education settings (2024)","https://www.gov.uk/government/publications/sharing-nudes-and-semi-nudes-advice-for-education-settings-working-with-children-and-young-people"],["Internet Watch Foundation, Annual Data and Insights Report 2024","https://www.iwf.org.uk/annual-data-insights-report-2024/data-and-insights/reports-assessment"],["Department for Education, Keeping children safe in education 2026","https://www.gov.uk/government/publications/keeping-children-safe-in-education--2"],["Internet Watch Foundation, How AI is being abused to create child sexual abuse imagery","https://www.iwf.org.uk/about-us/why-we-exist/our-research/how-ai-is-being-abused-to-create-child-sexual-abuse-imagery"]],"nt":{"o4a":17.1,"o4b":115.3,"o4c":119.3}},"ol5":{"dur":135,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 5 · Safe Practice and Filtering","title":"Model the behaviour you teach","ph":"ost-5"},{"t":13.47,"layout":"list","kicker":"In the classroom","title":"Teaching safely online","items":["Watch videos in full before showing them","Close notifications before screen sharing","Use school accounts and systems only","Check school policy before using AI tools"],"icons":["video","bell","lock","ai"],"art":"checklist","ask":{"q":"What should you do before sharing your screen in class?","opts":["Turn up the volume","Close notifications and other tabs","Log out of school accounts"],"a":1,"why":"Close notifications and other tabs, so nothing unexpected appears on the board."}},{"t":40.82,"layout":"callout","kicker":"Systems","title":"Filtering and monitoring","items":["Blocks and flags harmful content","Report anything that gets through","Report useful sites that are wrongly blocked"]},{"t":65.37,"layout":"list","kicker":"Your footprint","title":"Protecting yourself","items":["Keep personal accounts private","Never connect with pupils on personal accounts","Think before you post"],"icons":["lock","users","chat"],"ph":"ost-5b","art":"checklist"},{"t":87.21,"layout":"callout","kicker":"Phones","title":"Phone-free schools","items":["Schools are phone-free by default","Follow your school’s phone policy","Model it yourself"]},{"layout":"stat","art":"duo","kicker":"Phone policies","title":"Most schools already restrict phones","duo":[["99.8%","of primary schools restrict pupils’ phone use",99.8],["90%","of secondary schools restrict pupils’ phone use",90]],"src":"Children’s Commissioner, 2025","t":101.31},{"t":126.87,"layout":"quote","kicker":"Key principle","title":"Safe staff make safe classrooms.","items":["Follow your code of conduct online too."]}],"captions":[[0.0,"Children learn as much from what adults do as from what they say."],[4.44,"This final module looks at safe practice in the classroom, filtering and monitoring, and protecting your own digital footprint."],[13.47,"Always watch videos in full before you show them in class, because adverts and suggested videos can appear without warning."],[22.7,"Close notifications and other tabs before you share your screen."],[27.5,"Use school accounts and approved systems only, and check your school’s policy before using AI tools, never entering pupils’ personal information unless the tool is approved."],[40.82,"Every school should meet the Department for Education’s filtering and monitoring standards."],[47.04,"Filtering blocks harmful content, and monitoring flags worrying activity so that staff can act."],[53.53,"No system is perfect, so report anything harmful that gets through, and report useful sites that are wrongly blocked too, so the system keeps working well for teaching."],[65.37,"Keep your personal social media accounts private, and never connect with pupils or contact them through personal accounts."],[74.6,"Think before you post, because content can be copied, shared and found years later."],[80.88,"Your school’s code of conduct applies online, just as it does in the classroom."],[87.21,"Schools in England are now expected to be mobile phone-free throughout the school day."],[93.12,"Follow your school’s policy consistently, and model it yourself by keeping your own phone out of sight in lessons."],[101.31,"Most schools were already moving in this direction."],[105.29,"When the Children’s Commissioner surveyed more than 15,000 schools, 99.8% of primary schools and 90% of secondary schools already had policies restricting pupils’ phone use during the school day."],[120.51,"What makes the difference is every adult applying the policy in the same way."],[126.87,"Safe staff make safe classrooms."],[128.93,"Thank you for completing this course, and for helping children to stay safe online."]],"segs":[{"t":0.0,"d":13.12,"a":"ol5_0"},{"t":13.47,"d":27.0,"a":"ol5_1"},{"t":40.82,"d":24.2,"a":"ol5_2"},{"t":65.37,"d":21.49,"a":"ol5_3"},{"t":87.21,"d":13.75,"a":"ol5_4"},{"t":101.31,"d":25.21,"a":"ol5_d"},{"t":126.87,"d":7.4,"a":"ol5_5"}],"sources":[["Department for Education, Filtering and monitoring standards for schools and colleges","https://www.gov.uk/guidance/meeting-digital-and-technology-standards-in-schools-and-colleges/filtering-and-monitoring-standards-for-schools-and-colleges"],["Department for Education, Mobile phones in schools (2026)","https://www.gov.uk/government/publications/mobile-phones-in-schools"],["Department for Education, Keeping children safe in education 2026","https://www.gov.uk/government/publications/keeping-children-safe-in-education--2"],["Children’s Commissioner for England, School phone policies in England (2025)","https://www.childrenscommissioner.gov.uk/resource/school-phone-policies-in-england-findings-from-the-childrens-commissioners-school-and-college-survey/"]],"nt":{"o5a":42.3,"o5b":66.9,"o5c":70.9,"o5d":88.7}},"pl1":{"dur":128,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 1 · Your Child’s Online World","title":"Getting to know their online world","ph":"osp-1"},{"t":13.92,"layout":"chart","kicker":"Children online","title":"Children and phones in the UK","src":"Ofcom, 2025/26","bars":[["Go online, ages 8 to 17",99,"99%"],["Have their own phone, ages 8 to 17",78,"78%"],["Parents of 3 to 5s who say their child uses social media",37,"37%"]],"max":100},{"t":34.16,"layout":"list","kicker":"What children do","title":"Where children spend time","items":["Games, often with live chat","Watching and making videos","Messaging and group chats","Social media, sometimes too young"],"icons":["game","video","chat","phone"],"ph":"osp-1b"},{"t":49.96,"layout":"grid","kicker":"Age ratings","title":"Check the rating","items":["<b>PEGI 3 and 7</b>Suitable for younger children","<b>PEGI 12</b>Some violence or bad language","<b>PEGI 16 and 18</b>Adult themes and content","<b>Social media</b>Most apps say 13 or over"],"icons":["star","eye","alert","phone"],"art":"stairs","ask":{"q":"What does a PEGI rating tell you about a game?","opts":["How hard it is","The content, such as violence, fear or bad language","How long it lasts"],"a":1,"why":"PEGI ratings describe the content, not the difficulty."}},{"t":74.04,"layout":"stat","kicker":"What children see","title":"secondary school age children have seen harmful content online","stat":"7 in 10","src":"Ofcom, Online Nation 2025","pct":70},{"layout":"stat","art":"duo","kicker":"Spotting fakes","title":"Confident is not the same as correct","duo":[["6 in 10","children spotted that a social media profile was fake",61],["3 in 10","felt confident, but still got it wrong",31]],"src":"Ofcom, 2026","t":95.86},{"t":119.16,"layout":"quote","kicker":"Key principle","title":"Be curious, not furious.","items":["Ask them to show you."]}],"captions":[[0.0,"Your child’s online life is a big part of their world, just like school and friends."],[5.23,"You don’t need to be a technology expert to keep them safe."],[8.9,"What matters most is staying interested, staying calm and staying involved."],[13.92,"Almost every child in the UK goes online, and Ofcom found that 78% of 8 to 17 year olds have their own phone."],[21.64,"Children start young too."],[23.41,"More than a third of parents of three to five year olds say their child already uses social media, even though most apps are designed for over-13s."],[34.16,"Many children play games with live chat, where they can talk to people they don’t know."],[39.16,"They watch and make videos, and keep in touch with friends in messaging apps and group chats."],[44.5,"Some use social media before they are old enough, often because their friends already do."],[49.96,"Games sold in the UK carry PEGI age ratings of 3, 7, 12, 16 and 18."],[54.86,"The rating tells you about the content, such as violence, fear or bad language, not how difficult the game is."],[62.92,"Most social media apps say users must be at least 13, and age limits are there to protect children from content and contact they are not ready for."],[74.04,"Even with good settings, children will come across things that upset or mislead them."],[80.01,"Ofcom found that seven in ten secondary school age children had seen harmful content online, such as bullying or hateful content."],[89.06,"Fake news and AI-made images are common too, so help your child ask: who made this, and why?"],[95.86,"Children are often more confident than they are accurate."],[99.96,"In Ofcom’s latest research, around six in ten children aged 8 to 17 spotted that a social media profile was fake, but three in ten said they were confident and still got it wrong."],[112.84,"Practise together."],[114.13,"Look at a profile or a post and ask: how do we know this is real?"],[119.16,"The best approach is to be curious, not furious."],[122.1,"Ask your child to show you the games and apps they enjoy, and let them be the expert."]],"segs":[{"t":0.0,"d":13.57,"a":"pl1_0"},{"t":13.92,"d":19.89,"a":"pl1_1"},{"t":34.16,"d":15.45,"a":"pl1_2"},{"t":49.96,"d":23.73,"a":"pl1_3"},{"t":74.04,"d":21.47,"a":"pl1_4"},{"t":95.86,"d":22.95,"a":"pl1_d"},{"t":119.16,"d":8.14,"a":"pl1_5"}],"sources":[["Ofcom, Children and Parents: Media Use and Attitudes Report 2025/26","https://www.ofcom.org.uk/media-use-and-attitudes/media-habits-children/childrens"],["Ofcom, Online Nation 2025","https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/online-research/online-nation/2025/online-nations-report-2025.pdf"],["Ofcom, Children and Parents: Media Use and Attitudes Report 2025/26 (May 2026)","https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/media-literacy-research/children/2026-children-and-parents-report/children-and-parents-media-use-and-attitudes-report-2025-6.pdf"]],"nt":{"pa1":51.5,"pa2":55.5,"pa5":75.5,"pa3":79.5,"pa4":83.5}},"pl2":{"dur":101,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 2 · Settings, Controls and Privacy","title":"Setting things up safely","ph":"osp-2"},{"t":12.88,"layout":"list","kicker":"Parental controls","title":"Controls you can use","items":["Broadband and mobile network filters","Device and console controls","Approval before downloads or purchases","Limits on in-game chat"],"icons":["home","devices","check","chat"]},{"t":34.06,"layout":"callout","kicker":"Privacy","title":"Protect their information","items":["Set accounts to private","Turn off location sharing","Avoid posting school uniform or full names"],"ph":"osp-2b","art":"checklist","ask":{"q":"What does the lesson suggest turning off unless you have agreed it together?","opts":["Location sharing","The camera","The volume"],"a":0,"why":"Turn off location sharing unless you have agreed it together for a good reason."}},{"t":52.98,"layout":"list","kicker":"Money","title":"In-app purchases","items":["Turn on purchase approval","Use gift cards, not saved bank cards","Talk about loot boxes and “free” games"],"icons":["lock","pound","game"],"art":"checklist"},{"layout":"chart","kicker":"Controls in real life","title":"Knowing, using and getting round controls","max":100,"bars":[["Parents aware of at least one control",93,"93%"],["Parents using at least one control",76,"76%"],["Children who used a VPN in the last six months",25,"25%"]],"src":"Ofcom, 2025 and 2026","t":69.1},{"t":95.13,"layout":"quote","kicker":"Key principle","title":"Controls help. Conversations matter more.","items":["No filter catches everything."]}],"captions":[[0.0,"Settings and parental controls are a good first step in keeping children safe online."],[5.09,"They take a little time to set up, and they work best when you set them up together with your child, so they understand why."],[12.88,"Most broadband and mobile providers offer free filters that block adult content across your home."],[19.11,"Phones, tablets and games consoles have their own parental controls too."],[23.74,"You can ask to approve downloads and purchases before they happen, and in many games you can limit chat, or turn it off for people your child doesn’t know."],[34.06,"Set your child’s accounts to private, so only people they know can see what they post."],[39.26,"Turn off location sharing unless you have agreed it together for a good reason."],[44.04,"And think about what you post yourself: photos that show a school uniform, a full name or your street can tell strangers more than you intend."],[52.98,"Many free games make money from in-app purchases and loot boxes."],[56.73,"Turn on purchase approval, and consider using gift cards rather than a saved bank card."],[61.83,"Talk with your child about how games are designed to keep them spending, so they can spot the pressure for themselves."],[69.1,"Most parents know these tools exist, but fewer use them."],[73.04,"Ofcom found that 93% of parents are aware of at least one parental control, but around three quarters actually use one."],[81.41,"And in Ofcom’s latest report, a quarter of children said they had used a VPN in the last six months, which can get round some controls."],[90.91,"That is why controls work best alongside conversations."],[95.13,"Controls help, but conversations matter more."],[97.74,"No filter catches everything, so keep talking."]],"segs":[{"t":0.0,"d":12.53,"a":"pl2_0"},{"t":12.88,"d":20.83,"a":"pl2_1"},{"t":34.06,"d":18.57,"a":"pl2_2"},{"t":52.98,"d":15.77,"a":"pl2_3"},{"t":69.1,"d":25.68,"a":"pl2_d"},{"t":95.13,"d":5.28,"a":"pl2_4"}],"sources":[["Ofcom, Children and Parents: Media Use and Attitudes Report 2025/26","https://www.ofcom.org.uk/media-use-and-attitudes/media-habits-children/childrens"],["Ofcom, Children and Parents: Media Use and Attitudes Report 2025","https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/media-literacy-research/children/childrens-media-use-and-attitudes-report-2025/childrens-media-literacy-report-2025.pdf"],["Ofcom, Children and Parents: Media Use and Attitudes Report 2025/26 (May 2026)","https://www.ofcom.org.uk/siteassets/resources/documents/research-and-data/media-literacy-research/children/2026-children-and-parents-report/children-and-parents-media-use-and-attitudes-report-2025-6.pdf"]],"nt":{"pb1":14.4,"pb2":35.6,"pb3":54.5}},"pl3":{"dur":103,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 3 · Talking With Your Child","title":"Keep talking","ph":"osp-3"},{"t":12.24,"layout":"list","kicker":"Conversation tips","title":"Making it easy to talk","items":["Ask them to show you their favourite apps","Talk little and often","Agree family rules together","Promise they won’t be in trouble for telling you"],"icons":["phone","chat","family","heart"],"art":"checklist","ask":{"q":"What must children know if they tell you something worrying?","opts":["That they won’t be in trouble","That they will lose their phone","That you will tell their teacher straight away"],"a":0,"why":"Children who know they won’t be in trouble are far more likely to tell you when something goes wrong."}},{"t":33.98,"layout":"list","kicker":"Warning signs","title":"Signs something may be wrong","items":["Secretive about their phone","Upset after being online","New older friends you don’t know","Gifts or money you can’t explain"],"icons":["lock","alert","users","gift"],"ph":"osp-3b"},{"layout":"stat","art":"duo","kicker":"Pressure online","title":"How being online can feel","duo":[["7 in 10","feel pressure to be popular online at least sometimes",70],["1 in 3","feel that pressure all or most of the time",33]],"src":"Ofcom, 2026","t":55.91},{"t":80.67,"layout":"explain","kicker":"Why not just ban it?","title":"Bans can backfire","text":"If children fear losing their phone, they are less likely to tell you when something goes wrong."},{"t":98.07,"layout":"quote","kicker":"Key principle","title":"Make sure they know they can tell you anything.","items":["Stay calm when they do."]}],"captions":[[0.0,"Talking with your child is the most powerful online safety tool you have."],[4.23,"Children who feel they can talk to a parent about what happens online are far more likely to ask for help when something goes wrong."],[12.24,"Ask your child to show you their favourite games and apps, and what they like about them."],[17.77,"Talk little and often, in the car or over dinner, not just when something has gone wrong."],[23.31,"Agree family rules together so they feel part of the decision."],[27.16,"Most importantly, make sure they know they won’t be in trouble for telling you about something worrying."],[33.98,"Some signs may mean something is wrong."],[36.56,"Your child might become secretive about their phone, or seem upset, angry or withdrawn after being online."],[43.58,"They might mention new, older friends you don’t know, or have gifts or money you can’t explain."],[49.87,"Changes in sleep, mood or appetite can also be signs that something is troubling them."],[55.91,"Children can feel real pressure online."],[58.81,"Ofcom found that seven in ten children aged 8 to 17 who use social media or messaging apps feel pressure to be popular at least some of the time, and a third feel it all or most of the time."],[72.95,"Asking how being online makes them feel, not just what they do, opens up much better conversations."],[80.67,"When something worrying happens, it is tempting to take the device away."],[85.46,"But if children fear losing their phone, they are much less likely to tell you next time."],[91.39,"Calm limits, agreed together, keep the door open, and an open door is what keeps children safe."],[98.07,"Make sure your child knows they can tell you anything, and stay calm when they do."]],"segs":[{"t":0.0,"d":11.89,"a":"pl3_0"},{"t":12.24,"d":21.39,"a":"pl3_1"},{"t":33.98,"d":21.58,"a":"pl3_2"},{"t":55.91,"d":24.41,"a":"pl3_d"},{"t":80.67,"d":17.05,"a":"pl3_3"},{"t":98.07,"d":4.31,"a":"pl3_4"}],"sources":[["Ofcom, Children and Parents: Media Use and Attitudes Report 2025/26","https://www.ofcom.org.uk/media-use-and-attitudes/media-habits-children/childrens"],["Ofcom, Chi
