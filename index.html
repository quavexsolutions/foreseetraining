 </div>
 <div class="stack" style="gap:16px">
  <div class="card stack" style="gap:10px"><h4>Learning objectives</h4><ul class="small" style="margin:0;padding-left:18px">${S.course.objectives.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>
  <div class="card"><dl class="kv">${lic?`<dt>Quiz</dt><dd>${a.quiz?a.quiz.score+' of '+a.quiz.total:'Optional'}</dd><dt>Certificate</dt><dd>${a.cert?'Available':'When all lessons are done'}</dd>`:`<dt>Assessment</dt><dd>${passed(a)?'Passed':a.attempts.length?'Not yet passed':allDone?'Available':'Locked'}</dd><dt>Certificate</dt><dd>${a.cert?'Available':'Not yet available'}</dd><dt>Pass mark</dt><dd>${S.cfg.passMark}%</dd>`}</dl></div>
  <div class="notice small"><span>Watch at least ${S.cfg.completionPct}% of each video and open its key notes to complete a lesson. Every lesson also has a text version.</span></div>
 </div>
</div></section>`};
AFTER.learner=()=>{
  const cf=$('#conf-form');if(cf){cf.onsubmit=e=>{e.preventDefault();const a=learner(),which=cf.dataset.which,n=S.course.confidence.length,vals=[];for(let i=0;i<n;i++){const r=$(`input[name=conf${i}]:checked`,cf);if(!r){$('#conf-msg').innerHTML='<div class="notice bad small"><span>Choose an answer for each line, or skip.</span></div>';return}vals.push(+r.value)}a.conf=a.conf||{};a.conf[which]=vals;save();if(LIVE)liveCall('learn',{action:'conf',attendee:a.id,which,vals},null,true);toast(which==='before'?'Thanks. You’re ready to start.':'Thanks for your feedback.');render()};$('#conf-skip').onclick=()=>{const a=learner();a.conf=a.conf||{};a.conf[cf.dataset.which]='skipped';save();if(LIVE)liveCall('learn',{action:'conf',attendee:a.id,which:cf.dataset.which,vals:'skipped'},null,true);render()}}
  $$('[data-lesson]').forEach(b=>{if(!$('#conf-form')||$('#conf-form').dataset.which!=='before')return;b.addEventListener('click',e=>{e.stopImmediatePropagation();$('#conf-form').scrollIntoView({behavior:'smooth',block:'center'});toast('Please answer the three quick questions first, or skip them.')},true)});[$('#ld-quiz'),$('#ld-quiz2')].forEach(b=>{if(b)b.onclick=startQuiz});$$('[data-switch]').forEach(b=>b.onclick=()=>{S.session.user=b.dataset.switch;save();render()});$$('[data-lesson]').forEach(b=>b.onclick=()=>go('lesson',{i:+b.dataset.lesson}));const s=$('#ld-assess')||$('#ld-assess2');if(s)s.onclick=()=>startAssessment();const s2=$('#ld-assess2');if(s2)s2.onclick=()=>startAssessment();$$('[data-cert]').forEach(b=>b.onclick=()=>go('certificate'))};

VIEWS.lesson=()=>{if(!guard('learner'))return false;const a=learner(),ls=allLessons(),i=PARAMS.i||0,{m,l}=ls[i];if(!canStart(a,i)){toast('Complete the previous module first.');return VIEWS.learner()}
  return `<section class="wrap app-head stack" style="gap:8px;padding-bottom:14px"><div class="crumbs"><button data-go="learner">My training</button><span>/</span><span>Module ${i+1}</span></div><h1 style="font-size:clamp(1.4rem,2.8vw,2rem)">${esc(m.title)}</h1><p class="muted small">${esc(l.title)} · <span class="mono">${fmtT(l.dur)}</span> · ${l.notes.length} interactive notes</p></section>
<section class="wrap stack" style="gap:20px;padding-bottom:40px">
 <div id="lp"></div>
 <div class="split">
  <div class="stack" style="gap:14px">
   ${S.course.licence?'<div id="lp-checks"></div>':''}
   <div class="row"><button class="btn btn-ghost btn-sm" id="lp-tr" aria-expanded="false">Show transcript</button><button class="btn btn-ghost btn-sm" id="lp-text">Text version of this lesson</button></div>
   <div class="transcript" id="lp-trans" hidden></div>
   <div class="row"><button class="btn btn-ghost" id="lp-prev" ${i===0?'disabled':''}>← Previous module</button></div>
  </div>
  <div class="card stack" style="gap:12px"><h4>To complete this lesson</h4><div class="reqs" id="lp-reqs"></div><p class="small muted" id="lp-done-at"></p></div>
 </div>
</section>`};
AFTER.lesson=()=>{
  const a=learner(),ls=allLessons(),i=PARAMS.i||0,{l}=ls[i];
  const ps=()=>a.progress[l.id]||(a.progress[l.id]={w:'',pos:0,notes:[],done:false});
  const ess=essentials(l);
  const chk=checksFor(S.course,l);
  const reqs=()=>{const p=ps();const pct=watchedPct(p.w,l.dur);const seen=ess.filter(id=>p.notes.includes(id)).length;
    const watchOk=pct>=S.cfg.completionPct||p.textDone||p.done,notesOk=seen===ess.length||p.done,nChk=chk.filter(id=>((p.checks||{})[id]||{}).done).length,chkOk=nChk===chk.length||p.done;
    $('#lp-reqs').innerHTML=`<div><span class="ck ${watchOk?'on':''}">✓</span><span>Watch at least ${S.cfg.completionPct}% of the video <span class="mono small muted">(${p.textDone||p.via==='text'?'text version':pct+'%'})</span></span></div><div><span class="ck ${notesOk?'on':''}">✓</span><span>Open the ${ess.length} key notes <span class="mono small muted">(${seen}/${ess.length})</span></span></div>${chk.length?`<div><span class="ck ${chkOk?'on':''}">✓</span><span>Answer the ${chk.length} check questions <span class="mono small muted">(${nChk}/${chk.length})</span></span></div>`:''}`;
    if(!p.done&&watchOk&&notesOk&&chkOk){p.done=true;p.at=Date.now();p.via=p.textDone?'text':'video';save();liveProgress(a,l.id,true);toast(`${S.course.licence?'Lesson':'Module'} ${i+1} complete.`)}
    $('#lp-done-at').textContent=p.done?`Completed ${fmtDT(p.at)}`:'Your place in the video is saved, so you can stop at any time.';
    $('#lp-next').disabled=!p.done;
  };
  const p0=ps();
  activePlayer=mountPlayer($('#lp'),l,{saved:p0,restrictSeek:!p0.done,
    onSave:st=>{const p=ps();p.w=st.w;p.pos=st.pos;p.notes=st.notes;p.asks=st.asks;save();reqs();liveProgress(a,l.id)},
    onNote:(n,all)=>{const p=ps();p.notes=all;save();reqs();liveProgress(a,l.id,true)},
    onTick:(t,ci)=>{const tr=$('#lp-trans');if(!tr.hidden)$$('button',tr).forEach((b,k)=>b.classList.toggle('now',k===ci))},
    onEnd:()=>{reqs()}});
  {const last=i===ls.length-1,nx=ls[i+1],lbl=last?(S.course.licence?'Back to my course':'Go to the assessment'):(S.course.licence?'Next lesson':'Next module');
   const pane=$('#lp .pl-notes');if(pane)pane.insertAdjacentHTML('beforeend',`<div class="nx-wrap"><button class="nx" id="lp-next" disabled><span class="nx-glow" aria-hidden="true"></span><span class="nx-txt"><span class="nx-k"><span class="nx-lock" aria-hidden="true">${ic('lock')}</span><span class="nx-on">Up next</span><span class="nx-off">Finish to unlock</span></span><span class="nx-t">${esc(last?lbl:lbl+' · '+nx.l.title)}</span></span><span class="nx-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button></div>`);}
  // Check questions: instant feedback, try again if wrong; only the first try is counted (anonymously) for the school
  const CHK={};
  const drawChecks=()=>{const box=$('#lp-checks');if(!box||!chk.length)return;const p=ps();p.checks=p.checks||{};
    const qs=chk.map(id=>S.questions.find(q=>q.id===id)).filter(Boolean);const n=qs.filter(q=>(p.checks[q.id]||{}).done).length;
    box.innerHTML=`<div class="card stack" style="gap:18px"><div class="row between"><h3>Check your understanding</h3><span class="pill ${n===qs.length?'ok':''}">${n} of ${qs.length}</span></div><p class="small muted" style="margin-top:-8px">Two quick questions. If you get one wrong, you’ll see why and can try again. Your answers are private.</p>${qs.map((q,qi)=>{const rec=p.checks[q.id]||{},st=CHK[q.id]||(CHK[q.id]={sel:[],res:null}),multi=q.type==='B',solved=rec.done;
      return `<div class="stack" style="gap:10px" data-chk="${q.id}"><b id="chk-${q.id}">${qi+1}. ${esc(q.text)}</b>${multi&&!solved?'<span class="small muted">Select all that apply.</span>':''}<div class="stack" style="gap:8px" role="group" aria-labelledby="chk-${q.id}">${q.opts.map((o,k)=>{let cls=st.sel.includes(k)?' sel':'';if(solved&&q.ans.includes(k))cls=' right';else if(st.res==='wrong'&&st.sel.includes(k))cls=' wrong';return `<button class="q-opt ${multi?'check':'radio'}${cls}" data-k="${k}" ${solved||st.res==='wrong'?'disabled':''} aria-pressed="${st.sel.includes(k)}"><span class="box"></span><span class="lt">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`}).join('')}</div>
      ${solved?`<div class="notice ok small"><span><b>Correct.</b> ${esc(q.fb)}</span></div>`:st.res==='wrong'?`<div class="notice warn small"><span><b>Not quite.</b> ${esc(q.fb)} <button class="btn-link" data-retry="${q.id}">Try again</button></span></div>`:multi?`<button class="btn btn-ghost btn-sm" data-check="${q.id}" style="align-self:flex-start" ${st.sel.length?'':'disabled'}>Check answer</button>`:''}</div>`}).join('')}</div>`;
    const judge=q=>{const st=CHK[q.id],ok=st.sel.slice().sort().join()===q.ans.slice().sort().join(),p=ps();if(!p.checks[q.id])p.checks[q.id]={first:ok,done:ok};else if(ok)p.checks[q.id].done=true;st.res=ok?'right':'wrong';save();liveProgress(a,l.id,true);drawChecks();reqs()};
    $$('[data-chk]',box).forEach(w=>{const q=S.questions.find(x=>x.id===w.dataset.chk);
      $$('.q-opt',w).forEach(b=>b.onclick=()=>{const st=CHK[q.id],k=+b.dataset.k;if(q.type==='B'){st.sel=st.sel.includes(k)?st.sel.filter(x=>x!==k):[...st.sel,k];drawChecks()}else{st.sel=[k];judge(q)}});
      const c=$('[data-check]',w);if(c)c.onclick=()=>judge(q);
      const r=$('[data-retry]',w);if(r)r.onclick=()=>{CHK[q.id]={sel:[],res:null};drawChecks()};});
  };
  drawChecks();
  reqs();
  const tr=$('#lp-trans');
  tr.innerHTML=l.captions.map((c,k)=>`<button data-t="${c[0]}"><span class="mono">${fmtT(c[0])}</span><span>${esc(c[1])}</span></button>`).join('');
  $$('button',tr).forEach(b=>b.onclick=()=>activePlayer.seek(+b.dataset.t));
  if(l.sources&&l.sources.length)tr.insertAdjacentHTML('afterend',srcList(l));
  $('#lp-tr').onclick=e=>{tr.hidden=!tr.hidden;e.currentTarget.textContent=tr.hidden?'Show transcript':'Hide transcript';e.currentTarget.setAttribute('aria-expanded',!tr.hidden)};
  $('#lp-text').onclick=()=>{
    const m=modal(esc(l.title)+': text version',`<div class="prose stack" style="gap:14px"><p class="small muted">This version has the same content as the video and all its notes.</p>${l.scenes.map((s,k)=>{const end=(l.scenes[k+1]||{t:l.dur+1}).t;return `<div><h4>${esc(s.title)}</h4>${s.bars?`<ul>${s.bars.map(b=>`<li>${esc(b[0])}: <b>${esc(b[2])}</b></li>`).join('')}</ul>${s.src?`<p class="small muted">Source: ${esc(s.src)}</p>`:''}`:''}${s.stat?`<p><b>${esc(s.stat)}</b> ${esc(s.title)}${s.src?` <span class="small muted">(${esc(s.src)})</span>`:''}</p>`:''}<p>${l.captions.filter(c=>c[0]>=s.t&&c[0]<end).map(c=>esc(c[1])).join(' ')}</p></div>`}).join('')}<h3>Notes</h3>${l.notes.map(n=>`<div class="card" style="padding:16px"><h4>${esc(n.title)}</h4><div class="note-body small">${n.body}</div></div>`).join('')}${S.cfg.textAlt?`<label class="checkbox"><input type="checkbox" id="tx-ok"> I have read this lesson and all its notes</label><button class="btn btn-primary" id="tx-done" disabled>Mark lesson complete</button>`:''}</div>`,{wide:true});
    const ok=$('#tx-ok',m);if(ok){ok.onchange=()=>$('#tx-done').disabled=!ok.checked;$('#tx-done').onclick=()=>{const p=ps();p.notes=[...new Set([...p.notes,...l.notes.map(n=>n.id)])];p.textDone=true;save();liveProgress(a,l.id,true);closeModal();reqs();if(!p.done)toast('Thanks. Now answer the check questions to finish this lesson.')}}
  };
  $('#lp-prev').onclick=()=>go('lesson',{i:i-1});
  $('#lp-next').onclick=()=>i===ls.length-1?go('learner'):go('lesson',{i:i+1});
};

function srcList(l){return `<div class="lsrc"><h4>Sources for this lesson</h4><ol>${l.sources.map(s=>`<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('')}</ol></div>`}
/* Optional quiz (licence courses): one question at a time with instant feedback, no pass mark */
let QZ=null;
function startQuiz(){QZ={i:0,score:0,sel:[],checked:false,ids:S.course.quizIds||S.questions.slice(0,10).map(q=>q.id)};go('quiz')}
VIEWS.quiz=()=>{if(!guard('learner'))return false;if(!QZ)return VIEWS.learner();
  if(QZ.i>=QZ.ids.length)return `<section class="wrap"><div class="auth-shell"><div class="card raised stack" style="gap:16px"><p class="eyebrow">Optional quiz</p><h2>You scored ${QZ.score} out of ${QZ.ids.length}</h2><p class="muted">${QZ.score>=8?'Great work. You know a lot about keeping your child safe online.':'Thanks for trying. The lessons are always there if you want a quick recap.'} This quiz is just for you. Your school doesn’t see your score, and it doesn’t affect your certificate.</p><div class="row"><button class="btn btn-primary" data-go="learner">Back to my course</button><button class="btn btn-ghost" id="qz-again">Try again</button></div></div></div></section>`;
  const q=S.questions.find(x=>x.id===QZ.ids[QZ.i]),multi=q.type==='B',mi=S.course.modules.findIndex(m=>m.id===q.m);
  return `<section class="wrap app-head stack" style="gap:6px"><p class="eyebrow">${esc(S.course.title)} · Optional quiz</p><p class="small muted">You’ll see the answer after each question. Your answers are private.</p></section>
<section class="wrap section-tight q-wrap stack" style="gap:18px;padding-top:8px"><div class="row between"><span class="mono small">Question ${QZ.i+1} of ${QZ.ids.length}</span><span class="small muted">${QZ.score} correct so far</span></div><div class="bar"><i style="width:${QZ.i/QZ.ids.length*100}%"></i></div>
 <div class="card raised stack" style="gap:14px"><h2 style="font-size:1.2rem" id="q-text">${esc(q.text)}</h2>${multi?'<p class="small muted" style="margin-top:-6px">Select all that apply, then check your answer.</p>':''}

let ASM=null;
function startAssessment(){
  const a=learner();if(lessonsDone(a)<allLessons().length){toast('Finish all modules first.');return}
  ASM={id:uid(),cur:0,ans:{},qs:S.questions.filter(q=>!q.archived).slice(0,20).map(q=>q.id),submitted:false,review:false};go('assessment');
}
VIEWS.assessment=()=>{if(!guard('learner'))return false;if(!ASM)return VIEWS.learner();
  const qs=ASM.qs.map(id=>S.questions.find(q=>q.id===id));
  if(ASM.review){return `<section class="wrap app-head"><p class="eyebrow">${esc(S.course.title)}</p><h1 style="font-size:clamp(1.5rem,3vw,2rem)">Review your answers</h1></section><section class="wrap section-tight q-wrap stack" style="gap:16px">${qs.map((q,i)=>`<div class="card row between" style="padding:14px 18px;flex-wrap:nowrap"><div style="min-width:0"><span class="mono small muted">Q${i+1}</span> <b class="small">${esc(q.text)}</b><div class="small ${ASM.ans[q.id]?.length?'muted':''}" style="${ASM.ans[q.id]?.length?'':'color:var(--bad);font-weight:600'}">${ASM.ans[q.id]?.length?'Your answer: '+ASM.ans[q.id].map(k=>'ABCD'[k]).join(', '):'Not answered'}</div></div><button class="btn btn-ghost btn-sm" data-jump="${i}">Change</button></div>`).join('')}<div class="row between"><button class="btn btn-ghost" id="as-back">Back to questions</button><button class="btn btn-primary" id="as-submit">Submit assessment</button></div></section>`}
  const q=qs[ASM.cur],multi=q.type==='B',sel=ASM.ans[q.id]||[];
  return `<section class="wrap app-head stack" style="gap:6px"><p class="eyebrow">${esc(S.course.title)} · Final assessment</p><p class="small muted">Answer all ${qs.length} questions. You need ${Math.ceil(qs.length*S.cfg.passMark/100)} correct (${S.cfg.passMark}%) to pass. You can go back and change answers before you submit.</p></section>
<section class="wrap section-tight q-wrap stack" style="gap:20px;padding-top:8px">
 <div class="row between"><span class="mono small">Question ${ASM.cur+1} of ${qs.length}</span><span class="small muted">${Object.values(ASM.ans).filter(x=>x.length).length} answered</span></div>
 <div class="bar"><i style="width:${(ASM.cur+1)/qs.length*100}%"></i></div>
 <div class="card raised stack" style="gap:16px"><h2 style="font-size:1.25rem" id="q-text">${esc(q.text)}</h2>${multi?'<p class="small muted" style="margin-top:-6px">Select all that apply.</p>':''}
  <div class="stack" style="gap:10px" role="${multi?'group':'radiogroup'}" aria-labelledby="q-text">${q.opts.map((o,i)=>`<button class="q-opt ${multi?'check':'radio'} ${sel.includes(i)?'sel':''}" role="${multi?'checkbox':'radio'}" aria-checked="${sel.includes(i)}" data-i="${i}"><span class="box"></span><span class="lt">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
 </div>
 <div class="row between"><button class="btn btn-ghost" id="as-prev" ${ASM.cur===0?'disabled':''}>← Previous</button>${ASM.cur<qs.length-1?'<button class="btn btn-primary" id="as-next">Next →</button>':'<button class="btn btn-primary" id="as-rev">Review answers</button>'}</div>
 <div class="stack" style="gap:8px"><span class="small muted">Jump to a question</span><div class="q-dots">${qs.map((x,i)=>`<button class="${ASM.ans[x.id]?.length?'ans':''} ${i===ASM.cur?'cur':''}" data-jump="${i}" aria-label="Question ${i+1}${ASM.ans[x.id]?.length?', answered':''}">${i+1}</button>`).join('')}</div><button class="btn-link small" id="as-rev2" style="align-self:flex-start">Review all answers</button></div>
</section>`};
AFTER.assessment=()=>{
  const qs=ASM.qs.map(id=>S.questions.find(q=>q.id===id));
  $$('[data-jump]').forEach(b=>b.onclick=()=>{ASM.review=false;ASM.cur=+b.dataset.jump;render()});
  if(ASM.review){$('#as-back').onclick=()=>{ASM.review=false;render()};$('#as-submit').onclick=submitAssessment;return}
  const q=qs[ASM.cur];
  $$('.q-opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;let s=ASM.ans[q.id]||[];if(q.type==='B')s=s.includes(i)?s.filter(x=>x!==i):[...s,i].sort();else s=[i];ASM.ans[q.id]=s;render()});
  const n=$('#as-next');if(n)n.onclick=()=>{ASM.cur++;render()};
  $('#as-prev').onclick=()=>{ASM.cur--;render()};
  const r=$('#as-rev');if(r)r.onclick=()=>{ASM.review=true;render()};
  $('#as-rev2').onclick=()=>{ASM.review=true;render()};
};
function submitAssessment(){
  const qs=ASM.qs.map(id=>S.questions.find(q=>q.id===id));const un=qs.filter(q=>!(ASM.ans[q.id]||[]).length).length;
  confirmBox('Submit your assessment?',un?`You have ${un} unanswered question${un>1?'s':''}. Unanswered questions score zero.`:'You won’t be able to change your answers after you submit.','Submit',()=>{
    if(ASM.submitted)return; // guards against a double submission
    ASM.submitted=true;const a=learner();if(LIVE)return liveAssess(a);
    // Marking: every correct option and no incorrect ones, for all question types.
    let score=0;const wrong=[];qs.forEach(q=>{const g=(ASM.ans[q.id]||[]).slice().sort().join(),c=q.ans.slice().sort().join();if(g===c)score++;else wrong.push(q)});
    const pct=Math.round(score/qs.length*100),pass=pct>=S.cfg.passMark;
    const att={id:ASM.id,score,total:qs.length,pct,pass,at:Date.now(),answers:ASM.ans,version:S.course.version,wrong:wrong.map(q=>q.id)};
    if(!a.attempts.some(x=>x.id===att.id))a.attempts.push(att);
    if(pass&&!a.cert){a.cert={ref:'FT'+(S.certSeq++),at:Date.now(),version:S.course.version,status:'Valid'};audit(`Certificate ${a.cert.ref} issued`,'System');
      sendEmail(a.email,'Your Foresee certificate is ready',`<p>Congratulations ${esc(a.name)}. You passed ${esc(S.course.title)} with ${pct}%. Your certificate (ref ${a.cert.ref}) is ready to download.</p>`);
      sendEmail(S.school.contacts[0].email,`Certificate available: ${a.name}`,`<p>${esc(a.name)} has passed ${esc(S.course.title)} (${pct}%). Their certificate is now on your dashboard.</p>`,{type:'go',role:'school',view:'certs',label:'View certificates'})}
    else sendEmail(a.email,'Your assessment result',`<p>Hello ${esc(a.name)}, you scored ${pct}%. ${pass?'You passed.':'You have not yet reached the pass mark. Review the suggested modules and try again.'}</p>`);
    audit(`Assessment attempt: ${score}/${qs.length} (${pass?'pass':'not yet passed'})`,a.name);
    save();go('result',{att:att.id});ASM=null;
  });
}

function noteEditor(l,n,t){
  const isNew=!n;n=n||{id:'n'+uid(),t:t||0,title:'',body:'',style:'panel',essential:false};
  const m=modal(isNew?'Add interactive note':'Edit note',`<form id="ne" class="stack"><div class="form-grid"><div class="field"><label for="ne-t">Video time (mm:ss)</label><input type="text" id="ne-t" class="mono" value="${fmtT(n.t)}"></div><div class="field"><label for="ne-style">Display style</label><select id="ne-style"><option value="panel">Side panel</option><option value="popup">Pop-up over the video</option><option value="card">Expandable card</option></select></div><div class="field full"><label for="ne-title">Title</label><input type="text" id="ne-title" value="${esc(n.title)}" placeholder="e.g. Explore: Responding to a Disclosure"></div><div class="field full"><label for="ne-body">Content</label><textarea id="ne-body" rows="7">${esc(n.body.replace(/<\/p>|<\/li>|<\/h4>/g,'\n').replace(/<[^>]+>/g,'').replace(/\n+/g,'\n').trim())}</textarea><span class="hint">Start a line with “- ” for a bullet point.</span></div></div><label class="checkbox"><input type="checkbox" id="ne-ess" ${n.essential?'checked':''}> Key note: learners must open it to complete the lesson</label><div class="row between">${isNew?'<span></span>':'<button type="button" class="btn btn-danger btn-sm" id="ne-del">Delete note</button>'}<button class="btn btn-primary" type="submit">Save draft</button></div></form>`);
  $('#ne-style',m).value=n.style||'panel';
  $('#ne',m).onsubmit=e=>{e.preventDefault();const mm=$('#ne-t').value.match(/^(\d{1,2}):(\d{2})$/);if(!mm){toast('Use mm:ss for the time, like 01:25.');return}const tt=+mm[1]*60+ +mm[2];if(tt>l.dur){toast('That time is after the end of the video.');return}if(!$('#ne-title').value.trim()){toast('Give the note a title.');return}
    const lines=$('#ne-body').value.split('\n').map(s=>s.trim()).filter(Boolean);let html='',inList=false;lines.forEach(s=>{if(s.startsWith('- ')){if(!inList){html+='<ul>';inList=true}html+='<li>'+esc(s.slice(2))+'</li>'}else{if(inList){html+='</ul>';inList=false}html+='<p>'+esc(s)+'</p>'}});if(inList)html+='</ul>';
    Object.assign(n,{t:tt,title:$('#ne-title').value.trim(),style:$('#ne-style').value,essential:$('#ne-ess').checked,body:html||'<p></p>'});
    if(isNew)l.notes.push(n);
    S.questions.filter(q=>q.note===n.id).forEach(q=>q.review=true);
    S.course.draft=true;audit(`${isNew?'Added':'Edited'} note “${n.title}” at ${fmtT(tt)} in ${l.title}`);save();closeModal();toast(isNew?'Note added to the draft.':'Note saved. Linked questions are flagged for review.');render()};
  const d=$('#ne-del',m);if(d)d.onclick=()=>{l.notes=l.notes.filter(x=>x.id!==n.id);S.questions.filter(q=>q.note===n.id).forEach(q=>q.review=true);S.course.draft=true;audit(`Deleted note “${n.title}”`);save();closeModal();render()};
}

ADMIN.questions=()=>{const notes={};allLessons().forEach(({l})=>l.notes.forEach(n=>notes[n.id]=n.title));const mi=id=>S.course.modules.findIndex(m=>m.id===id)+1;

function qEditor(q){
  const isNew=!q;q=q||{id:'q'+(S.questions.length+1),type:'A',m:'m1',t:'00:00',note:'',text:'',opts:['','','',''],ans:[0],fb:''};
  const noteOpts=allLessons().map(({m,l})=>l.notes.map(n=>`<option value="${n.id}" data-m="${m.id}" data-t="${fmtT(n.t)}" ${q.note===n.id?'selected':''}>${esc(m.title)} · ${fmtT(n.t)} · ${esc(n.title)}</option>`).join('')).join('');
  const m=modal(isNew?'New question':'Question '+q.id.toUpperCase(),`<form id="qe" class="stack"><div class="field"><label for="qe-text">Question</label><textarea id="qe-text" rows="2">${esc(q.text)}</textarea></div><div class="field"><label for="qe-type">Format</label><select id="qe-type"><option value="A">Single correct answer</option><option value="B">Multiple correct answers</option><option value="C">All of the above</option></select></div><div class="stack" style="gap:8px"><span class="small" style="font-weight:600">Answer options (tick the correct ones)</span>${q.opts.map((o,i)=>`<div class="row" style="flex-wrap:nowrap"><input type="checkbox" class="qe-ck" data-i="${i}" ${q.ans.includes(i)?'checked':''} aria-label="Option ${'ABCD'[i]} is correct" style="accent-color:var(--teal);width:18px;height:18px"><span class="mono">${'ABCD'[i]}</span><input type="text" class="qe-opt" data-i="${i}" value="${esc(o)}" aria-label="Option ${'ABCD'[i]}"></div>`).join('')}</div><div class="field"><label for="qe-note">Taught in (module, video time and note)</label><select id="qe-note"><option value="">Choose the note that teaches this</option>${noteOpts}</select><span class="hint">Questions must only test what the course teaches.</span></div><div class="field"><label for="qe-fb">Feedback after marking</label><input type="text" id="qe-fb" value="${esc(q.fb)}"></div><div id="qe-msg"></div><div class="row between"><div class="row">${isNew?'':`<button type="button" class="btn btn-ghost btn-sm" id="qe-arch">${q.archived?'Restore':'Archive'}</button>`}${q.review?'<button type="button" class="btn btn-ghost btn-sm" id="qe-ok">Mark as reviewed</button>':''}</div><button class="btn btn-primary" type="submit">Save question</button></div></form>`,{wide:true});
  $('#qe-type',m).value=q.type;
  $('#qe',m).onsubmit=e=>{e.preventDefault();const opts=$$('.qe-opt',m).map(x=>x.value.trim());const ans=$$('.qe-ck',m).filter(x=>x.checked).map(x=>+x.dataset.i);const type=$('#qe-type').value;const sel=$('#qe-note');const msg=$('#qe-msg');
    if(!$('#qe-text').value.trim()||opts.some(o=>!o)){msg.innerHTML='<div class="notice bad small">Fill in the question and all four options.</div>';return}
    if(!sel.value){msg.innerHTML='<div class="notice bad small">Link the question to the note that teaches it.</div>';return}
    if(type!=='B'&&ans.length!==1){msg.innerHTML='<div class="notice bad small">This format needs exactly one correct option.</div>';return}
    if(type==='B'&&ans.length<2){msg.innerHTML='<div class="notice bad small">Multiple-answer questions need at least two correct options.</div>';return}
    const o=sel.selectedOptions[0];Object.assign(q,{text:$('#qe-text').value.trim(),type,opts,ans,note:sel.value,m:o.dataset.m,t:o.dataset.t,fb:$('#qe-fb').value.trim(),review:false});
    if(isNew)S.questions.push(q);audit(`${isNew?'Created':'Edited'} question ${q.id.toUpperCase()}`);save();closeModal();render()};
  const ar=$('#qe-arch',m);if(ar)ar.onclick=()=>{q.archived=!q.archived;audit(`${q.archived?'Archived':'Restored'} question ${q.id.toUpperCase()}`);save();closeModal();render()};
  const ok=$('#qe-ok',m);if(ok)ok.onclick=()=>{q.review=false;audit(`Reviewed question ${q.id.toUpperCase()}`);save();closeModal();render()};
}

/* ---------- Live mode: the real server (Supabase). Only used when config.js has the project details. ---------- */
function liveReset(){
  S.school={id:null,name:'',address:'',postcode:'',phone:'',contacts:[],joinCode:'',verified:true};
  S.attendees=[];S.orders=[];S.subscription=null;S.audit=[];S.inbox=[];S.leads=[];S.session={role:'public',user:null};
  try{S.pending=JSON.parse(sessionStorage.getItem('ft_pending')||'null')}catch(e){S.pending=null}
}
// Put what the server sent into the page's data, keeping the person on the course they were looking at
function applySnap(r){
  if(!r)return;
  if(r.role==='school'||r.role==='learner'){
    S.school=Object.assign({contacts:[],joinCode:''},r.school||{});S.attendees=r.attendees||[];S.orders=r.orders||[];S.subscription=r.subscription||null;S.audit=r.audit||[];
    const keep=S.session.role===r.role&&S.attendees.some(a=>a.id===S.session.user);
    S.session={role:r.role,user:r.role==='learner'?(keep?S.session.user:r.user):null};
  }else{const was=S.session.role;liveReset();if(r.role==='admin'&&was!=='admin')toast('Signed in. Platform administration is done in Supabase for now.')}
}
const liveErr=e=>toast(esc((e&&e.message)||'Something went wrong. Please try again.'));
async function liveRefresh(){applySnap(await FT.call('account',{action:'bootstrap'}))}
function liveHome(){go(S.session.role==='school'?'school':S.session.role==='learner'?'learner':'home')}
function busyBtn(sel,on,label){const b=typeof sel==='string'?$(sel):sel;if(!b)return;if(on){b.dataset.label=b.textContent;b.disabled=true;b.textContent=label||'Please wait…'}else{b.disabled=false;if(b.dataset.label)b.textContent=b.dataset.label}}

async function liveBoot(hash){
  const qp=new URLSearchParams(location.search);
  if(qp.get('invite')){VIEW='activate';PARAMS={token:qp.get('invite')}}
  render();
  let session=null;try{session=(await FT.sb.auth.getSession()).data.session}catch(e){}
  if(session&&VIEW!=='activate'){
    try{await liveRefresh()}catch(e){liveErr(e)}
    const paid=qp.get('paid');
    if(paid){toast('Confirming your payment…');for(let i=0;i<10;i++){const o=S.orders.find(x=>x.ref===paid);if(o&&o.status==='Paid')break;await new Promise(r=>setTimeout(r,1500));try{await liveRefresh()}catch(e){}}go('order',{ref:paid})}
    else if(qp.get('cancelled')){toast('Payment cancelled. Nothing has been charged.');liveHome()}
    else if(hash&&VIEWS[hash]&&!PUBLIC_TOKENS.includes(hash))go(hash);
    else if(['home','login','register','verify'].includes(VIEW))liveHome();
    else render();
  }else if(!session&&hash&&VIEWS[hash]&&!PUBLIC_TOKENS.includes(hash)&&hash!=='activate')go('login',{msg:'Please sign in to continue.'});
  if(qp.toString())try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
  // If the session ends in another tab, show the public site
  FT.sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.session.role!=='public'){liveReset();go('home')}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')liveFlush()});
}

async function liveSignup(contact,school,pw){
  const btn=$('#reg button[type=submit]');busyBtn(btn,true,'Creating your account…');
  try{const {error}=await FT.sb.auth.signUp({email:contact.email,password:pw,options:{data:{name:contact.name}}});if(error)throw error}
  catch(e){busyBtn(btn,false);$('#r-email-e').textContent=/registered|exists/i.test(e.message||'')?'This email already has an account. Sign in instead.':(e.message||'We couldn’t create your account. Please try again.');return}
  S.pending={contact,school,places:PARAMS.places||30,cid:PARAMS.cid||'sgs',plan:PARAMS.plan||null,band:PARAMS.band||null,exp:Date.now()+3600e3,sends:1,tries:0,lockUntil:0};save();go('verify');
}
async function liveResend(){const p=S.pending;if(!p)return go('register');if(p.sends>=5){$('#vf-msg').innerHTML='<div class="notice warn">Too many codes requested. Please wait a few minutes.</div>';return}
  try{const {error}=await FT.sb.auth.resend({type:'signup',email:p.contact.email});if(error)throw error;p.sends++;p.exp=Date.now()+3600e3;save();toast('A new code is on its way.')}catch(e){liveErr(e)}}
async function liveVerify(code,m,boxes){const p=S.pending;const btn=$('#vf button[type=submit]');busyBtn(btn,true,'Checking…');
  try{const {error}=await FT.sb.auth.verifyOtp({email:p.contact.email,token:code,type:'signup'});if(error)throw error}
  catch(e){busyBtn(btn,false);m.innerHTML='<div class="notice bad">That code is not right or has expired. Check the latest email, or send a new code.</div>';boxes.forEach(b=>b.value='');boxes[0].focus();return}
  try{applySnap(await FT.call('account',{action:'register_school',school:p.school,contact:{name:p.contact.name,role:p.contact.role}}))}catch(e){busyBtn(btn,false);return liveErr(e)}
  S.pending=null;save();S.ui.cid=p.cid||'sgs';toast('Email verified. Your school account is ready.');
  if(p.plan)go('subscribe',{tier:p.plan,band:p.band||'m'});else go('basket',{places:p.places,cid:p.cid||'sgs'});
}
async function liveLogin(em,pw){const btn=$('#lf button[type=submit]');busyBtn(btn,true,'Signing in…');const msg=t=>{busyBtn(btn,false);$('#l-msg').innerHTML=`<div class="notice bad">${t}</div>`};
  try{const {error}=await FT.sb.auth.signInWithPassword({email:em,password:pw});if(error)return msg(/confirm/i.test(error.message)?'Please verify your email first: use the code we sent when you registered.':'The email or password is not right. Check them and try again.')}catch(e){return msg('We couldn’t reach the server. Check your connection and try again.')}
  try{await liveRefresh()}catch(e){return msg(esc(e.message))}
  if(S.session.role==='public'){await FT.sb.auth.signOut();return msg('This account isn’t linked to a school or course yet. If your school invited you, use the link in your invitation email.')}
  toast('Signed in.');liveHome();
}
function liveForgot(){
  const m=modal('Reset your password',`<form id="fp" class="stack"><p class="muted small">Enter your email. If it matches an account, we’ll send a six-digit reset code.</p><div class="field"><label for="fp-email">Email address</label><input type="email" id="fp-email" value="${esc(($('#l-email')||{}).value||'')}"></div><div id="fp-step2" hidden class="stack"><div class="field"><label for="fp-code">Six-digit code</label><input type="text" id="fp-code" inputmode="numeric" maxlength="6" class="mono" autocomplete="one-time-code"></div><div class="field"><label for="fp-pw">New password</label><input type="password" id="fp-pw" autocomplete="new-password"><span class="hint">At least 10 characters, with a number</span></div></div><div id="fp-msg"></div><button class="btn btn-primary" type="submit" id="fp-btn">Send reset code</button></form>`);
  let sent=false,em='';
  $('#fp',m).onsubmit=async e=>{e.preventDefault();const msg=(t,k)=>$('#fp-msg').innerHTML=`<div class="notice ${k||'bad'} small">${t}</div>`;
    if(!sent){em=$('#fp-email').value.trim().toLowerCase();if(!emailOk(em))return msg('Enter a valid email address.');busyBtn('#fp-btn',true,'Sending…');
      try{await FT.sb.auth.resetPasswordForEmail(em)}catch(e){}busyBtn('#fp-btn',false);sent=true;$('#fp-step2').hidden=false;$('#fp-btn').textContent='Set new password';msg('If that email is registered, a code is on its way. Check your spam folder too.','');return}
    const code=$('#fp-code').value.trim(),pw=$('#fp-pw').value;if(!/^\d{6}$/.test(code))return msg('Enter the six-digit code from the email.');if(pw.length<10||!/\d/.test(pw))return msg('Use at least 10 characters, including a number.');
    busyBtn('#fp-btn',true,'Saving…');
    try{let r=await FT.sb.auth.verifyOtp({email:em,token:code,type:'recovery'});if(r.error)throw r.error;r=await FT.sb.auth.updateUser({password:pw});if(r.error)throw r.error}catch(e){busyBtn('#fp-btn',false);return msg('That code is not right or has expired. Send a new one and try again.')}
    closeModal();toast('Password updated. You’re signed in.');try{await liveRefresh()}catch(e){}liveHome()};
}
async function liveLogout(){liveFlush();try{await FT.sb.auth.signOut()}catch(e){}liveReset();toast('Signed out.');go('home')}

    busyBtn('#act-btn',true,'Activating…');
    try{const r=await FT.call('public',{action:'activate',token:t,password:p});
      if(r.exists){busyBtn('#act-btn',false);$('#act-fields').hidden=true;$('#act-msg').innerHTML=`<div class="notice"><span>You already have a Foresee account with <b>${esc(r.email)}</b>. Sign in with your existing password and your new ${info.kind==='admin'?'school':'course'} will be there. <button type="button" class="btn-link" data-go="login">Sign in</button></span></div>`;bindCommon($('#act'));return}
      const s=await FT.sb.auth.signInWithPassword({email:r.email,password:p});if(s.error)throw s.error;await liveRefresh();
      try{history.replaceState(null,'',location.pathname)}catch(x){}toast('Account activated.');liveHome()}
    catch(x){busyBtn('#act-btn',false);bad(esc(x.message||'Please try again.'))}};
}
// Show which parent courses the school offers, once a join code is entered
let JI={code:'',info:null};
async function liveJoinInfo(){const inp=$('#j-code');if(!inp)return;const code=inp.value.trim().toUpperCase();if(code.length<6)return;
  const show=()=>{if(!JI.info)return;$('#j-msg').innerHTML=`<div class="notice ok small"><span>Code recognised: <b>${esc(JI.info.school)}</b></span></div>`;$$('.j-course').forEach(c=>{const on=JI.info.courses.includes(c.value);c.checked=on;c.closest('label').hidden=!on})};
  if(code===JI.code)return show();JI.code=code;
  try{JI.info=await FT.call('public',{action:'join_info',code});show()}
  catch(e){JI.info=null;$('#j-msg').innerHTML=`<div class="notice bad small"><span>${esc(e.message)}</span></div>`}}
async function liveJoin(code,name,em,pw,bad){
  const picked=$$('.j-course').filter(x=>x.checked).map(x=>x.value);const signedIn=S.session.role==='learner';
  if(!picked.length)return bad('Choose at least one course.');
  if(!signedIn){if(!name)return bad('Enter your name.');if(!emailOk(em))return bad('Enter a valid email address, like name@example.com.');if(pw.length<10||!/\d/.test(pw))return bad('Use a password of at least 10 characters, including a number.')}
  if(!$('#j-ok').checked)return bad('Please agree to the terms to continue.');
  const btn=$('#jf button[type=submit]');busyBtn(btn,true,'Joining…');
  try{const r=await FT.call('public',{action:'join',code,courses:picked,name,email:em,password:pw});
    if(!signedIn){const s=await FT.sb.auth.signInWithPassword({email:r.email,password:pw});if(s.error)throw s.error}
    await liveRefresh();toast('Welcome. You can start the first lesson now.');go('learner')}
  catch(e){busyBtn(btn,false);bad(esc(e.message)+(e.code==='exists'||e.code==='joined'?' <button type="button" class="btn-link" data-go="login">Sign in</button>':''))}
}

// Buying: card payments go to Stripe's secure page; invoices are emailed by Stripe
async function liveCheckout(o){
  toast(o.method==='Invoice'?'Creating your invoice…':'Opening secure payment…');
  try{const r=await FT.call('billing',{action:'checkout',...o});if(r.url){location.href=r.url;return}applySnap({role:'school',...r.snapshot});go('order',{ref:r.ref})}catch(e){liveErr(e)}
}
async function liveAuto(on){try{const r=await FT.call('billing',{action:'auto_renew',on});applySnap({role:'school',...r.snapshot});toast(on?'Automatic renewal is on.':'Automatic renewal is off. Your plan stays active until its end date.');render()}catch(e){liveErr(e)}}
function liveUpgrade(){const x=S.subscription;confirmBox('Upgrade to Complete?',`You’ll pay the difference for the rest of this year now (Stripe works it out to the day). From ${fmtD(x.end)} the yearly price is ${money(planPrice('complete',x.band))}.`,'Upgrade',async()=>{try{const r=await FT.call('billing',{action:'upgrade'});applySnap({role:'school',...r.snapshot});toast('Your plan is now Complete.');go('plan')}catch(e){liveErr(e)}})}
async function livePortal(){toast('Opening your billing page…');try{const r=await FT.call('billing',{action:'portal'});location.href=r.url}catch(e){liveErr(e)}}
function liveAsk(what){toast(`To ${what}, email ${esc((window.FT_CONFIG||{}).supportEmail||'support@foreseetraining.com')} and we’ll do it for you.`)}

// School administration
async function liveInvite(course,people){
  try{const r=await FT.call('staff',{action:'invite',course,people});applySnap(r);DRAFT=[];toast(`${people.length} invitation${people.length>1?'s':''} sent.`);render()}
  catch(e){if(e.code==='places'){toast(esc(e.message));go('basket',{cid:course,places:people.length})}else liveErr(e)}
}
// Call a server function; school snapshots and learner records come back and are applied
async function liveCall(fn,body,msg,quiet){
  try{const r=await FT.call(fn,body);
    if(r&&r.attendee){const a=S.attendees.find(y=>y.id===r.attendee.id);if(a)Object.assign(a,{attempts:r.attendee.attempts,cert:r.attendee.cert,conf:r.attendee.conf,quiz:r.attendee.quiz})}
    else if(r&&r.role)applySnap(r);
    if(quiet)return r;closeModal();if(msg)toast(msg);render();return r}
  catch(e){liveErr(e)}
}

// Learning: progress is saved every 15 seconds while watching, and straight away when something important happens
const LQ={};
function liveProgress(a,lid,now){if(!LIVE||!a)return;const k=a.id+'|'+lid;const q=LQ[k]||(LQ[k]={a,lid,t:null,last:0});
  clearTimeout(q.t);const wait=now?400:Math.max(0,15000-(Date.now()-q.last));q.t=setTimeout(()=>liveSend(q),wait)}
async function liveSend(q){q.t=null;q.last=Date.now();const p=q.a.progress[q.lid];if(!p)return;
  try{const r=await FT.call('learn',{action:'progress',attendee:q.a.id,lesson:q.lid,data:{w:p.w,pos:p.pos,notes:p.notes,done:!!p.done,textDone:!!p.textDone,checks:p.checks||{}}});
    const sp=r.attendee.progress[q.lid];if(sp){p.done=!!sp.done;if(sp.at)p.at=sp.at;if(sp.via)p.via=sp.via;if(sp.checks)p.checks=sp.checks}
    if(r.attendee.cert&&!q.a.cert){q.a.cert=r.attendee.cert;toast('Course complete. Your certificate is ready.');if(VIEW==='learner')render()}}
  catch(e){q.last=0;if(e.status!==404)toast('We couldn’t save your progress just now. We’ll try again.');q.t=setTimeout(()=>liveSend(q),20000)}}
function liveFlush(){Object.values(LQ).forEach(q=>{if(q.t){clearTimeout(q.t);liveSend(q)}})}
async function liveAssess(a){const id=ASM.id;
  try{const r=await FT.call('learn',{action:'assess',attendee:a.id,answers:ASM.ans,attemptId:id});Object.assign(a,{attempts:r.attendee.attempts,cert:r.attendee.cert});ASM=null;go('result',{att:id})}
  catch(e){ASM.submitted=false;liveErr(e)}}

// Public forms
async function liveLead(em,r,draw){try{await FT.call('public',{action:'lead',email:em,staff:CHK.staff,score:r.score,tier:r.tier,band:r.band});CHK.sent=em;draw();toast('Plan sent. Check your inbox.')}catch(e){$('#chk-err').textContent=e.message}}
async function liveContact(){const o=$('#ct-out'),btn=$('#contact-form button[type=submit]');busyBtn(btn,true,'Sending…');
  try{await FT.call('public',{action:'contact',name:$('#ct-name').value,email:$('#ct-email').value,message:$('#ct-msg').value});o.innerHTML='<div class="notice ok">Thanks. Your message has been sent. We usually reply within one working day.</div>';$('#contact-form').reset()}
  catch(e){o.innerHTML=`<div class="notice bad">${esc(e.message)}</div>`}busyBtn(btn,false)}
async function liveVerifyCert(ref){const o=$('#vc-out');o.innerHTML='<p class="small muted">Checking…</p>';
  try{const r=await FT.call('public',{action:'verify',ref});
    if(!r.found){o.innerHTML='<div class="notice bad">We couldn’t find a certificate with that reference. Check it and try again.</div>';return}
    o.innerHTML=`<div class="notice ${r.status==='Valid'?'ok':'bad'}"><div class="stack" style="gap:4px"><b>${r.status==='Valid'?'This certificate is valid.':'This certificate has been '+esc(r.status.toLowerCase())+'.'}</b><span>${esc(r.shown)} completed ${esc(r.course)} (version ${esc(r.version)}) on ${fmtD(r.at)}.</span><span class="small">Only the information needed to confirm the certificate is shown.</span></div></div>`}
  catch(e){o.innerHTML=`<div class="notice bad">${esc(e.message)}</div>`}}

/* ---------- boot ---------- */
const h=(location.hash||'').replace('#','');
if(h&&VIEWS[h]&&PUBLIC_TOKENS.includes(h))VIEW=h;
else if(/^course-[a-z]+$/.test(h)&&S.courses[h.slice(7)]){VIEW='course';PARAMS={id:h.slice(7)}}
{const j=new URLSearchParams(location.search).get('join');if(j){VIEW='join';PARAMS={code:j.toUpperCase()}}}
if(LIVE)liveBoot(h);else render();
})();
</script>
