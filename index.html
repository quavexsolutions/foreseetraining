you, and that the problem can be sorted out."],[11.78,"Stay calm and listen to your child."],[14.31,"Save evidence of messages, such as screenshots, but never save or share nude images."],[20.37,"Report and block the person on the app or game."],[23.77,"And let the school’s Designated Safeguarding Lead know, because they can help and may know of other children affected."],[32.64,"One growing threat is sextortion, where a child is tricked into sharing an image and then threatened for money."],[41.17,"Reports to the Internet Watch Foundation rose by 72% in early 2025, and 97% involved boys."],[48.09,"If it happens, don’t pay, stop replying, keep the evidence and get help straight away."],[55.05,"If a nude or semi-nude image of your child has been shared, don’t look at it, save it or forward it, even to report it."],[63.27,"Report Remove, from Childline and the Internet Watch Foundation, helps under-18s get images of themselves taken down."],[71.35,"Make sure your child knows they are not in trouble."],[75.23,"If a child is in immediate danger, call 999."],[78.96,"Report online sexual abuse or grooming to CEOP."],[82.94,"Use Report Remove for a nude image of someone under 18."],[87.6,"And the NSPCC helpline gives confidential advice to adults on 0808 800 5000."],[94.39,"You don’t have to handle it alone."],[96.48,"Ask for help early."],[97.65,"Thank you for taking the time to complete this course."]],"segs":[{"t":0.0,"d":11.43,"a":"pl4_0"},{"t":11.78,"d":20.51,"a":"pl4_1"},{"t":32.64,"d":22.06,"a":"pl4_2"},{"t":55.05,"d":19.83,"a":"pl4_3"},{"t":75.23,"d":18.81,"a":"pl4_4"},{"t":94.39,"d":6.58,"a":"pl4_5"}],"sources":[["Internet Watch Foundation, Child sexual extortion cases in the UK soar (2025)","https://www.iwf.org.uk/news-media/news/child-sexual-extortion-cases-in-the-uk-soar-with-warnings-ruthless-criminals-are-still-putting-children-and-young-people-at-risk"],["UKCIS, Sharing nudes and semi-nudes: advice for education settings (2024)","https://www.gov.uk/government/publications/sharing-nudes-and-semi-nudes-advice-for-education-settings-working-with-children-and-young-people"]],"nt":{"pd3":34.1,"pd1":56.5,"pd2":76.7}},"bl1":{"dur":126,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 1 · Foundations","title":"Good behaviour is taught, not assumed","ph":"pbs-1"},{"t":11.95,"layout":"stat","kicker":"Why it matters","title":"of every 30 minutes of lesson time are lost to misbehaviour, teachers report","stat":"7 min","src":"DfE, National Behaviour Survey 2024/25","pct":23},{"t":28.59,"layout":"chart","kicker":"Suspensions","title":"Most common reasons recorded for suspension, 2023/24","src":"DfE, 2025","bars":[["Persistent disruptive behaviour",51,"51%"],["Verbal abuse or threats against an adult",16,"16%"],["Physical assault against a pupil",13,"13%"]],"max":60},{"t":49.5,"layout":"list","kicker":"Behaviour is communication","title":"Behind the behaviour","items":["Tired, hungry or anxious","Struggling with the work","Wanting attention or connection","Unmet needs at home or school"],"icons":["moon","book","heart","home"]},{"t":71.94,"layout":"grid","kicker":"What works","title":"A positive culture","items":["<b>Relationships</b>Pupils behave for adults they trust","<b>Expectations</b>High and clearly explained","<b>Consistency</b>Everyone applies the policy","<b>Calm</b>Adults model the behaviour they want"],"icons":["heart","target","refresh","sun"],"ph":"pbs-1b","art":"quad","ask":{"q":"According to the EEF guidance, pupils behave best for adults they…","opts":["Fear","Trust","Rarely see"],"a":1,"why":"Pupils behave best for adults they trust, so every pupil needs a supportive relationship with a member of staff."}},{"layout":"stat","art":"duo","kicker":"Safety and belonging","title":"Pupils feeling safe and belonging, May 2025","duo":[["80%","of pupils in years 7 to 13 felt safe at school every day or most days (73% in 2024)",80],["69%","felt they belonged at their school (57% in 2024)",69]],"src":"DfE, National Behaviour Survey 2024/25","t":95.33},{"t":121.19,"layout":"quote","kicker":"Key principle","title":"Firm, fair and kind.","items":["Every day is a fresh start."]}],"captions":[[0.0,"Good behaviour is taught, not assumed."],[2.4,"This module sets out the ideas behind positive behaviour management, and why calm, consistent classrooms are good for every pupil and every adult."],[11.95,"Behaviour has a direct effect on learning."],[14.33,"In the Department for Education’s National Behaviour Survey, teachers reported losing an average of seven minutes in every thirty minutes of lesson time to misbehaviour."],[23.89,"Across a school year, that adds up to weeks of lost learning for every class."],[28.59,"Most serious sanctions start with everyday low-level disruption."],[33.23,"In 2023 to 2024 there were around 955,000 suspensions in England, and persistent disruptive behaviour was the most common reason, given in 51% of cases."],[44.23,"Getting everyday behaviour right helps keep pupils in the classroom."],[49.5,"Behaviour is a form of communication."],[51.71,"It often tells us something a child cannot put into words."],[55.17,"A pupil may be tired, hungry or anxious, or struggling with work that feels too hard."],[60.25,"They may want attention or connection, or have needs that are not being met at home or in school."],[66.04,"Understanding the reason does not mean excusing the behaviour, but it helps you respond well."],[71.94,"The Education Endowment Foundation’s guidance on behaviour starts with knowing your pupils well, and making sure every pupil has a supportive relationship with a member of staff."],[82.3,"Pupils behave best for adults they trust."],[84.68,"Expectations should be high and clearly explained, everyone should apply the school’s behaviour policy consistently, and adults should model the calm behaviour they want to see."],[95.33,"Culture makes a measurable difference."],[98.14,"In the Department for Education’s National Behaviour Survey in May 2025, 80% of pupils in years 7 to 13 said they felt safe at school every day or most days, up from 73% a year earlier."],[111.82,"And 69% said they felt they belonged, up from 57%."],[115.52,"Relationships and belonging are part of behaviour, not separate from it."],[121.19,"Be firm, fair and kind, and give every pupil a fresh start each day."]],"segs":[{"t":0.0,"d":11.6,"a":"bl1_0"},{"t":11.95,"d":16.29,"a":"bl1_1"},{"t":28.59,"d":20.56,"a":"bl1_2"},{"t":49.5,"d":22.09,"a":"bl1_3"},{"t":71.94,"d":23.04,"a":"bl1_4"},{"t":95.33,"d":25.51,"a":"bl1_d"},{"t":121.19,"d":4.36,"a":"bl1_5"}],"sources":[["Department for Education, National behaviour survey: academic year 2024 to 2025","https://assets.publishing.service.gov.uk/media/691dd17a513046b952c50093/National_behaviour_suvery_report_2024_to_2025.pdf"],["Education Endowment Foundation, Improving Behaviour in Schools guidance report","https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/behaviour"],["Department for Education, Suspensions and permanent exclusions in England, 2023/24","https://explore-education-statistics.service.gov.uk/find-statistics/suspensions-and-permanent-exclusions-in-england/2023-24"],["Department for Education, National behaviour survey: academic year 2024 to 2025","https://www.gov.uk/government/publications/national-behaviour-survey-report-2024-to-2025-academic-year"]],"nt":{"b1a":51.0,"b1b":73.5,"b1c":77.5}},"bl2":{"dur":88,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 2 · Routines and Expectations","title":"Routines free up time for learning","ph":"pbs-2"},{"t":11.41,"layout":"list","kicker":"Teach it","title":"Four steps to a routine","items":["Explain what and why","Model it yourself","Practise it together","Praise and reinforce it"],"icons":["chat","eye","refresh","star"],"art":"cycle","hub":"Routine","ask":{"q":"What comes straight after explaining a routine?","opts":["Praising it","Modelling it yourself","Sanctioning mistakes"],"a":1,"why":"Explain, model, practise, then praise."}},{"t":28.94,"layout":"list","kicker":"Key routines","title":"Routines worth teaching","items":["Entering and leaving the room","Getting everyone’s attention","Moving between activities","Asking for help"],"icons":["school","bell","arrow","hand"],"ph":"pbs-2b"},{"layout":"chart","kicker":"Different views","title":"Said the school had been calm and orderly every day or most days","max":100,"bars":[["School leaders",88,"88%"],["Teachers",63,"63%"],["Pupils, years 7 to 13",57,"57%"]],"src":"DfE, National Behaviour Survey, May 2025","t":45.27},{"t":68.12,"layout":"explain","kicker":"Consistency","title":"Use the same words every time","text":"Shared language across the school makes expectations clear wherever a pupil is."},{"t":81.73,"layout":"quote","kicker":"Key principle","title":"Same words. Same routine. Every time.","items":["Consistency makes it easy to succeed."]}],"captions":[[0.0,"Routines reduce uncertainty, and they free up time for learning."],[3.78,"When pupils know exactly what to do and when, there is less room for confusion, and less need for you to correct behaviour."],[11.41,"Teach routines in the same way as any other content."],[14.59,"First, explain what you want and why it matters."],[17.52,"Then model it yourself, so pupils can see exactly what it looks like."],[21.74,"Practise it together, more than once, and then praise pupils who get it right, so the routine becomes automatic."],[28.94,"Routines worth teaching include how pupils enter and leave the room, how you get everyone’s attention, how they move between activities, and how they ask for help."],[38.62,"Greeting pupils at the door as they arrive is a simple routine that sets a calm tone for the whole lesson."],[45.27,"Leaders and classrooms do not always see the same picture."],[49.43,"In May 2025, 88% of school leaders said their school had been calm and orderly every day or most days in the past week, compared with 63% of teachers and 57% of pupils."],[61.46,"Shared routines, applied by every adult, are how a calm school becomes a calm classroom."],[68.12,"Use the same words and the same signals every time."],[71.19,"When every adult in the school uses shared language for routines and expectations, pupils know exactly what is meant, whichever room they are in and whoever is teaching."],[81.73,"Same words, same routine, every time."],[84.13,"Consistency makes it easy for pupils to succeed."]],"segs":[{"t":0.0,"d":11.06,"a":"bl2_0"},{"t":11.41,"d":17.18,"a":"bl2_1"},{"t":28.94,"d":15.98,"a":"bl2_2"},{"t":45.27,"d":22.5,"a":"bl2_d"},{"t":68.12,"d":13.26,"a":"bl2_3"},{"t":81.73,"d":5.51,"a":"bl2_4"}],"sources":[["Education Endowment Foundation, Improving Behaviour in Schools guidance report","https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/behaviour"],["Department for Education, National behaviour survey: academic year 2024 to 2025","https://www.gov.uk/government/publications/national-behaviour-survey-report-2024-to-2025-academic-year"]],"nt":{"b2a":12.9,"b2c":30.4,"b2b":69.6}},"bl3":{"dur":67,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 3 · Praise and Recognition","title":"Catch them getting it right","ph":"pbs-3"},{"t":9.34,"layout":"stat","kicker":"The research","title":"classrooms studied: the more teachers praised than reprimanded, the more pupils stayed on task","stat":"151","src":"Caldarella et al., 2020"},{"t":29.75,"layout":"list","kicker":"Effective praise","title":"Praise that works","items":["Specific: say exactly what they did","Sincere: mean it","Proportionate: match the effort","Often: far more than corrections"],"icons":["target","heart","layers","star"],"art":"checklist","ask":{"q":"Why can over-the-top praise for small things backfire?","opts":["It loses its value","It is against school policy","Pupils can’t hear it"],"a":0,"why":"Praise should be proportionate: over-the-top praise for small things loses its value."}},{"t":46.05,"layout":"callout","kicker":"Public or private?","title":"Know your pupils","items":["Some pupils love public praise","Others prefer a quiet word or a note home","Recognise effort, not just results"],"ph":"pbs-3b"},{"t":62.72,"layout":"quote","kicker":"Key principle","title":"What you notice, you get more of.","items":["Notice the good."]}],"captions":[[0.0,"Catching pupils getting it right is one of the most powerful tools you have."],[4.35,"This module looks at what the research says about praise, and how to use it well."],[9.34,"A study of 151 primary classrooms across 19 schools, published in 2020, found a clear pattern."],[15.78,"The higher a teacher’s ratio of praise to reprimands, the more time pupils spent on task."],[21.87,"Noticing and naming good behaviour changes the behaviour of the whole class, not just the pupil being praised."],[29.75,"Good praise is specific, so say exactly what the pupil did."],[33.5,"It is sincere, and it matches the effort involved, because over-the-top praise for small things loses its value."],[40.61,"And aim for far more positive interactions than corrections across every lesson."],[46.05,"Some pupils love public praise, while others find it embarrassing, especially older pupils."],[51.92,"A quiet word, a positive note or a call home may work much better."],[56.18,"Recognise effort and improvement, not only results, so that every pupil has a chance to succeed."],[62.72,"What you notice, you get more of."],[64.83,"So notice the good."]],"segs":[{"t":0.0,"d":8.99,"a":"bl3_0"},{"t":9.34,"d":20.06,"a":"bl3_1"},{"t":29.75,"d":15.95,"a":"bl3_2"},{"t":46.05,"d":16.32,"a":"bl3_3"},{"t":62.72,"d":3.32,"a":"bl3_4"}],"sources":[["Caldarella et al. (2020), Effects of teachers’ praise-to-reprimand ratios on elementary students’ on-task behaviour, Educational Psychology","https://www.tandfonline.com/doi/abs/10.1080/01443410.2020.1711872"],["Education Endowment Foundation, Improving Behaviour in Schools guidance report","https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/behaviour"]],"nt":{"b3c":10.8,"b3a":31.2,"b3b":47.5}},"bl4":{"dur":71,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 4 · Low-level Disruption","title":"Small steps first","ph":"pbs-4"},{"t":11.35,"layout":"list","kicker":"Least intrusive first","title":"A step-by-step approach","items":["A look or a non-verbal cue","Moving closer","A quiet, private reminder","A clear choice and consequence"],"icons":["eye","users","chat","target"],"art":"stairs","ask":{"q":"Which step comes before giving a clear choice and consequence?","opts":["Sending the pupil out","A quiet, private reminder","Calling home"],"a":1,"why":"A look, moving closer, a quiet private reminder, and only then a clear choice and consequence."}},{"t":30.03,"layout":"list","kicker":"Avoid","title":"What makes it worse","items":["Public arguments","Sarcasm or shouting","Bringing up past behaviour","Consequences you can’t follow through"],"cls":"l-avoid","icons":["users","alert","clock","lock"],"art":"avoid"},{"t":43.34,"layout":"explain","kicker":"Take-up time","title":"Give them a moment","text":"Give the instruction, then walk away and let the pupil make the right choice.","ph":"pbs-4b"},{"t":54.53,"layout":"callout","kicker":"Afterwards","title":"Follow up and repair","items":["Speak privately once things are calm","Focus on what happens next time","Make a fresh start"],"art":"process","icons":["chat","target","refresh"]},{"t":67.45,"layout":"quote","kicker":"Key principle","title":"Deal with it, then move on.","items":["Protect the learning."]}],"captions":[[0.0,"Most behaviour you deal with will be low-level disruption, such as chatting, calling out or not starting work."],[6.65,"Handled well, it takes seconds."],[8.52,"Handled badly, it can take over a lesson."],[11.35,"Start with the least intrusive step."],[13.69,"A look or a non-verbal cue is often enough."],[16.49,"Moving closer to the pupil can settle things without a word."],[20.39,"If needed, give a quiet, private reminder of what you expect."],[24.36,"Only then give a clear choice and the consequence, following your school’s policy."],[30.03,"Some responses make things worse."],[31.9,"Avoid public arguments, sarcasm and shouting, which give pupils an audience and something to push against."],[37.93,"Don’t bring up past behaviour, and never threaten a consequence you can’t follow through."],[43.34,"After you give an instruction, give take-up time."],[46.23,"Walk away and let the pupil make the right choice without feeling watched."],[50.59,"This lets them save face, and it is often all that is needed."],[54.53,"Afterwards, speak to the pupil privately once things are calm."],[58.37,"A short restorative conversation focuses on what happened, who was affected and what will happen next time."],[64.99,"Then make a genuinely fresh start."],[67.45,"Deal with it, then move on, and protect the learning for everyone."]],"segs":[{"t":0.0,"d":11.0,"a":"bl4_0"},{"t":11.35,"d":18.33,"a":"bl4_1"},{"t":30.03,"d":12.96,"a":"bl4_2"},{"t":43.34,"d":10.84,"a":"bl4_3"},{"t":54.53,"d":12.57,"a":"bl4_4"},{"t":67.45,"d":3.25,"a":"bl4_5"}],"sources":[["Education Endowment Foundation, Improving Behaviour in Schools guidance report","https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/behaviour"]],"nt":{"b4a":12.8,"b4b":44.8,"b4c":56.0}},"bl5":{"dur":109,"scenes":[{"t":0.0,"layout":"title","kicker":"Module 5 · De-escalation and Wider Needs","title":"When things escalate","ph":"pbs-5"},{"t":9.55,"layout":"list","kicker":"De-escalation","title":"Calm the situation","items":["Stay calm and lower your voice","Give space and reduce the audience","Use the pupil’s name and acknowledge feelings","Offer a simple choice or a way out"],"icons":["ear","users","heart","go"],"art":"process","ask":{"q":"Why reduce the audience when a pupil is escalating?","opts":["So they can calm down without losing face","To save time","So nobody can help"],"a":0,"why":"Fewer onlookers makes it easier for the pupil to calm down without losing face."}},{"t":26.55,"layout":"stat","kicker":"Wider needs","title":"children aged 8 to 16 had a probable mental disorder in 2023","stat":"1 in 5","src":"NHS England, 2023","pct":20},{"layout":"stat","art":"duo","kicker":"Needs behind behaviour","title":"Around one in five pupils has special educational needs","duo":[["1.8m","pupils in England have special educational needs",21],["6%","have an education, health and care plan, and 14.8% get SEN support",6]],"src":"DfE, Special educational needs in England, 2026","t":45.6},{"t":69.25,"layout":"callout","kicker":"Look deeper","title":"Behaviour can signal a need","items":["Special educational needs or disability","Trauma or difficulties at home","A safeguarding concern"],"ph":"pbs-5b"},{"t":85.54,"layout":"list","kicker":"Afterwards","title":"Record and share","items":["Record what happened, factually","Tell the SENCo if needs may be unmet","Tell the DSL if you have a safeguarding worry"],"icons":["doc","support","shield"],"art":"process"},{"t":103.46,"layout":"quote","kicker":"Key principle","title":"Calm is contagious.","items":["So is panic."]}],"captions":[[0.0,"Sometimes behaviour escalates."],[1.67,"In those moments, your calm response can bring it back down, and what you notice afterwards can help a child get the support they need."],[9.55,"Stay calm, and lower your voice and your body language."],[12.92,"Give the pupil space and, if you can, reduce the audience by moving other pupils away."],[18.19,"Use their name and acknowledge how they feel."],[20.94,"Then offer a simple choice, or a way out that lets them calm down without losing face."],[26.55,"Behaviour can be a sign of an unmet need."],[29.45,"NHS England found that in 2023, 20.3% of children aged 8 to 16 had a probable mental disorder, around five or six pupils in a class of thirty."],[39.51,"Many more have special educational needs or are living with difficulties at home."],[45.6,"Many pupils need extra support to manage."],[48.5,"In 2026, over 1.8 million pupils in England had special educational needs, around one in five."],[55.16,"Six per cent had an education, health and care plan, and 14.8% received SEN support."],[61.11,"Knowing which pupils have identified needs, and the adjustments they need, is part of managing behaviour well."],[69.25,"Behaviour may be linked to special educational needs or disability, which may need reasonable adjustments."],[75.63,"It may reflect trauma or difficulties at home."],[78.4,"A sudden change in a child’s behaviour can also be a sign of a safeguarding concern, and should always be shared."],[85.54,"Afterwards, record what happened factually."],[88.21,"Tell the SENCo if a pupil’s needs may not be met, and tell the DSL if you have a safeguarding worry."],[94.41,"Any use of reasonable force or restrictive intervention must follow the 2026 guidance and your school’s policy, and must always be recorded."],[103.46,"Remember: calm is contagious."],[105.27,"So is panic."],[106.03,"Thank you for completing this course."]],"segs":[{"t":0.0,"d":9.2,"a":"bl5_0"},{"t":9.55,"d":16.65,"a":"bl5_1"},{"t":26.55,"d":18.7,"a":"bl5_2"},{"t":45.6,"d":23.3,"a":"bl5_d"},{"t":69.25,"d":15.94,"a":"bl5_3"},{"t":85.54,"d":17.57,"a":"bl5_4"},{"t":103.46,"d":4.89,"a":"bl5_5"}],"sources":[["NHS England, Mental Health of Children and Young People in England, 2023: wave 4","https://digital.nhs.uk/data-and-information/publications/statistical/mental-health-of-children-and-young-people-in-england/2023-wave-4-follow-up"],["Department for Education, Use of reasonable force and restrictive interventions in schools (2026)","https://www.gov.uk/government/publications/use-of-reasonable-force-in-schools"],["Department for Education, Keeping children safe in education 2026","https://www.gov.uk/government/publications/keeping-children-safe-in-education--2"],["Department for Education, Special educational needs in England, 2025/26","https://explore-education-statistics.service.gov.uk/find-statistics/special-educational-needs-in-england/2025-26"]],"nt":{"b5a":11.1,"b5b":70.7,"b5c":87.0}},"ql1":{"dur":85,"scenes":[{"t":0.0,"layout":"title","kicker":"Lesson 1 · Understanding Behaviour","title":"All behaviour has a reason","ph":"pbp-1"},{"t":12.54,"layout":"list","kicker":"Common reasons","title":"What might be going on","items":["Tired or hungry","Worried, frustrated or bored","Wanting your attention","Finding something hard to say"],"icons":["moon","alert","heart","chat"]},{"t":29.43,"layout":"callout","kicker":"Age and stage","title":"Expect what fits their age","items":["Toddlers test limits","Young children are still learning to wait","Teenagers want more independence"],"ph":"pbp-1b","art":"timeline","ask":{"q":"Toddlers testing limits is…","opts":["A sign of bad parenting","Part of how they learn about the world","Very rare"],"a":1,"why":"Toddlers test limits as they learn about the world. Expect what fits your child’s age."}},{"t":44.18,"layout":"stat","kicker":"Feelings matter","title":"children aged 8 to 16 in England had a probable mental health difficulty in 2023","stat":"1 in 5","src":"NHS England, 2023","pct":20},{"t":65.5,"layout":"explain","kicker":"Look after yourself","title":"You matter too","text":"Tired, stressed parents find it harder to stay calm. Asking for support is part of good parenting."},{"t":78.07,"layout":"quote","kicker":"Key idea","title":"Look for patterns, not blame.","items":["When does it happen? What helps?"]}],"captions":[[0.0,"All behaviour has a reason, even when it is hard to see."],[3.79,"In this lesson we look at what might be behind your child’s behaviour, and what you can reasonably expect at different ages."],[12.54,"Children often act up when they are tired or hungry, or when they feel worried, frustrated or bored."],[18.35,"Sometimes they want your attention, and negative attention can feel better than none."],[23.28,"And sometimes they are struggling to put a feeling into words, so it comes out as behaviour instead."],[29.43,"It helps to expect what fits your child’s age."],[31.98,"Toddlers test limits as they learn about the world."],[34.82,"Young children are still learning to wait, to share and to manage big feelings."],[39.21,"Teenagers naturally want more independence, and pushing back is part of growing up."],[44.18,"Sometimes behaviour is a sign that a child is struggling inside."],[49.21,"NHS England found that one in five children aged 8 to 16 had a probable mental health difficulty in 2023."],[57.45,"If you notice lasting changes in mood, sleep or behaviour, talk to your child’s school or your GP."],[65.5,"Parenting is hard work, and tired, stressed parents find it much harder to stay calm."],[70.8,"Looking after your own sleep, health and support network is not selfish."],[75.29,"It is part of looking after your child."],[78.07,"Look for patterns rather than blame."],[80.56,"When does it happen?"],[81.95,"What helps?"],[82.72,"And what makes it worse?"]],"segs":[{"t":0.0,"d":12.19,"a":"ql1_0"},{"t":12.54,"d":16.54,"a":"ql1_1"},{"t":29.43,"d":14.4,"a":"ql1_2"},{"t":44.18,"d":20.97,"a":"ql1_3"},{"t":65.5,"d":12.22,"a":"ql1_4"},{"t":78.07,"d":6.32,"a":"ql1_5"}],"sources":[["NHS England, Mental Health of Children and Young People in England, 2023: wave 4","https://digital.nhs.uk/data-and-information/publications/statistical/mental-health-of-children-and-young-people-in-england/2023-wave-4-follow-up"]],"nt":{"qa1":14.0,"qa2":30.9,"qa3":67.0}},"ql2":{"dur":94,"scenes":[{"t":0.0,"layout":"title","kicker":"Lesson 2 · Routines and Boundaries","title":"Predictable feels safe","ph":"pbp-2"},{"t":9.6,"layout":"list","kicker":"Routines","title":"Routines that help","items":["Mornings and getting ready for school","Mealtimes","Screens off before bed","A regular bedtime"],"icons":["sun","food","phone","moon"],"art":"timeline"},{"t":33.76,"layout":"list","kicker":"Family rules","title":"A few clear rules","items":["Keep them few and simple","Say what to do: “Walk inside”","Agree them together","All adults stick to them"],"icons":["check","chat","family","users"],"ph":"pbp-2b","art":"checklist","ask":{"q":"Who needs to stick to the family rules?","opts":["Only the children","All the adults in the house too","Only the youngest child"],"a":1,"why":"Rules work when all the adults in the house stick to them."}},{"t":46.97,"layout":"stat","kicker":"The research","title":"studies of the Triple P parenting programme found positive effects on children’s behaviour","stat":"101","src":"Sanders et al., 2014"},{"layout":"stat","kicker":"Sleep and behaviour","stat":"9 to 12 hrs","title":"of sleep a night for children aged 6 to 13, and 8 to 10 hours for teenagers","src":"NHS paediatric sleep service","t":66.64},{"t":89.99,"layout":"quote","kicker":"Key idea","title":"Say what you mean, and follow through.","items":["Calmly, every time."]}],"captions":[[0.0,"Children feel safer when life is predictable."],[2.76,"Clear routines and a few simple family rules reduce arguments, because everyone knows what is coming next."],[9.6,"Routines help most at the busiest times of day: mornings and getting ready for school, mealtimes, and the hour before bed."],[17.14,"Switching screens off well before bedtime, and keeping a regular bedtime, helps children sleep, and well-rested children find it much easier to manage their feelings and behaviour the next day."],[29.08,"A simple picture timetable can help younger children follow a routine."],[33.76,"Keep family rules few and simple."],[35.75,"Say what you want your child to do, such as walk inside, rather than what not to do."],[40.83,"Agree the rules together where you can, and make sure all the adults in the house stick to them."],[46.97,"Clear, calm and consistent parenting really does make a difference."],[51.42,"A review of 101 studies of the Triple P positive parenting programme found improvements in children’s behaviour and in parents’ confidence."],[60.65,"The common thread is simple: clear expectations, followed through src":"Scottish and Welsh law","t":47.48},{"t":71.17,"layout":"callout","kicker":"Staying calm","title":"When things get heated","items":["Pause and take a breath","Lower your voice","Name the feeling: “You’re cross”","Talk it through later"],"ph":"pbp-3b","art":"process","icons":["clock","ear","heart","chat"],"ask":{"q":"Why name the feeling, for example “you’re cross”?","opts":["It helps a child calm down","It gives them something to argue about","It ends the conversation"],"a":0,"why":"Naming a feeling helps a child calm down. Then talk it through later."}},{"t":87.14,"layout":"explain","kicker":"Special time","title":"Ten minutes a day","text":"Ten minutes of one-to-one time, with your child choosing the activity and no phones."},{"t":102.07,"layout":"quote","kicker":"Key idea","title":"Connection before correction.","items":["Ten minutes of your time goes a long way."]}],"captions":[[0.0,"Children do more of what we notice, so notice the good."],[3.4,"In this lesson we look at praise, staying calm when things get heated, and the power of a little special time."],[10.54,"Be specific about what your child did, for example: thank you for putting your shoes away without being asked."],[17.94,"Notice effort and kindness, not just results."],[20.97,"And praise soon after it happens, so your child connects the praise with the behaviour."],[27.16,"Harsh punishment does not work in the long run."],[30.37,"A major review of research covering 160,927 children found that smacking was linked with more aggression, more behaviour problems and poorer mental health over time, not better behaviour."],[43.16,"Calm limits and warm relationships are far more effective."],[47.48,"The law is moving in the same direction as the research."],[51.58,"Physically punishing a child has been illegal in Scotland since the 7th of November 2020, and in Wales since the 21st of March 2022."],[61.24,"In England, the law still allows what it calls reasonable punishment, but the evidence is clear tha ","items":["Then ask your DSL what changed locally."]}],"captions":[[0.0,"Welcome to this year’s safeguarding update."],[2.51,"In the next few minutes we will cover what has changed in the statutory guidance, and what it means for your day-to-day practice."],[10.41,"Keeping Children Safe in Education 2026 came into force on 1 September 2026."],[16.27,"Annex A has been removed, so all staff should now read at least Part one."],[21.9,"A new duty to share information to safeguard children applies from 30 September 2026."],[28.45,"And staff are asked to be particularly alert to more groups of children who may need early help, such as pupils on part-time timetables."],[39.29,"The new information sharing duty makes something clear that has always been true."],[44.84,"Data protection law is never a reason not to share information that is needed to keep a child safe."],[51.63,"If in doubt, speak to the DSL."],[54.04,"Online, misinformation, disinformation and conspiracy theories are now listed as content risks."],[60.84,"AI-generated images, such as deepfakes, are treated in the same way as real images."],[66.78,"Schools are expected to be mobile phone-free throughout the school day."],[71.87,"And filtering and monitoring should cover AI-generated content too."],[77.02,"Read Part one again this year, and ask your DSL what has changed in your school."]],"segs":[{"t":0.0,"d":10.06,"a":"ul1_0"},{"t":10.41,"d":28.53,"a":"ul1_1"},{"t":39.29,"d":14.4,"a":"ul1_2"},{"t":54.04,"d":22.63,"a":"ul1_3"},{"t":77.02,"d":4.92,"a":"ul1_4"}],"sources":[["Department for Education, Keeping children safe in education 2026","https://www.gov.uk/government/publications/keeping-children-safe-in-education--2"],["Department for Education, Mobile phones in schools (2026)","https://www.gov.uk/government/publications/mobile-phones-in-schools"],["Department for Education, Filtering and monitoring standards for schools and colleges","https://www.gov.uk/guidance/meeting-digital-and-technology-standards-in-     if(dt<2){const from=t;let nt=t+dt*speed;if(segs&&clip&&segIdx>=0&&!clip.paused&&!clip.ended){const at=segs[segIdx].t+clip.currentTime;if(Math.abs(at-nt)<1.5)nt=Math.max(from,at)}const ai=pendingAsk(from,Math.min(lesson.dur,nt));if(ai>=0){t=askAt(ai)-0.07;for(let s=Math.floor(from);s<=Math.floor(t);s++)w[s]='1';update();pause();persist();showAsk(ai);return}t=Math.min(lesson.dur,nt);for(let s=Math.floor(from);s<=Math.floor(t);s++)w[s]='1'}
    update();syncMusic();
    if(++saveTick%20===0)persist();
    if(t>=lesson.dur){pause();persist();opts.onEnd&&opts.onEnd(state())}
  }
  function play(){if(stage.querySelector('.ask'))return;if(t>=lesson.dur)t=0;playing=true;last=0;P.classList.add('is-playing');big.hidden=true;pp.innerHTML=I.pause;pp.setAttribute('aria-label','Pause');clearInterval(raf);raf=setInterval(loop,100);if(clips.length)playClip();else{const c=lesson.captions[capIdx];if(c)speak(c[1])}}
  function pause(){playing=false;P.classList.remove('is-playing');clearInterval(raf);stopClip();syncMusic();pp.innerHTML=I.play;pp.setAttribute('aria-label','Play');big.hidden=false;try{speechSynthesis.cancel()}catch(e){}}
  function seek(to){
    to=Math.max(0,Math.min(lesson.dur,to));
    if(opts.restrictSeek&&to>maxReached()+1){toast('You can skip ahead once you have watched this part.');to=maxReached()}
    stopClip();segIdx=-2;t=to;capIdx=-2;update();persist();
  }
  function state(){const ws=Array.from({length:lesson.dur+1},(_,i)=>w[i]==='1'?'1':'0').join('');return {w:ws,pos:Math.floor(t),notes:[...opened],asks:[...askDone],pct:watchedPct(ws,lesson.dur)}}
  function persist(){opts.onSave&&opts.onSave(state())}
  big.onclick=play;pp.onclick=()=>playing?pause():play();
  stage.addEventListener('keydown',e=>{if(e.key===' '||e.key==='k'){e.preventDefault();playing?pause():play()}if(e.key==='ArrowRight')seek(t+5);if(e.key==='ArrowLeft')seek(t-5);if(e.key==='m'||e.key==='M')$('.nar',P).click()});
  stage.addEventListener('click',e=>{const m=e.target.closest('[data-more]');if(m){if(playing)pause();const o=m.classList.toggle('open');m.setAttribute('aria-expanded',o);return}if(e.target===stage||e.target.closest('.scene'))playing?pause():play()});
  stage.addEventListener('keydown',e=>{const m=e.target.closest&&e.target.closest('[data-more]');if(m&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();if(playing)pause();const o=m.classList.toggle('open');m.setAttribute('aria-expanded',o)}},true);
  track.addEventListener('click',e=>{if(e.target.classList.contains('mk')){openNote(e.target.dataset.n,true);return}const r=track.getBoundingClientRect();seek((e.clientX-r.left)/r.width*lesson.dur)});
  track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();seek(t+5)}if(e.key==='ArrowLeft'){e.preventDefault();seek(t-5)}});
  $('.spd',P).onchange=e=>{speed=+e.target.value;if(clip)clip.playbackRate=speed};
  $('.ccb',P).onclick=e=>{ccOn=!ccOn;e.currentTarget.setAttribute('aria-pressed',ccOn);capIdx=-2;update()};
  $('.nar',P).onclick=e=>{narr=!narr;e.currentTarget.setAttribute('aria-pressed',narr);if(!narr){stopClip();try{speechSynthesis.cancel()}catch(x){}}else if(clips.length){if(playing)playClip()}else if(!('speechSynthesis' in window))toast('Narration is not available in this browser. Captions stay on.')};
  const flashEl=$('.snd-flash',P),liveEl=$('.sr[role=status]',P);
  const paintTg=()=>{const nb=$('.nar',P);nb.setAttribute('aria-pressed',narr);nb.title=narr?'Voice is on. Click (or press M) to mute':'Voice is off. Click (or press M) to turn it on';nb.classList.toggle('zero',narr&&vol===0);P.classList.toggle('voice-off',!narr);
    const m=$('.mus',P);if(m){m.setAttribute('aria-pressed',musicOn);m.title=musicOn?'Background music is on. Click to turn it off':'Background music is off. Click to turn it on'}};
  const flash=(svg,txt,on)=>{flashEl.className='snd-flash '+(on?'on':'off');flashEl.innerHTML=svg+'<b>'+txt+'</b>';void flashEl.offsetWidth;flashEl.classList.add('go');liveEl.textContent=txt};
  $('.nar',P).addEventListener('click',()=>{paintTg();flash(I.snd,narr?'Voice on':'Voice off',narr)});
  paintTg();
  $('.vol',P).oninput=e=>{vol=+e.target.value;paintTg();if(clip)clip.volume=vol;syncMusic()};
  const mb=$('.mus',P);if(mb)mb.onclick=()=>{musicOn=!musicOn;paintTg();flash(I.mus,musicOn?'Music on':'Music off',musicOn);syncMusic()};
  $('.fs',P).onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else P.querySelector('.pl-main').requestFullscreen().catch(()=>toast('Full screen is not available here.'))}catch(e){toast('Full screen is not available here.')}};
  $('.pon',P).onchange=e=>{pauseOnNote=e.target.checked};
  renderScene(0);update();noteList();
  return {play,pause,seek,openNote,state,get t(){return t},destroy(){pause();stopClip();if(music)music.pause();persist();closePop()},isPlaying:()=>playing};
}

let TRY={step:0,answers:{},name:'',school:'',staff:30};
function trySteps(){$$('#try-steps li').forEach((li,i)=>{li.className=i===TRY.step?'on':i<TRY.step?'done':''})}
function initTry(){
  const body=$('#try-body');if(!body)return;
  trySteps();
  if(TRY.step<=1){
    body.innerHTML=`<div id="try-player"></div><div class="row between" style="margin-top:12px;color:#A9B8CC;font-size:.85rem"><span id="try-hint">Press play. Click the white marker when it appears.</span><button class="btn-link" id="try-skip" style="color:#2BC4BC">Skip to the questions</button></div>`;
    activePlayer=mountPlayer($('#try-player'),SAMPLE,{compact:true,restrictSeek:false,
      onNote:(n,all)=>{if(TRY.step<1){TRY.step=1;trySteps()} $('#try-hint').textContent=all.length>=2?'Both notes opened. Nice. Finish the clip to continue.':'Note opened. The video keeps playing.'},
      onEnd:()=>{TRY.step=2;tryQuiz()}});
    $('#try-skip').onclick=()=>{if(activePlayer){activePlayer.destroy();activePlayer=null}TRY.step=2;tryQuiz()};
  } else if(TRY.step===2) tryQuiz(); else tryCert();
}
function tryQuiz(){
  trySteps();
  const body=$('#try-body');if(!body)return;
  if(activePlayer){activePlayer.destroy();activePlayer=null}
  const qi=Object.keys(TRY.answers).length;
  if(qi>=SAMPLE_Q.length){TRY.step=3;return tryCert()}
  const q=SAMPLE_Q[qi];
  body.innerHTML=`<div class="panel stack" style="gap:14px"><div class="row between"><span class="mono small" style="color:#2BC4BC">QUESTION ${qi+1} OF ${SAMPLE_Q.length}</span><span class="small" style="color:#9FB0C6">The real assessment has 20</span></div><h3 style="font-size:1.05rem">${esc(q.text)}</h3><div class="stack" style="gap:8px" id="tq-opts">${q.opts.map((o,i)=>`<button class="q-opt radio" data-i="${i}"><span class="lt">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><p class="small" id="tq-fb" style="min-height:1.5em;color:#C9D6EA"></p></div>`;
  $$('#tq-opts .q-opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;const right=q.ans.includes(i);
    $$('#tq-opts .q-opt').forEach(x=>{x.disabled=true;const k=+x.dataset.i;if(q.ans.includes(k))x.classList.add('right');else if(k===i)x.classList.add('wrong')});
    $('#tq-fb').innerHTML=(right?'<b style="color:#5DD39A">Correct.</b> ':'<b style="color:#FF8A7E">Not quite.</b> ')+esc(q.fb)+` <span style="color:#9FB0C6">Taught at <span class="mono">${q.t}</span> in Module 3.</span>`;
    TRY.answers[q.id]=right;
    setTimeout(tryQuiz,1700);

   <p class="small" id="try-plan" style="color:#C9D6EA;margin:0">${planLine(TRY.staff)}</p>
   <button class="btn btn-primary" id="try-go" style="width:100%">Register your school for <span id="try-go-n">${TRY.staff}</span> places</button>
  </div>`;
  const drawCert=()=>{$('#try-cert').innerHTML=certHTML({name:TRY.name||'Your full name',school:TRY.school||'Your school',at:Date.now(),ref:'FT-SAMPLE',version:S.course.version,sample:true});drawQRs($('#try-cert'))};
  drawCert();
  $('#try-name').oninput=e=>{TRY.name=e.target.value;drawCert()};
  $('#try-school').oninput=e=>{TRY.school=e.target.value;drawCert()};

/* ---------- 60-second Safeguarding Training Check: score, 30-day plan, plan and price, emailed plan (a lead) ---------- */
const CHECK_Q=[
 {id:'staff',type:'staff',q:'How many staff work at your school?',hint:'Include teachers, support, office and site staff.'},
 {id:'last',area:'core',q:'When did most staff last complete full safeguarding training?',opts:[['Within the last 12 months',3],['1 to 2 years ago',2],['More than 2 years ago',0],['Not sure',0]]},
 {id:'kcsie',area:'core',q:'Have all staff read Part one of Keeping Children Safe in Education 2026?',opts:[['Yes, and we keep a record',3],['Some have',1],['Not yet',0],['Not sure',0]]},
 {id:'online',area:'online',q:'Have teachers had online safety training that covers AI images, misinformation and phone-free schools?',opts:[['Yes, this school year',3],['Older training only',1],['No',0],['Not sure',0]]},
 {id:'parents',area:'families',q:'What do you offer parents and carers on online safety or behaviour?',opts:[['A course or workshop',3],['Leaflets or newsletter tips',1],['Nothing yet',0]]},
 {id:'track',area:'evidence',q:'How do you keep track of who has completed training?',opts:[['An online system with certificates',3],['A spreadsheet',1],['Paper records, or we don’t track it',0]]}];
const CHECK_AREAS={core:'Core safeguarding training',online:'Online safety',families:'Working with families',evidence:'Records and evidence'};
let CHK={i:0,staff:40,a:{},sent:false};
function checkResult(){const qs=CHECK_Q.filter(q=>q.area),per={};
  qs.forEach(q=>(per[q.area]=per[q.area]||[]).push(CHK.a[q.id]||0));
  const areas=Object.entries(per).map(([k,v])=>({name:CHECK_AREAS[k],pct:Math.round(v.reduce((x,y)=>x+y,0)/(v.length*3)*100)}));
  const score=Math.round(qs.reduce((x,q)=>x+(CHK.a[q.id]||0),0)/(qs.length*3)*100);
  const tier=(CHK.a.online<3||CHK.a.parents<3)?'complete':'essentials',band=bandFor(CHK.staff),n=CHK.staff,C=S.courses;
  const payg=tier==='complete'?n*(C.sgs.price+C.upd.price+C.ost.price+C.pbs.price)+C.osp.price+C.pbp.price:n*(C.sgs.price+C.upd.price);
  const steps=[CHK.a.last===3?['Week 1','Send returning staff the 30-minute Safeguarding Update 2026/27.']:['Week 1','Enrol every member of staff on Safeguarding Children in Schools. New starters can join at any time.']];
  if(CHK.a.kcsie<3)steps.push(['Week 1','Ask all staff to read Part one of KCSIE 2026. Our course and update explain the 2026 changes.']);
  if(CHK.a.online<3)steps.push(['Week 2','Give teachers Online Safety for Teachers, covering AI images, misinformation and phone-free schools.']);
  if(CHK.a.parents<3)steps.push(['Week 3','Put your parent join link in the newsletter, so families can take the online safety and behaviour courses.']);
  steps.push(CHK.a.track===3?['Week 4','Check refresher due dates on your dashboard and plan next year’s update.']:['Week 4','Download your certificate register and keep it as evidence for inspections and governors.']);
  return {score,areas,tier,band,price:planPrice(tier,band),payg,steps}}
function checkCard(){const q=CHECK_Q[CHK.i];
  if(q){const head=`<div class="row between"><span class="mono small">Question ${CHK.i+1} of ${CHECK_Q.length}</span>${CHK.i?'<button class="btn-link small" data-chk-back>← Back</button>':''}</div><div class="bar"><i style="width:${(CHK.i)/CHECK_Q.length*100}%"></i></div><h3 class="chk-q" id="chk-q">${esc(q.q)}</h3>`;
    if(q.type==='staff')return head+`<p class="small muted" style="margin-top:-6px">${esc(q.hint)}</p><div class="chk-staff"><b class="num" id="chk-n">${CHK.staff}</b><span class="small muted" id="chk-band">${bandOf(bandFor(CHK.staff)).name} school</span></div><input type="range" id="chk-staff" min="5" max="250" value="${CHK.staff}" aria-labelledby="chk-q" style="width:100%;accent-color:var(--teal)"><button class="btn btn-primary" data-chk-next style="align-self:flex-start">Next</button>`;
    return head+`<div class="stack" style="gap:8px" role="group" aria-labelledby="chk-q">${q.opts.map(([label,v],k)=>`<button class="q-opt radio ${CHK.a[q.id]===v&&CHK.pick===q.id+k?'sel':''}" data-v="${v}" data-k="${k}"><span class="box"></span><span>${esc(label)}</span></button>`).join('')}</div>`}
  const r=checkResult(),T=TIERS[r.tier],lab=r.score>=80?'Well placed':r.score>=50?'A good start, with some gaps':'Important gaps to close';
  const pill=p=>p>=80?'<span class="pill ok">Strong</span>':p>=40?'<span class="pill warn">Needs attention</span>':'<span class="pill bad">Gap</span>';
  return `<div class="row between"><p class="eyebrow">Your results</p><button class="btn-link small" data-chk-restart>Start again</button></div>
   <div class="chk-score"><div class="ring" style="--p:${r.score}" role="img" aria-label="Readiness score ${r.score} out of 100"><b class="num">${r.score}</b><span>out of 100</span></div><div class="stack" style="gap:6px;min-width:0"><h3>${lab}</h3><p class="small muted">For a ${bandOf(r.band).name.toLowerCase()} school with ${CHK.staff} staff.</p></div></div>
   <div class="stack" style="gap:10px">${r.areas.map(a=>`<div class="stack" style="gap:4px"><div class="row between small" style="flex-wrap:nowrap"><span>${esc(a.name)}</span>${pill(a.pct)}</div><div class="bar"><i style="width:${Math.max(4,a.pct)}%;${a.pct<40?'background:var(--bad)':a.pct<80?'background:var(--warn)':''}"></i></div></div>`).join('')}</div>
   <div class="stack" style="gap:8px"><h4>Your 30-day plan</h4><ol class="chk-steps">${r.steps.map(x=>`<li><span class="mono small">${x[0]}</span><span>${esc(x[1])}</span></li>`).join('')}</ol></div>
   <div class="chk-rec"><div class="stack" style="gap:2px;min-width:0"><span class="small muted">Recommended for you</span><b>${T.name} plan · <span class="num">${money(r.price)}</span> a year</b><span class="small muted">Every member of staff, including new starters.${r.payg>r.price?` Paying per person for the same courses for all ${CHK.staff} staff would cost about ${money(r.payg)}.`:''}</span></div><button class="btn btn-primary" data-chk-start>Start the ${T.name} plan</button></div>
   ${CHK.sent?`<div class="notice ok small"><span>Your plan is on its way to <b>${esc(CHK.sent)}</b>.</span></div>`:`<form class="chk-form" id="chk-form" novalidate><label for="chk-email" class="small" style="font-weight:700">Email me this plan</label><div class="row" style="flex-wrap:nowrap"><input type="email" id="chk-email" placeholder="name@school.sch.uk" autocomplete="email" style="min-width:0"><button class="btn btn-ghost" type="submit">Send</button></div><span class="small" id="chk-err" style="color:var(--bad)"></span></form>`}
   <p class="small muted">This check is a guide to help you plan training. It is not an audit, and it does not confirm that you meet statutory requirements.</p>`}
function bindCheck(){const box=$('#chk');if(!box)return;const draw=()=>{box.innerHTML=checkCard();wire()};
  const wire=()=>{const sl=$('#chk-staff',box);if(sl)sl.oninput=e=>{CHK.staff=+e.target.value;$('#chk-n').textContent=CHK.staff;$('#chk-band').textContent=bandOf(bandFor(CHK.staff)).name+' school'};
    const f=$('#chk-form',box);if(f)f.onsubmit=e=>{e.preventDefault();const em=$('#chk-email').value.trim();if(!emailOk(em)){$('#chk-err').textContent='Enter a valid email address, like name@school.sch.uk';return}
      if(LIVE)return liveLead(em,checkResult(),draw);const r=checkResult(),T=TIERS[r.tier];(S.leads=S.leads||[]).unshift({at:Date.now(),email:em,staff:CHK.staff,score:r.score,tier:r.tier,price:r.price});
      sendEmail(em,'Your safeguarding training plan',`<p>Thanks for taking the Foresee training check.</p><p><b>Readiness score: ${r.score} out of 100</b> (${CHK.staff} staff).</p><ul>${r.areas.map(a=>`<li>${esc(a.name)}: ${a.pct}%</li>`).join('')}</ul><p><b>Your 30-day plan</b></p><ol>${r.steps.map(x=>`<li>${x[0]}: ${esc(x[1])}</li>`).join('')}</ol><p>Recommended: the <b>${T.name} plan</b> at ${money(r.price)} a year for every member of staff.</p><p>This check is a guide to help you plan training. It is not an audit.</p>`,{type:'go',view:'pricing',label:'See plans and prices'});
      audit(`Training check plan emailed (score ${r.score}, ${T.name} recommended)`,'Visitor');CHK.sent=em;save();draw();toast('Plan sent. Check the Prototype inbox to see the email.')}};
  box.onclick=e=>{const b=e.target.closest('button');if(!b||!box.contains(b))return;
    if(b.dataset.v!==undefined){const q=CHECK_Q[CHK.i];CHK.a[q.id]=+b.dataset.v;CHK.pick=q.id+b.dataset.k;$$('.q-opt',box).forEach(x=>x.classList.toggle('sel',x===b));setTimeout(()=>{CHK.i++;draw()},180);return}
    if(b.hasAttribute('data-chk-next')){CHK.i++;draw();return}
    if(b.hasAttribute('data-chk-back')){CHK.i=Math.max(0,CHK.i-1);draw();return}
    if(b.hasAttribute('data-chk-restart')){CHK={i:0,staff:CHK.staff,a:{},sent:false};draw();return}
    if(b.hasAttribute('data-chk-start')){const r=checkResult();if(S.session.role==='school')go('subscribe',{tier:r.tier,band:r.band});else go('register',{plan:r.tier,band:r.band})}};
  wire()}

let SC_TIMER=null;
function initShowcase(){const box=$('#showcase');if(!box)return;clearInterval(SC_TIMER);
  const panels=$$('.sc-panel',box),bar=$('.sc-progress i',box);let cur=0,hold=false;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const open=i=>{cur=(i+panels.length)%panels.length;panels.forEach((p,k)=>{p.classList.toggle('open',k===cur);$('.sc-tab',p).setAttribute('aria-expanded',k===cur)});
    if(bar){bar.style.animation='none';void bar.offsetWidth;bar.style.animation=reduce||hold?'none':''}};
  panels.forEach((p,k)=>{$('.sc-tab',p).onclick=()=>{open(k)};p.addEventListener('click',e=>{if(!p.classList.contains('open')&&!e.target.closest('[data-sc-go]'))open(k)})});
  $$('[data-sc-go]',box).forEach(b=>b.onclick=e=>{e.stopPropagation();go(b.dataset.scGo)});
  box.addEventListener('mouseenter',()=>{hold=true;box.classList.add('held')});box.addEventListener('mouseleave',()=>{hold=false;box.classList.remove('held');open(cur)});
  box.addEventListener('focusin',()=>{hold=true;box.classList.add('held')});box.addEventListener('focusout',()=>{hold=false;box.classList.remove('held')});
  if(!reduce)SC_TIMER=setInterval(()=>{if(!document.body.contains(box)){clearInterval(SC_TIMER);return}if(!hold)open(cur+1)},6000);
  open(0)}

  <div class="field"><label for="r-pw">Password</label><div class="pw-wrap"><input type="password" id="r-pw" autocomplete="new-password" aria-describedby="r-pw-h"><button type="button">Show</button></div><span class="hint" id="r-pw-h">At least 10 characters, with a number</span><span class="err" id="r-pw-e"></span></div>
  <div class="field"><label for="r-pw2">Confirm password</label><div class="pw-wrap"><input type="password" id="r-pw2" autocomplete="new-password"><button type="button">Show</button></div><span class="err" id="r-pw2-e"></span></div>
 </div>
 <label class="checkbox"><input type="checkbox" id="r-terms"> <span>I agree to the <button type="button" class="btn-link" data-go="policy" data-p="terms">terms</button> and have read the <button type="button" class="btn-link" data-go="policy" data-p="privacy">privacy notice</button>.</span></label><span class="err" id="r-terms-e" style="color:var(--bad);font-size:.82rem;font-weight:600"></span>
 <div class="row between"><span class="small muted">Already registered? <button type="button" class="btn-link" data-go="login">Sign in</button></span><button class="btn btn-primary" type="submit">Create account and send code</button></div>
</form></div></section>`};
function fld(id,label,type,val,ac,hint,cls){return `<div class="field ${cls||''}"><label for="${id}">${label}</label><input type="${type}" id="${id}" value="${esc(val||'')}" autocomplete="${ac||'off'}" ${hint?`aria-describedby="${id}-h"`:''}>${hint?`<span class="hint" id="${id}-h">${hint}</span>`:''}<span class="err" id="${id}-e"></span></div>`}
AFTER.register=()=>{
  $('#reg').onsubmit=e=>{
    e.preventDefault();let ok=true;
    const v=id=>$('#'+id).value.trim();const err=(id,m)=>{$('#'+id+'-e').textContent=m||'';$('#'+id).classList.toggle('invalid',!!m);if(m){if(ok)$('#'+id).focus();ok=false}};
    ['r-name','r-role','r-email','r-school','r-addr','r-pc','r-tel','r-pw','r-pw2'].forEach(id=>{$('#'+id+'-e').textContent='';$('#'+id).classList.remove('invalid')});
    [['r-name','Enter your full name'],['r-role','Enter your job title or role']].forEach(([id,m])=>{if(!v(id))err(id,m)});
    if(!emailOk(v('r-email')))err('r-email','Enter a valid work email address, like name@school.sch.uk');
    if(!v('r-school'))err('r-school','Enter your school’s name');
    if(!v('r-addr'))err('r-addr','Enter your school’s address');
    if(!/^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i.test(v('r-pc')))err('r-pc','Enter a UK postcode, like TN23 1AA');
    if(v('r-tel').replace(/\D/g,'').length<10)err('r-tel','Enter a telephone number with at least 10 digits');
    const pw=$('#r-pw').value;if(pw.length<10||!/\d/.test(pw))err('r-pw','Use at least 10 characters, including a number');
    if($('#r-pw2').value!==pw)err('r-pw2','The passwords do not match');
    $('#r-terms-e').textContent=$('#r-terms').checked?'':'Please agree to the terms to continue';if(!$('#r-terms').checked)ok=false;
    if(!ok)return;
    if(LIVE)return liveSignup({name:v('r-name'),role:v('r-role'),email:v('r-email').toLowerCase()},{name:v('r-school'),address:v('r-addr'),postcode:v('r-pc').toUpperCase(),phone:v('r-tel')},pw);
    S.pending={contact:{name:v('r-name'),role:v('r-role'),email:v('r-email'),password:pw,primary:true},school:{name:v('r-school'),address:v('r-addr'),postcode:v('r-pc').toUpperCase(),phone:v('r-tel')},places:PARAMS.places||30,cid:PARAMS.cid||'sgs',plan:PARAMS.plan||null,band:PARAMS.band||null,code:null,exp:0,tries:0,lockUntil:0,sends:0};
    sendCode();go('verify');
  };
};
function sendCode(){
  const p=S.pending;p.code=rnd6();p.exp=Date.now()+S.cfg.codeMinutes*6e4;p.sends++;
  sendEmail(p.contact.email,'Your Foresee verification code',`<p>Hello ${esc(p.contact.name)},</p><p>Use this code to verify your email address and finish registering ${esc(p.school.name)}:</p><p><span class="e-code">${p.code}</span></p><p>The code expires in ${S.cfg.codeMinutes} minutes. If you didn’t ask for it, you can ignore this email.</p>`);
  save();
  toast(`Code sent to ${esc(p.contact.email)}.`,{label:'Open inbox',fn:()=>openEmail(S.inbox[0].id)});
}
VIEWS.verify=()=>{const p=S.pending;if(!p)return VIEWS.register();return `
<section class="wrap"><div class="auth-shell"><div class="card raised stack" style="gap:18px">
 <div class="icon-badge">${I.note}</div><h2>Check your email</h2><p class="muted">We sent a six-digit code to <b>${esc(p.contact.email)}</b>. Enter it below to verify your account.</p>
 <form id="vf" class="stack" novalidate><div class="code-boxes" role="group" aria-label="Six-digit code">${[0,1,2,3,4,5].map(i=>`<input type="text" inputmode="numeric" maxlength="1" id="c${i}" aria-label="Digit ${i+1}" autocomplete="${i?'off':'one-time-code'}">`).join('')}</div><div id="vf-msg" aria-live="polite"></div><button class="btn btn-primary" type="submit">Verify email</button></form>
 <div class="row between small"><span class="muted">Code expires at <span class="mono">${new Date(p.exp).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span></span><button class="btn-link" id="vf-resend">Send a new code</button></div>
 ${LIVE?'<p class="small muted">Can’t see it? Check your spam or junk folder. It comes from Foresee Training. <button class="btn-link" data-go="login">Already registered? Sign in</button></p>':'<div class="notice small"><span><b>Prototype:</b> emails go to the yellow Prototype panel (bottom left). <button class="btn-link" id="vf-inbox">Open the code email</button></span></div>'}
</div></div></section>`};
AFTER.verify=()=>{
  const boxes=$$('.code-boxes input');
  boxes.forEach((b,i)=>{b.oninput=()=>{b.value=b.value.replace(/\D/g,'').slice(0,1);if(b.value&&boxes[i+1])boxes[i+1].focus()};b.onkeydown=e=>{if(e.key==='Backspace'&&!b.value&&boxes[i-1])boxes[i-1].focus()};b.onpaste=e=>{const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(d.length){e.preventDefault();d.split('').forEach((x,k)=>{if(boxes[k])boxes[k].value=x});boxes[Math.min(d.length,5)].focus()}}});
  boxes[0].focus();
  const vfi=$('#vf-inbox');if(vfi)vfi.onclick=()=>{const e=S.inbox.find(x=>/verification code/.test(x.subject));if(e)openEmail(e.id)};
  $('#vf-resend').onclick=()=>{if(LIVE)return liveResend();const p=S.pending;if(p.sends>=5){$('#vf-msg').innerHTML='<div class="notice warn">Too many codes requested. Please wait a few minutes.</div>';return}sendCode();render()};
  $('#vf').onsubmit=e=>{
    e.preventDefault();const p=S.pending;const code=boxes.map(b=>b.value).join('');const m=$('#vf-msg');
    if(Date.now()<p.lockUntil){m.innerHTML=`<div class="notice bad">Too many wrong codes. Try again after ${new Date(p.lockUntil).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}.</div>`;return}
    if(code.length<6){m.innerHTML='<div class="notice bad">Enter all six digits.</div>';return}
    if(LIVE)return liveVerify(code,m,boxes);
    if(Date.now()>p.exp){m.innerHTML='<div class="notice bad">This code has expired. Send a new code.</div>';return}
    if(code!==p.code){p.tries++;if(p.tries>=5){p.lockUntil=Date.now()+10*6e4;p.tries=0}save();m.innerHTML=`<div class="notice bad">That code is not right. ${p.lockUntil>Date.now()?'Please wait 10 minutes before trying again.':`You have ${5-p.tries} tries left.`}</div>`;boxes.forEach(b=>b.value='');boxes[0].focus();return}
    // Verified: the new school replaces the sample school in this prototype
    S.school={id:'sch'+uid(),name:p.school.name,address:p.school.address,postcode:p.school.postcode,phone:p.school.phone,contacts:[p.contact],verified:true,created:Date.now()};
    S.orders=[];S.attendees=[];S.subscription=null;const places=p.places,cid=p.cid||'sgs';S.pending=null;S.ui.cid=cid;
    S.session={role:'school',user:null};
    audit('School registered and email verified',p.contact.name);
    sendEmail(p.contact.email,'Welcome to Foresee Training',`<p>Hello ${esc(p.contact.name)},</p><p>Your school account for <b>${esc(S.school.name)}</b> is ready. You can now buy training places and invite your staff.</p>`);
    save();toast('Email verified. Your account is active.');if(p.plan)go('subscribe',{tier:p.plan,band:p.band||'m'});else go('basket',{places,cid});
  };
};

VIEWS.login=()=>{const tab=PARAMS.tab||'school';return `
<section class="wrap"><div class="auth-shell"><div class="card raised stack" style="gap:18px">
 <h2>Sign in</h2>${PARAMS.msg?`<div class="notice">${esc(PARAMS.msg)}</div>`:''}
 <div class="tabs" role="tablist" style="margin:0"><button role="tab" aria-selected="${tab==='school'}" data-tab="school">School account</button><button role="tab" aria-selected="${tab==='learner'}" data-tab="learner">Staff member</button></div>
 <form id="lf" class="stack" novalidate>
  <div class="field"><label for="l-email">Email address</label><input type="email" id="l-email" autocomplete="username"></div>
  <div class="field"><label for="l-pw">Password</label><div class="pw-wrap"><input type="password" id="l-pw" autocomplete="current-password"><button type="button">Show</button></div></div>
  <div class="row between"><label class="checkbox"><input type="checkbox" id="l-rem"> Remember me on this device</label><button type="button" class="btn-link small" id="l-forgot">Forgot password?</button></div>
  <div id="l-msg" aria-live="polite"></div>
  <button class="btn btn-primary" type="submit">Sign in</button>
 </form>
 ${LIVE?'':`<div class="hr"></div>
 <div class="stack" style="gap:8px"><p class="small muted"><b>Prototype shortcuts</b></p><div class="row"><button class="btn btn-ghost btn-sm" data-demo="school">Sample school admin</button><button class="btn btn-ghost btn-sm" data-demo="learner">Sample learner (all courses)</button><button class="btn btn-ghost btn-sm" data-demo="admin">Platform admin</button></div></div>`}
 <p class="small muted">New school? <button class="btn-link" data-go="register">Register your school</button><br>Parent or carer with a join code? <button class="btn-link" data-go="join">Join here</button></p>
</div></div></section>`};
AFTER.login=()=>{
  $$('[data-tab]').forEach(b=>b.onclick=()=>go('login',{tab:b.dataset.tab}));
  $$('[data-demo]').forEach(b=>b.onclick=()=>asRole(b.dataset.demo));
  $('#l-forgot').onclick=()=>forgot();
  $('#lf').onsubmit=e=>{
    e.preventDefault();const em=$('#l-email').value.trim().toLowerCase(),pw=$('#l-pw').value;const tab=PARAMS.tab||'school';if(LIVE)return liveLogin(em,pw);
    S.loginFails=S.loginFails||0;
    if(S.loginFails>=5&&Date.now()<(S.loginLock||0)){$('#l-msg').innerHTML='<div class="notice bad">Too many attempts. Please wait 10 minutes or reset your password.</div>';return}
    if(tab==='school'){const c=S.school.contacts.find(c=>c.email.toLowerCase()===em&&c.password===pw);if(c){S.loginFails=0;S.session={role:'school',user:null};save();go('school');return}}
    else{const a=S.attendees.find(a=>a.email.toLowerCase()===em&&a.password&&a.password===pw);if(a){S.loginFails=0;S.session={role:'learner',user:a.id};save();go('learner');return}}
    S.loginFails++;if(S.loginFails>=5)S.loginLock=Date.now()+10*6e4;save();
    $('#l-msg').innerHTML='<div class="notice bad">The email or password is not right. Check them and try again.</div>';
  };
};
function forgot(){if(LIVE)return liveForgot();
  const m=modal('Reset your password',`<form id="fp" class="stack"><p class="muted small">Enter your email. If it matches an account, we’ll send a six-digit reset code.</p><div class="field"><label for="fp-email">Email address</label><input type="email" id="fp-email"></div><div id="fp-step2" hidden class="stack"><div class="field"><label for="fp-code">Six-digit code</label><input type="text" id="fp-code" inputmode="numeric" maxlength="6" class="mono"></div><div class="field"><label for="fp-pw">New password</label><input type="password" id="fp-pw" autocomplete="new-password"><span class="hint">At least 10 characters, with a number</span></div></div><div id="fp-msg"></div><button class="btn btn-primary" type="submit" id="fp-btn">Send reset code</button></form>`);
  let code=null,who=null;
  $('#fp',m).onsubmit=e=>{e.preventDefault();
    if(!code){const em=$('#fp-email').value.trim().toLowerCase();who=S.school.contacts.find(c=>c.email.toLowerCase()===em)||S.attendees.find(a=>a.email.toLowerCase()===em);code=rnd6();if(who)sendEmail(who.email,'Reset your Foresee password',`<p>Your password reset code is:</p><p><span class="e-code">${code}</span></p><p>It expires in ${S.cfg.codeMinutes} minutes. If you didn’t ask to reset your password, contact your school or our support team.</p>`);$('#fp-step2').hidden=false;$('#fp-btn').textContent='Set new password';$('#fp-msg').innerHTML='<div class="notice small">If that email is registered, a code is on its way. (Prototype: see the Prototype panel inbox.)</div>';return}
    const pw=$('#fp-pw').value;if($('#fp-code').value!==code){$('#fp-msg').innerHTML='<div class="notice bad small">That code is not right.</div>';return}
    if(pw.length<10||!/\d/.test(pw)){$('#fp-msg').innerHTML='<div class="notice bad small">Use at least 10 characters, including a number.</div>';return}
    if(who){who.password=pw;sendEmail(who.email,'Your password was changed','<p>Your Foresee password was just changed. If this wasn’t you, contact support straight away.</p>')}save();closeModal();toast('Password updated. You can now sign in.');
  };
}
function asRole(r){
  if(r==='school'){S.session={role:'school',user:null};save();go('school')}
  else if(r==='learner'){const a=S.attendees.find(x=>x.course==='sgs'&&x.activated&&!passed(x)&&!Object.keys(x.progress).length)||S.attendees.find(x=>!passed(x))||S.attendees[0];if(!a){toast('Add a staff member first.');S.session={role:'school',user:null};save();return go('attendees')}a.activated=true;a.invite='Accepted';/* Prototype: the sample learner is enrolled on every course, so all of them can be tried */Object.keys(S.courses).filter(id=>id!=='sample'&&id!==a.course).forEach(id=>{if(S.attendees.some(x=>x.course===id&&x.email.toLowerCase()===a.email.toLowerCase()))return;S.attendees.push({id:'t'+uid(),course:id,name:a.name,email:a.email,role:S.courses[id].licence?'Parent or carer':a.role,added:Date.now(),invite:'Accepted',activated:true,progress:{},attempts:[],cert:null})});S.attendees.filter(x=>x.email.toLowerCase()===a.email.toLowerCase()).forEach(x=>{x.activated=true;x.invite='Accepted'});S.session={role:'learner',user:a.id};save();go('learner')}
  else if(r==='admin'){S.session={role:'admin',user:null};save();go('admin')}
  else{S.session={role:'public',user:null};save();go('home')}
}

AFTER.plan=()=>{const bind=()=>{$$('[data-plan]').forEach(b=>b.onclick=()=>go('subscribe',{tier:b.dataset.plan,band:bandFor(30)}))};bind();

/* Reminders 60 and 30 days before renewal; on the renewal date, renew (card or invoice) or end the plan */
function checkRenewal(){if(LIVE)return;const x=S.subscription;if(!x||x.status!=='Active')return;const now=Date.now(),days=(x.end-now)/DAY,c=S.school.contacts[0];
  const remind=d=>sendEmail(c.email,`Your Foresee plan renews on ${fmtD(x.end)}`,`<p>Hello ${esc(c.name)},</p><p>Your <b>${TIERS[x.nextTier||x.tier].name}</b> plan renews automatically on <b>${fmtD(x.end)}</b> for ${money(planPrice(x.nextTier||x.tier,x.nextBand||x.band))}, paid by ${x.method==='Card'?'card':'invoice'}.</p><p>To change your plan or switch off renewal, go to your plan page before that date.</p>`,{type:'go',role:'school',view:'plan',label:'Manage your plan'});
  if(x.autoRenew&&days<=60&&!x.r60){x.r60=true;remind(60)}
  if(x.autoRenew&&days<=30&&!x.r30){x.r30=true;remind(30)}
  if(now<x.end)return;
  if(!x.autoRenew){x.status='Ended';audit(`${TIERS[x.tier].name} plan ended`,'System');sendEmail(c.email,'Your Foresee plan has ended',`<p>Your plan ended on ${fmtD(x.end)}. Staff can still download certificates they have earned. Choose a plan again at any time.</p>`,{type:'go',role:'school',view:'plan',label:'See plans'});save();return}
  const t=x.nextTier||x.tier,b=x.nextBand||x.band,price=planPrice(t,b),ref='FT-ORD-'+(S.orderSeq++);
  const o={ref,course:'sub',sub:{tier:t,band:b},renewal:true,places:0,price,total:price,status:x.method==='Card'?'Paid':'Awaiting payment',method:x.method,po:x.po||'',at:x.end,invoice:'INV-'+ref.slice(7)};S.orders.push(o);
  Object.assign(x,{tier:t,band:b,start:x.end,end:x.end+YEAR,r60:false,r30:false,nextTier:null,nextBand:null});
  audit(`Plan renewed: ${orderTitle(o)}, ${money(price)}, ${o.status.toLowerCase()}`,'System');
  sendEmail(c.email,o.status==='Paid'?'Your Foresee plan has renewed':`Invoice ${o.invoice}: plan renewal`,o.status==='Paid'?`<p>Your ${TIERS[t].name} plan has renewed until <b>${fmtD(x.end)}</b>. We charged ${money(price)} to your saved card.</p>`:`<p>Your ${TIERS[t].name} plan has renewed until <b>${fmtD(x.end)}</b>. Please pay invoice ${o.invoice} for ${money(price)} within 30 days${x.po?`, quoting PO ${esc(x.po)}`:''}.</p>`,{type:'go',role:'school',view:'plan',label:'View your plan'});
  save()}
/* Yearly refresher: due 12 months after a person last completed safeguarding training (full course or update) */
function refresherInfo(a){const em=a.email.toLowerCase();const certs=S.attendees.filter(x=>(x.course==='sgs'||x.course==='upd')&&x.email.toLowerCase()===em&&x.cert&&x.cert.status==='Valid').map(x=>x.cert.at);if(!certs.length)return null;const last=Math.max(...certs),due=last+YEAR,d=(due-Date.now())/DAY;return {last,due,status:d<0?'Overdue':d<=60?'Due soon':'Up to date'}}
function refCell(a){const r=refresherInfo(a);if(!r)return '<td><span class="muted small">After first completion</span></td>';return `<td><span class="pill ${r.status==='Overdue'?'bad':r.status==='Due soon'?'warn':'ok'}">${r.status}</span><span class="sub">${fmtD(r.due)}</span></td>`}
function dueForUpdate(){return enrolled().filter(a=>{const r=refresherInfo(a);if(!r||r.status==='Up to date')return false;return !S.attendees.some(x=>x.course==='upd'&&x.email.toLowerCase()===a.email.toLowerCase()&&!x.cert)})}
function refresherCard(){const A=enrolled().map(a=>refresherInfo(a)).filter(Boolean);const od=A.filter(r=>r.status==='Overdue').length,ds=A.filter(r=>r.status==='Due soon').length,pending=dueForUpdate();

function understandingCard(P){const c=S.course;const rows=[];allLessons().forEach(({l},li)=>checksFor(c,l).forEach(id=>{const q=S.questions.find(x=>x.id===id);if(!q)return;const ans=P.map(a=>((a.progress[l.id]||{}).checks||{})[id]).filter(Boolean);rows.push({q,li,n:ans.length,pct:ans.length?Math.round(ans.filter(x=>x.first).length/ans.length*100):0})}));

/* Average confidence before and after, only for parents who answered both */
function confidenceCard(P){const L=S.course.confidence||[];if(!L.length)return '';const both=P.filter(a=>a.conf&&Array.isArray(a.conf.before)&&Array.isArray(a.conf.after));
  if(both.length<MIN_GROUP)return `<div class="card stack" style="gap:8px"><h3>Parents’ confidence</h3><p class="small muted">Shows the change in confidence once ${MIN_GROUP} or more parents have answered before and after. ${both.length} so far.</p></div>`;
  const avg=(k,i)=>both.reduce((s,a)=>s+a.conf[k][i],0)/both.length;
  return `<div class="card stack" style="gap:12px"><div class="stack" style="gap:2px"><h3>Parents’ confidence</h3><p class="small muted">Average on a scale of 1 (not at all) to 5 (very), from ${both.length} parents who answered before and after.</p></div>

function draftRow(name,email,role){
  const errs=[];name=(name||'').trim();email=(email||'').trim();

  if(DRAFT.some(d=>d.email.toLowerCase()===lc))errs.push('Duplicate in this list');
  return {name,email,role:(role||'').trim(),errs};
}
function drawDraft(){
  const rem=remaining();const ok=DRAFT.filter(d=>!d.errs.length);

  $$('[data-rm]').forEach(b=>b.onclick=()=>{DRAFT.splice(+b.dataset.rm,1);DRAFT=DRAFT.map(d=>d);revalidate();drawDraft()});
  const over=ok.length>rem;

  if(over)$('#at-draft').insertAdjacentHTML('beforeend',`<div class="notice bad small" style="margin-top:8px"><span>You have ${rem} place${rem===1?'':'s'} left but ${ok.length} people in the list. Remove ${ok.length-rem} or <button class="btn-link" data-go="basket">buy ${ok.length-rem} more</button>.</span></div>`),bindCommon($('#at-draft'));
}
function revalidate(){const old=DRAFT;DRAFT=[];old.forEach(d=>DRAFT.push(draftRow(d.name,d.email,d.role)))}
function parseCSV(text){
  const lines=text.replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);let added=0;
  lines.forEach((l,i)=>{const cells=[];let cur='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===','&&!q){cells.push(cur);cur='';continue}cur+=ch}cells.push(cur);
    if(i===0&&/name/i.test(cells[0])&&/email/i.test(cells[1]||''))return;
    DRAFT.push(draftRow(cells[0],cells[1],cells[2]));added++});
  const bad=DRAFT.filter(d=>d.errs.length).length;
  $('#at-csv-msg').innerHTML=`<div class="notice ${bad?'warn':'ok'} small">${added} row${added===1?'':'s'} checked.${bad?` ${bad} need fixing before you confirm (shown in red).`:' All look good.'}</div>`;
  drawDraft();
}

 <div class="stack" style="gap:20px">
  ${lic?confCard(a):''}
  <div class="card raised stack" style="gap:14px"><div class="row between"><h2 style="font-size:1.35rem">${esc(S.course.title)}</h2><span class="pill teal">v${esc(S.course.version)}</span></div><p class="muted">${esc(S.course.short)}</p><div class="row between small"><span>${st.done} of ${st.total} lessons complete</span><b class="num">${st.pct}%</b></div><div class="bar"><i style="width:${st.pct}%"></i></div>
   <div class="row">${passed(a)?`<button class="btn btn-primary" data-cert="${a.id}">View your certificate</button>${lic?`<button class="btn btn-ghost" id="ld-quiz">${a.quiz?'Take the quiz again':'Try the optional quiz'}</button>`:''}`:allDone?`<button class="btn btn-primary" id="ld-assess">${a.attempts.length?'Retake the assessment':'Start the assessment'}</button>`:`<button class="btn btn-primary" data-lesson="${nextIdx}">${Object.keys(a.progress).length?'Continue training':'Start training'}</button>`}<span class="small muted">${esc(S.course.duration)}</span></div></div>
