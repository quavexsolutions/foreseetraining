<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="media/brand/foresee-icon.png">
<link rel="apple-touch-icon" href="media/brand/foresee-icon.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="backend.js"></script>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Foresee Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Online safeguarding training for UK school staff: video lessons, interactive notes, a 20-question assessment and automatic certificates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: navy brand bands for the public site, a calm white work surface for the dashboards,
   and one dark "stage" for video lessons. Teal is the only interactive colour. */
:root{
  --navy:#0D2142; --navy-2:#173462; --band:#0D2142; --band-ink:#EAF0F7; --band-muted:#A9B8CC;
  --teal:#0A7E7B; --teal-bright:#2BC4BC; --btn:#0A7E7B; --btn-hover:#08686A; --btn-ink:#FFFFFF;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#F8FAFC; --ink:#1D2532; --muted:#586577; --line:#DFE5EC;
  --soft:#E6F4F3; --soft-ink:#075E5C;
  --ok:#14724A; --ok-bg:#E3F4EB; --warn:#9A5300; --warn-bg:#FCF0DF; --bad:#B42318; --bad-bg:#FBE9E7;
  --stage:#0A1A33; --stage-ink:#F1F5FA; --stage-muted:#9FB0C6;
  --shadow:0 1px 2px rgba(13,33,66,.06),0 6px 20px rgba(13,33,66,.06);
  --f-ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --band:#0B1830; --band-ink:#EAF0F7; --band-muted:#A1B1C6; --navy:#C9D6EA; --navy-2:#9DB2D3;
  --teal:#3CCFC6; --btn:#2BC4BC; --btn-hover:#4FD6CF; --btn-ink:#04232A;
  --bg:#0A111E; --surface:#111B2C; --surface-2:#152237; --ink:#E6ECF4; --muted:#9AA9BC; --line:#25344B;
  --soft:#0F2D33; --soft-ink:#7FE3DC;
  --ok:#5DD39A; --ok-bg:#10301F; --warn:#F2B260; --warn-bg:#33240E; --bad:#FF8A7E; --bad-bg:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --band:#0B1830; --band-ink:#EAF0F7; --band-muted:#A1B1C6; --navy:#C9D6EA; --navy-2:#9DB2D3;
  --teal:#3CCFC6; --btn:#2BC4BC; --btn-hover:#4FD6CF; --btn-ink:#04232A;
  --bg:#0A111E; --surface:#111B2C; --surface-2:#152237; --ink:#E6ECF4; --muted:#9AA9BC; --line:#25344B;
  --soft:#0F2D33; --soft-ink:#7FE3DC;
  --ok:#5DD39A; --ok-bg:#10301F; --warn:#F2B260; --warn-bg:#33240E; --bad:#FF8A7E; --bad-bg:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--band)}
h1,h2,h3,h4{line-height:1.2;text-wrap:balance;margin:0;color:var(--ink);letter-spacing:-.015em}
h1{font-size:clamp(2rem,4.6vw,3.25rem);font-weight:800}
h2{font-size:clamp(1.5rem,3vw,2.125rem);font-weight:800}
h3{font-size:1.2rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal-bright);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(clamp(16px,4vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,48px),env(safe-area-inset-right,0px))}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.lede{font-size:1.125rem;color:var(--muted);max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.section{padding-block:72px}
.section-tight{padding-block:40px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-sm);padding:11px 18px;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--btn);color:var(--btn-ink)}
.btn-primary:hover{background:var(--btn-hover)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.btn-on-band{background:transparent;border-color:rgba(234,240,247,.35);color:var(--band-ink)}
.btn-on-band:hover{border-color:var(--teal-bright);color:var(--teal-bright)}
.btn-sm{padding:7px 12px;font-size:.85rem}
.btn-link{background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-danger{background:transparent;border-color:var(--bad);color:var(--bad)}

/* Header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--band);color:var(--band-ink);border-bottom:1px solid rgba(255,255,255,.06)}
.site-header .wrap{display:flex;align-items:center;gap:20px;height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--band-ink);font-weight:800;letter-spacing:-.01em;font-size:1.05rem;cursor:pointer;background:none;border:0;padding:0}
.brand .see{color:var(--teal-bright);position:relative}
.brand .see::after{content:"";position:absolute;left:8%;right:8%;bottom:-3px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#F2C14E,transparent);opacity:.9}
.c-brand .see,.e-head .see{color:#139E97}
.foot-col .tagline{display:inline-block;margin-top:6px;color:var(--teal-bright);font-weight:800}
.four-c-band{background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--teal) 6%,var(--bg)))}
.four-c{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:clamp(24px,4vw,56px);align-items:center}
.fc-4c{background:linear-gradient(100deg,#2B7CC4,#5DAE3E);-webkit-background-clip:text;background-clip:text;color:transparent}
.fc-emblem{color:var(--navy);max-width:260px;margin-top:8px}
.fc-emblem svg{width:100%;height:auto;display:block}
.fc-emblem .fc-rays{animation:fcRays 3.2s ease-in-out infinite;transform-origin:110px 92px}
.fc-emblem .fc-iris{animation:fcLook 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fcRays{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes fcLook{0%,40%,100%{transform:translateX(0)}50%,70%{transform:translateX(9px)}80%{transform:translateX(-6px)}}
.fc-wheel{max-width:400px;color:var(--ink)}
.fc-wheel .wh-orbit{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 7;transform-origin:180px 180px;animation:whSpin 60s linear infinite}
.fc-wheel .wh-arc{stroke-dasharray:100;stroke-dashoffset:0;animation:whDraw 1.4s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 6px 10px rgba(13,33,66,.12))}
.fc-wheel .wh-n{font:800 15px var(--f-ui);fill:#fff;letter-spacing:.04em}
.fc-wheel .wh-l{font:800 17px var(--f-ui);letter-spacing:-.01em}
.fc-wheel .wh-core{fill:var(--surface);stroke:var(--line);stroke-width:1.5;filter:drop-shadow(0 10px 24px rgba(13,33,66,.12))}
@keyframes whDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes whSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fc-wheel .wh-arc{animation:none}.fc-wheel .wh-orbit{animation:none}}
.fc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.fc-card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:8px;transition:transform .35s cubic-bezier(.2,.75,.2,1),box-shadow .35s,border-color .35s}
.fc-card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c,var(--teal));transform:scaleX(.25);transform-origin:left;transition:transform .5s cubic-bezier(.2,.75,.2,1)}
.fc-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--c,var(--teal)) 45%,var(--line))}
.fc-card:hover::before{transform:scaleX(1)}
.fc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.fc-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--teal)) 13%,transparent);color:var(--c,var(--teal))}
.fc-ic .ic{width:24px;height:24px}
.fc-n{font-family:var(--f-mono);font-weight:700;font-size:.8rem;color:var(--muted);letter-spacing:.08em}
.fc-card h3{font-size:1.35rem}
.fc-sub{font-weight:700;margin:0;color:var(--ink)}
@media (max-width:900px){.four-c{grid-template-columns:1fr}.fc-emblem{max-width:340px}}
@media (max-width:560px){.fc-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.fc-emblem .fc-rays,.fc-emblem .fc-iris{animation:none}}
.brand .brand-logo{height:52px;width:auto;display:block}
.e-head .brand-logo,.c-brand .brand-logo{height:44px;width:auto;display:block}
@media (max-width:760px){.site-header .brand .brand-logo{height:42px}}
.brand small{display:block;font-weight:600;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-bright);line-height:1}
.brand span{line-height:1.1}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav button{background:none;border:0;color:var(--band-muted);font-weight:600;font-size:.92rem;padding:8px 11px;border-radius:6px;cursor:pointer}
.nav button:hover,.nav button[aria-current="page"]{color:var(--band-ink);background:rgba(255,255,255,.06)}
.nav .btn{margin-left:8px}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid rgba(234,240,247,.3);color:var(--band-ink);border-radius:6px;padding:7px 10px;cursor:pointer}
@media (max-width:980px){
  .menu-btn{display:block}
  .nav{display:none;position:absolute;top:66px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--band);padding:12px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid rgba(255,255,255,.08)}
  .nav.open{display:flex}
  .nav button{text-align:left;padding:12px}
  .nav .btn{margin:8px 0 0}
}

/* Hero */
.hero{background:var(--band);color:var(--band-ink);padding-block:56px 64px;position:relative;overflow:hidden}
.hero h1{color:#fff}
.hero .lede{color:var(--band-muted)}
.hero-grid{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:clamp(40px,4vw,72px);align-items:center}
@media (max-width:980px){.hero-grid{grid-template-columns:1fr;gap:36px}}
.hero-points{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;color:var(--band-muted);font-size:.9rem}
.hero-points>span{display:flex;align-items:center;gap:7px}
.tick{width:18px;height:18px;flex:none}
.hero-try{display:none;color:var(--teal-bright);align-self:flex-start}
@media (max-width:980px){.hero-try{display:inline}}
.wedo{font-family:var(--f-mono);font-size:.8rem;color:var(--teal-bright);letter-spacing:.04em}

/* Try-it card (the bold idea) */
.tryit{background:#0F264B;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.tryit-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tryit-title{font-weight:700;color:#fff;font-size:.95rem}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.steps li{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;color:#8FA3BF;background:rgba(255,255,255,.05)}
.steps li.on{background:var(--teal-bright);color:#04232A}
.steps li.done{color:var(--teal-bright)}
.tryit .panel{background:#0A1A33;border-radius:12px;padding:20px;color:#E6ECF4}
.tryit .panel h3{color:#fff}
.tryit .q-opt{border-color:#2A3F60;color:#E6ECF4;background:transparent}
.tryit .q-opt:hover{border-color:var(--teal-bright)}
.tryit .q-opt.sel{border-color:var(--teal-bright);background:rgba(43,196,188,.12)}
.tryit .q-opt.right{border-color:#5DD39A;background:rgba(93,211,154,.12)}
.tryit .q-opt.wrong{border-color:#FF8A7E;background:rgba(255,138,126,.1)}
.tryit input[type=text]{background:#0F264B;border-color:#2A3F60;color:#fff}
.tryit input[type=text]::placeholder{color:#7F93B0}
.calc{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.calc input[type=range]{width:100%;accent-color:#2BC4BC}
.price-big{font-size:2rem;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.card.raised{box-shadow:var(--shadow)}
.course-card{display:flex;flex-direction:column;gap:14px}
.course-card .meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem}
.course-card .meta dt{color:var(--muted)}
.course-card .meta dd{margin:0;font-weight:600}
.course-card .price{font-size:1.6rem;font-weight:800}
.course-art{height:132px;border-radius:8px;background:var(--stage);position:relative;overflow:hidden}
.course-art.muted-art{background:var(--surface-2);border:1px dashed var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.teal{background:var(--soft);color:var(--soft-ink);border-color:transparent}
.icon-badge{width:44px;height:44px;border-radius:10px;background:var(--soft);color:var(--teal);display:grid;place-items:center;flex:none}
.icon-badge svg{width:22px;height:22px}

/* How it works: a real sequence, so numbers are information */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:s}
.flow li{list-style:none;padding:0 22px 0 0;position:relative}
.flow li .n{font-family:var(--f-mono);font-size:.8rem;color:var(--teal);font-weight:600}
.flow li::after{content:"";position:absolute;top:10px;left:34px;right:14px;height:1px;background:var(--line)}
.flow li:last-child::after{display:none}
.flow h3{margin:10px 0 6px;font-size:1.05rem}
@media (max-width:820px){.flow{grid-template-columns:1fr 1fr;gap:28px}.flow li::after{display:none}}
@media (max-width:480px){.flow{grid-template-columns:1fr}}
.principle{display:flex;gap:10px;flex-wrap:wrap;font-weight:800;font-size:clamp(1.2rem,2.6vw,1.7rem);letter-spacing:-.01em}
.principle span{color:var(--muted)}
.principle b{color:var(--ink)}

/* Footer */
.site-footer{background:var(--band);color:var(--band-muted);padding-block:48px 28px;margin-top:40px}
.site-footer h4{color:var(--band-ink);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.site-footer button{background:none;border:0;color:var(--band-muted);padding:3px 0;cursor:pointer;text-align:left;font-size:.92rem}
.site-footer button:hover{color:var(--teal-bright)}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px}
@media (max-width:760px){.foot-grid{grid-template-columns:1fr 1fr}}
.foot-col{display:flex;flex-direction:column}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.9rem}
.field .hint{font-size:.8rem;color:var(--muted)}
.field .err{font-size:.82rem;color:var(--bad);font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 12px;font-size:.95rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 22%,transparent)}
input.invalid{border-color:var(--bad)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
.pw-wrap{position:relative}
.pw-wrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--teal);font-weight:700;font-size:.82rem;cursor:pointer;padding:6px}
.code-boxes{display:flex;gap:8px}
.code-boxes input{width:48px;height:58px;text-align:center;font-family:var(--f-mono);font-size:1.5rem;padding:0}
.auth-shell{max-width:560px;margin:48px auto}
.checkbox{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.checkbox input{margin-top:4px;accent-color:var(--teal);width:16px;height:16px}

/* Tables */
.table-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:.8rem}

/* Stats */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat .k{font-size:.78rem;color:var(--muted);font-weight:600}
.stat .v{font-size:1.75rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}

/* App shell */
.app-head{padding-block:32px 8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:24px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal)}
.crumbs{font-size:.85rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs button{background:none;border:0;padding:0;color:var(--teal);cursor:pointer;font-weight:600}

/* Module list */
.mods{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.mod{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mod:last-child{border-bottom:0}
.mod .idx{font-family:var(--f-mono);font-weight:600;color:var(--muted);font-size:.85rem}
.mod.is-done .idx{color:var(--ok)}
.mod.is-locked{opacity:.65}

/* ===== Player ===== */
.player{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;border-radius:14px;overflow:hidden;background:var(--stage);color:var(--stage-ink);border:1px solid rgba(255,255,255,.06)}
.player.compact{grid-template-columns:1fr;border-radius:12px}
.player.compact .pl-notes{display:none}
@media (max-width:900px){.player{grid-template-columns:1fr}}
.pl-main{display:flex;flex-direction:column;min-width:0}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:radial-gradient(120% 90% at 85% 10%,#163A6B 0%,#0A1A33 60%);outline:none;container-type:inline-size}
.scene{position:absolute;inset:0;padding:6% 7%;display:flex;flex-direction:column;justify-content:center;gap:2.2%}
.scene{animation:sfade .6s ease-out}
@keyframes sfade{from{opacity:.25}}
.s-photo{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;animation:kb 14s ease-out forwards;transform-origin:70% 40%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
.scene.has-photo::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(6,16,34,.94) 0%,rgba(6,16,34,.82) 38%,rgba(6,16,34,.35) 70%,rgba(6,16,34,.1) 100%)}
.scene.has-photo>*:not(.s-photo){position:relative;z-index:2}
.scene.has-photo .s-title{text-shadow:0 2px 12px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.s-photo{animation:none}.scene{animation:none}}
.scene .s-kicker{font-family:var(--f-mono);color:var(--teal-bright);font-size:max(10px,1.5cqw);letter-spacing:.06em;text-transform:uppercase}
.scene .s-title{color:#fff;font-weight:800;font-size:4.4cqw;line-height:1.12;letter-spacing:-.02em;max-width:68%}
.scene.l-title .s-title{font-size:5.4cqw;max-width:62%}
.scene ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(4px,1.1vw,12px)}
.scene li{display:flex;gap:10px;align-items:flex-start;color:#DCE5F0;font-size:max(11px,2.3cqw);font-weight:600;opacity:.0;transform:translateY(8px);transition:opacity .45s,transform .45s}
.scene li.on{opacity:1;transform:none}
.scene li::before{content:"";flex:none;width:.55em;height:.55em;border-radius:2px;background:var(--teal-bright);margin-top:.45em}
.scene.l-grid ul{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,1.4vw,14px)}
.scene.l-grid li{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:clamp(6px,1.4vw,14px);flex-direction:column;gap:2px}
.scene.l-grid li::before{display:none}
.scene.l-grid li b{color:var(--teal-bright);font-size:.85em}
.scene.l-callout{border-left:0}
.scene.l-callout .s-title{padding-left:3%;border-left:4px solid var(--teal-bright)}
.scene.l-quote .s-title{font-size:5cqw;max-width:72%}
.scene.l-avoid li::before{background:#FF8A7E}
.scene.l-stat{justify-content:center;gap:1.4%}
.scene .s-stat{font-weight:900;font-size:13cqw;line-height:.95;letter-spacing:-.04em;background:linear-gradient(100deg,#fff 10%,var(--teal-bright) 60%,#9FE8E3);-webkit-background-clip:text;background-clip:text;color:transparent;animation:statIn .9s cubic-bezier(.2,.8,.2,1) both}
.scene.l-stat .s-title{font-size:3.1cqw;font-weight:700;max-width:60%;color:#E6EEF8;line-height:1.25}
.scene .s-src{font-family:var(--f-mono);font-size:max(9px,1.25cqw);color:#9FB0C6;margin-top:1%}
.scene .s-text{color:#DCE5F0;font-size:max(11px,2.3cqw);line-height:1.45;max-width:58%;margin:0;font-weight:600}
.scene .s-ring{position:absolute;right:7%;top:50%;width:24%;aspect-ratio:1;transform:translateY(-50%);border-radius:50%;background:conic-gradient(var(--teal-bright) 0 var(--p,50%),rgba(255,255,255,.08) 0);-webkit-mask:radial-gradient(circle,transparent 58%,#000 59%);mask:radial-gradient(circle,transparent 58%,#000 59%);animation:ringIn 1.4s ease-out both;opacity:.85}
@keyframes statIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes ringIn{from{opacity:0;transform:translateY(-50%) rotate(-90deg)}to{opacity:.85;transform:translateY(-50%)}}
@media (prefers-reduced-motion:reduce){.scene .s-stat,.scene .s-ring{animation:none}}
.lsrc{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.lsrc h4{margin:0 0 8px;font-size:.95rem}
.lsrc ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:.88rem}
.lsrc a{overflow-wrap:anywhere}
.cc{max-width:80%}
.scene ul.has-ic li::before{display:none}
.scene .ic.li-ic{flex:none;width:1.65em;height:1.65em;border-radius:.5em;display:grid;place-items:center;background:rgba(43,196,188,.16);border:1px solid rgba(43,196,188,.42);color:var(--teal-bright);margin-top:-.2em}
.scene .ic.li-ic svg{width:62%;height:62%}
.scene.l-avoid .ic.li-ic{background:rgba(255,138,126,.14);border-color:rgba(255,138,126,.45);color:#FF9C90}
.scene.l-grid .ic.li-ic{width:2em;height:2em;margin:0 0 .3em}
.scene.l-chart .s-title{font-size:3.3cqw;max-width:66%}
.scene ul.s-bars{gap:1.7cqw;width:62%;margin-top:1%}
.scene .s-bars li{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l v" "t t";gap:.5cqw 1.2cqw;align-items:end}
.scene .s-bars li::before{display:none}
.s-bars .bl{grid-area:l;font-size:max(10px,1.75cqw);color:#DCE5F0;font-weight:600}
.s-bars .bv{grid-area:v;font-size:max(12px,2.9cqw);font-weight:900;color:#fff;line-height:1}
.s-bars .bt{grid-area:t;height:1.6cqw;min-height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.s-bars .bt i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#13958F,var(--teal-bright),#9FE8E3);box-shadow:0 0 18px rgba(43,196,188,.5);transition:width 1.2s cubic-bezier(.2,.8,.2,1) .15s}
.s-bars li.on .bt i{width:var(--w)}
@media (prefers-reduced-motion:reduce){.s-bars .bt i{transition:none}}
.course-art .ca-ph{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .9s cubic-bezier(.2,.75,.2,1)}
.course-art.has-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(9,22,45,.93) 0%,rgba(9,22,45,.72) 48%,rgba(9,22,45,.18) 100%)}
.course-art.has-ph .ca-in,.course-art.has-ph .ca-ic{z-index:2}
.course-art.has-ph .ca-dots{display:none}
.course-card:hover .ca-ph{transform:scale(1.07)}
.scene .s-art{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:26%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(43,196,188,.35);display:grid;place-items:center;opacity:.9}
.scene .s-art::after{content:"";width:58%;aspect-ratio:1;border-radius:50%;background:rgba(43,196,188,.16);border:2px solid rgba(43,196,188,.55);animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.7}}
/* ---------- v1.3 slides: smart art, animated icons and numbers, checkpoints ---------- */
.stage::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(159,232,227,.09) 1px,transparent 1.2px);background-size:2.6cqw 2.6cqw;-webkit-mask-image:linear-gradient(115deg,transparent 35%,#000 95%);mask-image:linear-gradient(115deg,transparent 35%,#000 95%)}
.stage{background:radial-gradient(45% 60% at 92% 8%,rgba(43,196,188,.14),transparent 70%),radial-gradient(120% 90% at 85% 10%,#163A6B 0%,#0A1A33 60%)}
.scene{z-index:1}
.scene .s-kicker{display:inline-flex;align-items:center;gap:1cqw}
.scene .s-kicker::before{content:"";width:3.2cqw;height:2px;border-radius:2px;background:var(--teal-bright);animation:kick .7s .1s ease-out both}
@keyframes kick{from{width:0}}
.scene .s-title{animation:rise .6s .05s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(1.2cqw)}}
.scene .sn{position:absolute;right:3%;top:4.5%;z-index:3;font-family:var(--f-mono);font-size:max(8px,1.1cqw);letter-spacing:.1em;color:rgba(220,229,240,.55)}
.scene .s-art{display:grid;place-items:center}
.scene .s-art .ic{position:absolute;width:34%;height:34%;color:var(--teal-bright);z-index:2;animation:floaty 4s ease-in-out infinite}
.scene .s-art .ic svg{width:100%;height:100%}
.scene .s-art::before{content:"";position:absolute;inset:-14%;border-radius:50%;border:1px dashed rgba(43,196,188,.35);animation:spin 26s linear infinite}
@keyframes floaty{50%{transform:translateY(-6%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.scene.l-quote .s-qm{position:absolute;left:4.5%;top:2%;font-size:22cqw;line-height:1;font-weight:900;color:rgba(43,196,188,.12);font-family:Georgia,serif;pointer-events:none;animation:rise .8s both}
.scene.l-quote .s-title{position:relative;width:fit-content;background:linear-gradient(transparent 62%,rgba(43,196,188,.28) 62%) no-repeat 0 0/0 100%;animation:rise .6s both,hl 1.2s .7s ease-out forwards;-webkit-box-decoration-break:clone;box-decoration-break:clone}
@keyframes hl{to{background-size:100% 100%}}
.scene.no-ring .s-stat{font-size:11cqw}
.scene ul.has-ic li.on .ic.li-ic{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg)}100%{transform:none}}
.scene li .ic.li-ic svg .d{opacity:.35}
/* layout for diagrams beside the title */
.scene.art-side{display:grid;grid-template-columns:40% 1fr;grid-auto-rows:min-content;column-gap:5%;align-content:center;padding-bottom:12%}
.scene.art-side>*:not(.sa):not(.s-photo):not(.sn):not(.s-qm){grid-column:1}
.scene.art-side>.sa{grid-column:2;grid-row:1/span 6;align-self:center}
.scene.art-side .s-title{max-width:none;font-size:3.7cqw}
@container (max-width:540px){.scene.art-side{display:flex}.scene.art-side .s-title{font-size:4.4cqw}}
.scene .sa{margin:0;padding:0;list-style:none}
.scene .sa li{opacity:0;transform:translateY(1cqw);transition:opacity .5s,transform .5s,background .4s,border-color .4s}
.scene .sa li.on{opacity:1;transform:none}
.scene .sa li::before{display:none}
.scene[class*=" art-"]:not(.art-side){padding-bottom:13%}
.scene.has-photo>.sn{position:absolute}
.scene.has-photo>.s-qm{position:absolute}
.scene .sa b{color:#fff}
.scene [data-more]{cursor:pointer}
.scene [data-more]:focus-visible{outline:2px solid var(--teal-bright);outline-offset:2px}
/* process: numbered steps joined by arrows */
.scene .sa-process{display:flex;gap:2.2cqw;margin-top:2.4cqw}
.scene .sa-process li{flex:1;display:flex;flex-direction:column;gap:1cqw;position:relative;padding:1.6cqw 1.5cqw;border-radius:1.2cqw;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:max(10px,1.75cqw);line-height:1.35;color:#DCE5F0}
.scene .sa-process li.on{background:rgba(43,196,188,.1);border-color:rgba(43,196,188,.5)}
.scene .sa-process li:not(:last-child)::after{content:"";position:absolute;right:-2.2cqw;top:3.1cqw;width:2.2cqw;height:2px;background:var(--teal-bright);transform-origin:left;transform:scaleX(0);transition:transform .45s .35s}
.scene .sa-process li.on:not(:last-child)::after{transform:scaleX(1)}
.scene .sa-head{display:flex;align-items:center;gap:1cqw}
.scene .sa-n{display:grid;place-items:center;width:3.4cqw;height:3.4cqw;min-width:20px;min-height:20px;border-radius:50%;font-weight:900;font-size:max(10px,1.6cqw);color:#06243F;background:var(--teal-bright)}
.scene .sa-process li.on .sa-n{animation:ping 1.4s ease-out 1}
@keyframes ping{from{box-shadow:0 0 0 0 rgba(43,196,188,.7)}to{box-shadow:0 0 0 1.8cqw rgba(43,196,188,0)}}
.scene .sa-t b{display:block;margin-bottom:.3cqw}
/* stairs: each step higher than the last */
.scene .sa-stairs{display:flex;align-items:flex-end;gap:1.2cqw;height:21cqw;margin-top:1.6cqw}
.scene .sa-stairs li{flex:1;height:calc(56% + 44% * var(--k) / max(1, var(--n) - 1));display:flex;align-items:stretch}
.scene .sa-step{flex:1;display:flex;flex-direction:column;gap:.6cqw;padding:1.3cqw;border-radius:1cqw 1cqw .3cqw .3cqw;background:linear-gradient(180deg,rgba(43,196,188,calc(.12 + .1 * var(--k))),rgba(43,196,188,.04));border:1px solid rgba(43,196,188,.35);border-bottom:3px solid var(--teal-bright);font-size:max(9px,1.55cqw);line-height:1.3;color:#DCE5F0;transform-origin:bottom;transform:scaleY(.2);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.scene .sa-stairs li.on .sa-step{transform:none}
.scene .sa-step b{font-size:max(11px,2.1cqw)}
/* timeline */
.scene .sa-time{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:1.6cqw;margin-top:3cqw;position:relative}
.scene .sa-time::before{content:"";position:absolute;left:0;right:0;top:1.9cqw;height:2px;background:rgba(255,255,255,.15)}
.scene .sa-time li{display:flex;flex-direction:column;gap:.6cqw;font-size:max(9px,1.6cqw);line-height:1.35;color:#DCE5F0;position:relative}
.scene .sa-time li::after{content:"";position:absolute;left:0;top:1.9cqw;height:2px;width:100%;background:var(--teal-bright);transform-origin:left;transform:scaleX(0);transition:transform .7s}
.scene .sa-time li.on::after{transform:scaleX(1)}
.scene .sa-dot{position:relative;z-index:1;display:grid;place-items:center;width:3.8cqw;height:3.8cqw;border-radius:50%;background:#0A1A33;border:2px solid var(--teal-bright);color:var(--teal-bright)}
.scene .sa-dot:empty::after{content:"";width:35%;height:35%;border-radius:50%;background:var(--teal-bright)}
.scene .sa-dot .ic.li-ic{background:none;border:0;width:70%;height:70%;margin:0}
.scene .sa-time b{font-size:max(11px,2cqw)}
/* checklist and avoid lists: ticks and crosses draw themselves */
.scene .sa-check,.scene .sa-avoid{display:flex;flex-direction:column;gap:1.3cqw;margin-top:1.6cqw;max-width:72%}
.scene .sa-check li,.scene .sa-avoid li{display:flex;align-items:center;gap:1.4cqw;font-size:max(11px,2.2cqw);font-weight:600;color:#DCE5F0}
.scene .sa-mk{flex:none;width:3.4cqw;height:3.4cqw;min-width:18px;min-height:18px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scene .sa-mk circle{stroke:rgba(43,196,188,.45);fill:rgba(43,196,188,.12)}
.scene .sa-mk path{stroke:var(--teal-bright);stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .5s .25s}
.scene .sa li.on .sa-mk path{stroke-dashoffset:0}

.scene .sa-avoid li:not(.ok) .sa-mk path{stroke:#FF9C90}
.scene .sa-avoid li.ok{color:#fff}
/* route: if this, then that */
.scene .sa-route{display:flex;flex-direction:column;gap:1.2cqw;margin-top:1.8cqw;max-width:86%}
.scene .sa-route li{display:grid;grid-template-columns:30% 9% 1fr;align-items:center;font-size:max(10px,1.9cqw);color:#DCE5F0}
.scene .sa-if{padding:1cqw 1.4cqw;border-radius:.8cqw;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-weight:800;color:#fff}
.scene .sa-arr{height:2px;position:relative;margin:0 .8cqw}
.scene .sa-arr i{position:absolute;inset:0;background:var(--teal-bright);transform-origin:left;transform:scaleX(0);transition:transform .45s .2s}
.scene .sa-arr i::after{content:"";position:absolute;right:-1px;top:-.55cqw;border:.6cqw solid transparent;border-left-color:var(--teal-bright);border-right:0}
.scene .sa-route li.on .sa-arr i{transform:scaleX(1)}
.scene .sa-then{padding:1cqw 1.4cqw;border-left:3px solid var(--teal-bright);background:rgba(43,196,188,.08);border-radius:0 .8cqw .8cqw 0}
/* quad: four cards, some open to explore */
.scene .sa-quadw{display:flex;flex-direction:column;gap:1cqw}
.scene .sa-tap{align-self:flex-end;font-family:var(--f-mono);font-size:max(9px,1.15cqw);letter-spacing:.06em;text-transform:uppercase;color:var(--teal-bright);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.scene .sa-quad{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw;list-style:none;margin:0;padding:0}
.scene .sa-quad li{position:relative;display:flex;flex-direction:column;gap:.6cqw;padding:1.6cqw;min-height:11cqw;border-radius:1.2cqw;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:max(9px,1.55cqw);line-height:1.35;color:#DCE5F0;overflow:hidden}
.scene .sa-quad li.on{border-color:rgba(43,196,188,.45)}
.scene .sa-q-top{display:flex;align-items:center;gap:1cqw}
.scene .sa-q-top b{font-size:max(11px,2.1cqw);color:var(--teal-bright)}
.scene .sa-quad .ic.li-ic{width:3.2cqw;height:3.2cqw;margin:0}
.scene .sa-quad{position:relative}
.scene .sa-more{position:absolute;inset:0;z-index:3;padding:2.2cqw 2.6cqw;background:linear-gradient(160deg,#0F3A4A,#0A2438);border:1px solid rgba(43,196,188,.55);border-radius:1.2cqw;color:#fff;font-size:max(10px,1.75cqw);line-height:1.5;display:flex;flex-direction:column;justify-content:center;gap:.8cqw;opacity:0;visibility:hidden;transform:scale(.96);transition:opacity .3s,transform .3s,visibility .3s}

.scene .sa-quad li.open{position:static}
.scene .sa-quad li.open .sa-more{opacity:1;visibility:visible;transform:none}
.scene .sa-plus{position:absolute;right:1cqw;top:.8cqw;width:2.4cqw;height:2.4cqw;min-width:16px;min-height:16px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:max(10px,1.6cqw);color:#06243F;background:var(--teal-bright);transition:transform .3s;z-index:2}

/* hub and cycle */
.scene .sa-hub,.scene .sa-cycle{position:relative;width:100%;aspect-ratio:1.5}

.scene .sa-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28%;aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4cqw;text-align:center;background:radial-gradient(circle at 35% 30%,#1F7F86,#0B3554);box-shadow:0 0 0 .5cqw rgba(43,196,188,.18),0 0 3cqw rgba(43,196,188,.35);color:#fff;font-size:max(9px,1.5cqw);animation:breathe 3.4s ease-in-out infinite}
.scene .sa-core .ic{width:3.6cqw;height:3.6cqw;color:var(--teal-bright)}
@keyframes breathe{50%{box-shadow:0 0 0 1cqw rgba(43,196,188,.08),0 0 4cqw rgba(43,196,188,.45)}}
.scene .sa-hub ul,.scene .sa-cycle ul{list-style:none;margin:0;padding:0}
.scene .sa-hub li,.scene .sa-cycle li{position:absolute;width:40%;display:flex;gap:.8cqw;align-items:flex-start;padding:1.1cqw 1.2cqw;border-radius:1cqw;background:rgba(10,26,51,.88);border:1px solid rgba(43,196,188,.35);font-size:max(9px,1.4cqw);line-height:1.3;color:#DCE5F0;backdrop-filter:blur(3px)}

.cstrip{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}

.chk-points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:.95rem}
.chk-points li{display:flex;gap:8px;align-items:center}.chk-points .tick{color:var(--teal)}
.chk-card{display:flex;flex-direction:column;gap:16px;min-height:380px}
.chk-q{font-size:1.25rem}
.chk-staff{display:flex;align-items:baseline;gap:12px}.chk-staff b{font-size:3rem;font-weight:800;line-height:1}
.chk-score{display:flex;gap:20px;align-items:center}
.ring{--p:0;width:118px;height:118px;flex:none;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;position:relative;border:1px solid var(--line)}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--surface)}
.ring>*{position:relative;grid-area:1/1;text-align:center}.ring b{font-size:2.1rem;font-weight:800;margin-top:-14px}.ring span{font-size:.7rem;color:var(--muted);margin-top:34px}
.chk-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.chk-steps li{display:grid;grid-template-columns:64px 1fr;gap:10px;font-size:.92rem;align-items:baseline}.chk-steps li .mono{color:var(--teal)}
.chk-rec{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px;border-radius:var(--r);background:var(--soft);color:var(--soft-ink)}
.chk-rec b{color:var(--ink);font-size:1.05rem}
.chk-form{display:flex;flex-direction:column;gap:6px}
.chk-link{color:var(--teal-bright);align-self:flex-start;text-align:left}
.showcase{position:relative;display:flex;gap:8px;height:clamp(480px,36vw,600px)}
.sc-panel{position:relative;flex:0 0 60px;min-width:0;border-radius:16px;overflow:hidden;background:#0F264B;transition:flex-grow .7s cubic-bezier(.2,.75,.2,1);box-shadow:0 24px 50px rgba(0,0,0,.3);isolation:isolate}
.sc-panel.open{flex-grow:1}
.sc-bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04);transition:transform 7s ease-out,filter .7s}
.sc-art{width:100%;height:100%;display:block}
.sc-panel.open .sc-bg{transform:scale(1.13)}
.sc-panel:not(.open) .sc-bg{filter:saturate(.55) brightness(.62)}
.sc-panel.open[data-key="parents"] .sc-bg{filter:brightness(1.45) saturate(1.1)}
.sc-panel::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(6,16,34,.35) 0%,rgba(6,16,34,.2) 22%,rgba(6,16,34,.7) 50%,rgba(6,16,34,.96) 78%);pointer-events:none}
.sc-tab{position:absolute;z-index:3;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:20px 0;background:none;border:0;color:#fff;cursor:pointer}
.sc-panel.open .sc-tab{width:auto;height:auto;flex-direction:row;padding:16px 18px;cursor:default;justify-content:flex-start}
.sc-ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px)}
.sc-ico svg{width:19px;height:19px}
.sc-label{font-weight:800;font-size:.9rem;letter-spacing:.02em;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.sc-panel.open .sc-tab{pointer-events:none}
.sc-tab:focus-visible{outline:none}
.sc-tab:focus-visible .sc-ico{outline:3px solid var(--teal-bright);outline-offset:3px}
.sc-panel.open .sc-label{writing-mode:horizontal-tb;transform:none;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em}
.sc-panel.open .sc-ico{background:var(--teal-bright);color:#04232A;border-color:transparent}
.sc-body{position:absolute;z-index:2;left:0;bottom:0;width:max(100%,440px);padding:24px;display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(14px);transition:opacity .15s,transform .15s;pointer-events:none}
.sc-panel.open .sc-body{opacity:1;transform:none;pointer-events:auto;transition:opacity .45s .35s,transform .45s .35s}
.sc-kicker{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-bright)}
.sc-body h3{color:#fff;font-size:clamp(1.3rem,2.2vw,1.75rem);font-weight:800;max-width:20ch}
.sc-text{color:#C9D6EA;font-size:.95rem;max-width:44ch}
.sc-chips{display:flex;flex-wrap:wrap;gap:6px}
.sc-chips span{font-size:.74rem;font-weight:700;color:#fff;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.sc-body .btn{align-self:flex-start;margin-top:4px}

.sc-note b{color:#0A7E7B;margin-right:4px}
.sc-panel.open .sc-note{animation:scnote .5s cubic-bezier(.2,.75,.2,1) forwards;animation-delay:calc(.55s + var(--d)*.45s)}
@keyframes scnote{to{opacity:1;transform:none}}
.sc-progress{position:absolute;left:12px;right:12px;bottom:-14px;height:3px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.sc-progress i{display:block;height:100%;width:0;background:var(--teal-bright);animation:scprog 6s linear forwards}
.showcase.held .sc-progress i{animation-play-state:paused}
@keyframes scprog{to{width:100%}}
@media (max-width:760px){.sc-body{width:100%}.showcase{flex-direction:column;height:auto;gap:8px}.sc-panel{flex:none;height:62px;transition:height .6s cubic-bezier(.2,.75,.2,1)}.sc-panel.open{height:540px}.sc-float{display:none!important}
 .sc-tab{flex-direction:row;justify-content:flex-start;padding:12px 16px}.sc-label{writing-mode:horizontal-tb;transform:none}.sc-float{top:64px}.sc-progress{bottom:-10px}}
@media (prefers-reduced-motion:reduce){.sc-panel,.sc-bg,.sc-body{transition:none}.sc-panel.open .sc-note{animation:none;opacity:1;transform:none}.sc-progress{display:none}}
/* ---------- Icons ---------- */
.ic{display:inline-grid;place-items:center;width:1.2em;height:1.2em;flex:none;line-height:0}

.icb{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;color:var(--teal);background:linear-gradient(135deg,var(--soft),color-mix(in srgb,var(--teal) 14%,var(--surface)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--teal) 25%,transparent);transition:transform .4s cubic-bezier(.2,.75,.2,1)}

.chk-points{color:var(--muted)}

.ic-row{display:inline-flex;align-items:center;gap:6px}

/* ---------- Hero ---------- */
.hero-x{position:relative;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.hero-bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.hero-bg i:nth-child(1){width:520px;height:520px;left:-140px;top:-160px;background:radial-gradient(circle,#1F6F86,transparent 70%)}
.hero-bg i:nth-child(2){width:600px;height:600px;right:-180px;top:10%;background:radial-gradient(circle,#2BC4BC,transparent 68%);opacity:.28;animation-duration:28s}
.hero-bg i:nth-child(3){width:460px;height:460px;left:35%;bottom:-260px;background:radial-gradient(circle,#3A5BA8,transparent 70%);opacity:.4;animation-duration:34s}
.hero-bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 30% 40%,#000 0%,transparent 70%)}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.08)}100%{transform:translate(-40px,70px) scale(.95)}}
.grad{background:linear-gradient(100deg,#FFFFFF 0%,#BFF7F2 40%,#2BC4BC 75%,#BFF7F2 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradshift 9s ease-in-out infinite alternate}
@keyframes gradshift{to{background-position:100% 0}}
.pill-glass{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:7px 14px 7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(43,196,188,.35);color:var(--teal-bright);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;backdrop-filter:blur(8px)}

.hero-x .hero-points{gap:10px}

.btn-shine{position:relative;overflow:hidden}

.how-x{background:var(--surface);border-block:1px solid var(--line)}
